# Histórico de versões dos laboratórios (ADR-017). Fonte para docs/catalogo/CATALOGO_DE_LABORATORIOS.md.
#
# Ao criar um lab ou publicar uma versão nova:
#   1. acrescente a versão aqui, com a data de publicação e um resumo da mudança;
#   2. rode `uv run python scripts/gen-catalogo.py` para regenerar o catálogo.
# O CI falha se a versão de um manifesto não estiver aqui ou se o catálogo estiver desatualizado.
# A data em que uma versão ficou obsoleta é a data de publicação da versão seguinte (calculada).
# Datas: publicação no repositório (ambiente local); quando houver implantação, valerá a data de publicação nela.
labs:
  LAB-000:
    - version: 0.1.0
      published: 2026-11-11
      summary: Primeira versão do lab benigno de verificação do motor.
    - version: 0.2.0

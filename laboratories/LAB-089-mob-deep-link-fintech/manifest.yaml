steps:
  - id: conhecer
    order: 1
    title: Conhecer o app e a confirmação da operação
    explanation: |
      Você está no time de apps do banco digital Pagomais. Há um mês, o marketing lançou a campanha "Pix em um toque": um link `pagomais://pix?...`, enviado por e-mail e redes sociais, abre o app com o Pix já preenchido. Esta semana, a central recebeu 37 reclamações de Pix de R$ 1.950,00 para "Premios Cashback Ltda", que os clientes juram não ter feito. Todos tinham tocado num link recebido pelo WhatsApp prometendo cashback.

      **Um laboratório mobile.** Na aba **Aplicação**, o app aparece numa moldura de celular. Ele é um app **simulado** (não há emulador), mas fala com a API do servidor do mesmo jeito que um app Android ou iOS. Toda falha de app mobile termina numa decisão de segurança: quem a toma, o aparelho ou o servidor?

      Um **deep link** é um endereço do tipo `pagomais://pix?...` que o sistema do celular entrega ao app: o app abre direto numa tela, já com os dados do link. É ótimo para navegar. O problema começa quando o link também **executa** uma ação.

      ```ilustracao
      deep-link-confirmacao
      ```

      Siga a Pix pelas camadas:

      1. **App** (`static/app.js`): o botão chama `POST /api/operacoes`; um link chama `POST /api/operacoes/rapida`.
      2. **Controller** (`controllers/api_controller.py`): identifica o usuário e chama o serviço.
      3. **Serviço** (`services/operacao_service.py`): decide se a operação fica pendente ou é executada. **É aqui que está a falha.**

      As credenciais de teste deste laboratório são:

      - Usuário `ana.ribeiro`, senha `Ana#Pagomais26` (Ana Ribeiro Teixeira).
    task: |
      1. Na aba **Aplicação**, entre com `ana.ribeiro` e a senha `Ana#Pagomais26`. (Ignore por enquanto a notificação no topo da tela de login.)
      2. Toque no botão **Transferir R$ 500,00 por PIX**. O app mostra a tela **Confirmar Pix**. Toque em **Confirmar** e veja a operação em **Operações recentes**.
      3. Na aba **Código**, abra `services/operacao_service.py`.

      Informe abaixo o nome do método do serviço que executa a operação depois que o usuário toca em **Confirmar**.
    explore: |
      **Veja as duas etapas na API.** O botão não executa nada: `iniciar` grava a operação como `pendente` e devolve um código de confirmação aleatório. Só `confirmar`, com esse código, executa, e o código é apagado em seguida (uso único).

      **Por que vale olhar.** É esse desenho que impede que alguém dispare a Pix sem o usuário ver e aceitar. O passo seguinte é ver um caminho que não segue o desenho.
    concept: Operação sensível em duas etapas, com confirmação de uso único
    validatorRef: mob-deep-link/answer/metodo-confirma-fin-v1
    hints:
      - level: 1
        text: A classe `OperacaoService` tem três métodos públicos.
      - level: 2
        text: É o método que recebe o código de confirmação.
      - level: 3
        text: A resposta é `confirmar`.
    points: 10
  - id: explorar
    order: 2
    title: Tocar no link que chegou ao celular
    explanation: |
      Faça o que os usuários fizeram: toque no link que chegou por **WhatsApp**. Repare no que o app mostra (ou não mostra) antes de a operação acontecer.
    task: |
      1. No app, toque em **Sair**. Na tela de login aparece a notificação de **WhatsApp** com o link `pagomais://pix?alvo=Premios+Cashback+Ltda&detalhe=R$+1.950,00`.
      2. Toque na notificação. O app pede o login: entre de novo com `ana.ribeiro` / `Ana#Pagomais26` (da etapa 1).
      3. Veja a mensagem no topo e a lista **Operações recentes**.

      Informe abaixo o status que aparece ao lado de **Premios Cashback Ltda** em **Operações recentes**.
    explore: |
      **A tela não decide nada: é o servidor.** Faça pelo **Terminal** o mesmo pedido que o app fez ao abrir o link:

      ```bash
      TOKEN=$(curl -s -X POST http://127.0.0.1:8080/api/login -H "Content-Type: application/json" -d '{"login":"ana.ribeiro","senha":"Ana#Pagomais26"}' | python -c "import json,sys; print(json.load(sys.stdin)['token'])")
      curl -s -X POST http://127.0.0.1:8080/api/operacoes/rapida -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"alvo":"Premios Cashback Ltda","detalhe":"R$ 1.950,00"}'
      ```

      **O que esperar.** A resposta já vem com `"status": "concluida"`, sem código de confirmação. Qualquer pessoa que consiga fazer um link chegar ao celular do cliente (WhatsApp, SMS, e-mail, um QR Code numa vitrine) faz um Pix da conta dele, no valor e para a chave que quiser, com um único toque.
    concept: O caminho do link executa sem confirmação
    validatorRef: mob-deep-link/answer/status-fin-v1
    hints:
      - level: 1
        text: É a última coluna da linha de **Premios Cashback Ltda**.
      - level: 2
        text: Não é `pendente`.
      - level: 3
        text: A resposta é `concluida`.
    points: 15
  - id: conceito
    order: 3
    title: Saber quem pode criar o link
    explanation: |
      O esquema `pagomais://` não é uma senha nem uma assinatura: é só um nome que o app registrou no celular. Um link desses pode estar num SMS, num e-mail, numa página, num QR Code ou ser aberto por outro app instalado. Os dados do link (`alvo`, `detalhe`) são escritos por quem criou o link.
    task: |
      Quem pode criar e enviar um link `pagomais://pix?...` com os dados que quiser?

      Responda em poucas palavras.
    explore: |
      **No Android e no iOS.** No Android, o link chega ao app por um *intent filter* no `AndroidManifest.xml`; no iOS, pelo `CFBundleURLTypes` do `Info.plist`. Qualquer app pode registrar o mesmo esquema, e o sistema pode entregar o link ao app errado. **App Links** (Android) e **Universal Links** (iOS) ligam o link a um domínio verificado, mas continuam sendo entrada externa: o app abre, e a ação ainda precisa de confirmação.
    concept: Deep link é entrada externa, escrita por qualquer um
    validatorRef: mob-deep-link/answer/quem-fin-v1
    hints:
      - level: 1
        text: Pense em quem consegue mandar um SMS ou um e-mail com um link.
      - level: 2
        text: Não é só a Pagomais.
      - level: 3
        text: A resposta é `qualquer pessoa`.
    points: 15
  - id: onde
    order: 4
    title: Encontrar o caminho que pula a confirmação
    explanation: |
      Volte a `services/operacao_service.py`. O botão usa `iniciar`, que cria a operação **pendente**. O link usa outro método, que grava a operação direto como `concluida`, sem gerar código de confirmação.
    task: |
      Informe abaixo o nome do método que executa a operação vinda do link sem confirmação.
    concept: O atalho do link está no serviço, não na tela
    validatorRef: mob-deep-link/answer/metodo-fin-v1
    hints:
      - level: 1
        text: É o método chamado pela rota `/api/operacoes/rapida`.
      - level: 2
        text: O nome termina em `_por_link`.
      - level: 3
        text: A resposta é `iniciar_por_link`.
    points: 15
  - id: corrigir
    order: 5
    title: Exigir a confirmação também no link
    explanation: |
      **Por que a falha existe.** `iniciar_por_link` grava a operação como `concluida` na hora.

      **A correção.** O link pode continuar abrindo o app com os dados preenchidos, mas só cria a operação **pendente**, exatamente como o botão. O app já sabe mostrar a tela **Confirmar Pix** quando a resposta vem pendente, e a operação só acontece com o código de uso único. Corrigir no app (uma janela de "tem certeza?") não basta: a chamada direta à API, como a do **Explorar mais** da etapa 2, pula qualquer tela.
    task: |
      Abra `services/operacao_service.py` e troque o método `iniciar_por_link` inteiro por este:

      ```python
          def iniciar_por_link(self, conta_id: int, alvo: str, detalhe: str) -> dict:
              """Operação vinda de um link (deep link): nunca executa direto, só cria a pendente para o usuário confirmar."""
              return self.iniciar(conta_id, alvo, detalhe)
      ```

      Salve com **Ctrl+S**. A aplicação reinicia (e as operações voltam ao início). Então:

      1. no app, toque em **Sair**, toque na notificação e entre de novo com as credenciais da etapa 1: agora aparece a tela **Confirmar Pix** com os dados do link;
      2. toque em **Cancelar** e veja que nada entrou em **Operações recentes** como `concluida`;
      3. clique em **Validar**.
    explore: |
      **Repita o curl da etapa 2.** A resposta agora vem com `"pendente": true` e um `confirmacao`. Tente confirmar duas vezes com o mesmo código:

      ```bash
      curl -s -X POST http://127.0.0.1:8080/api/operacoes/confirmar -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"confirmacao":"COLE-O-CODIGO-AQUI"}'
      ```

      A primeira executa; a segunda é recusada, porque o código é apagado ao confirmar.

      **Se algo não funcionar depois de salvar.** No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      O `def iniciar_por_link` fica com 4 espaços; o corpo, com 8.
    concept: A ação vinda de link exige confirmação de uso único no servidor
    validatorRef: mob-deep-link/python-flask/link-confirmado-fin-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/operacao_service.py`, no método `iniciar_por_link`.'
      - level: 2
        text: O link deve seguir o mesmo caminho do botão, que já cria a operação pendente.
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def` fica com 4 espaços.
    points: 45

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender o que é um deep link e por que ele é entrada externa, como um formulário
    - Mostrar que um link aberto no celular executa a operação sem o usuário confirmar
    - Saber por que a confirmação precisa ser exigida pelo servidor, e não só pela tela do app
    - Corrigir o caminho do link para criar a operação pendente com código de confirmação de uso único
  story:
    role: >-
      Pessoa desenvolvedora do time de apps do banco digital Pagomais
    application: >-
      App Pagomais, o app em que o cliente consulta o extrato e faz Pix
    context: >-
      O marketing da Pagomais lançou a campanha "Pix em um toque": um link pagomais://pix abre o app com o Pix já preenchido. Clientes começaram a reclamar de Pix que não fizeram, todos depois de tocar num link recebido pelo WhatsApp.
    mission: >-
      Mostrar que um link aberto no celular executa a operação sem o usuário confirmar e corrigir o servidor para exigir a confirmação de uso único também nesse caminho
  wrapUp:
    text: |
      Agora um link só leva o usuário até a tela de confirmação: a Pix só acontece quando ele toca em **Confirmar**, e o código de confirmação vale uma vez. Em um app real, vale reforçar:

      - **Link é entrada externa.** Qualquer app, página, SMS ou QR Code pode abrir `pagomais://...` com os dados que quiser. Trate os parâmetros como um formulário vindo da internet: valide e nunca execute ação sensível direto.
      - **Prefira links verificados.** Android App Links e iOS Universal Links ligam o link a um domínio seu, o que reduz o sequestro do esquema por outro app. Mesmo assim, o link só navega; a ação continua pedindo confirmação.
      - **A confirmação é do servidor.** Um app adulterado ou uma chamada direta à API pulam qualquer tela. É o servidor que exige o código de uso único (e, para valores altos, biometria ou senha transacional).
      - **Desconfie de atalhos de marketing.** "Um toque" é ótimo para navegar, nunca para mover dinheiro, compartilhar dados ou liberar equipamento.

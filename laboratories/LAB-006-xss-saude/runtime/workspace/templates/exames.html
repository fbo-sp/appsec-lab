{% extends "base.html" %}
{% block conteudo %}
<h1>Meus exames</h1>
<form method="get" action="{{ url_for('exame.buscar') }}" class="busca">
  <input name="q" value="{{ termo }}" placeholder="Nome do exame" aria-label="Meus exames">
  <button type="submit">Buscar</button>
</form>

{% if termo %}
{# O serviço já remove <script> do termo, então o destaque pode ir direto para a página. #}
<p class="resultado">Resultados para <mark>{{ termo|safe }}</mark></p>
{% endif %}

<table class="lista">
  <thead><tr><th>Exame</th><th>Unidade</th><th>Observação para a coleta</th></tr></thead>
  <tbody>
  {% for item in itens %}
    <tr><td>{{ item.nome }}</td><td>{{ item.detalhe }}</td><td>{{ item.nota }}</td></tr>
  {% else %}
    <tr><td colspan="3" class="vazio">Nada encontrado.</td></tr>
  {% endfor %}
  </tbody>
</table>

<h2>Agendar exame</h2>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<form method="post" action="{{ url_for('exame.cadastrar') }}" class="cartao cadastro">
  <label>Exame <input name="nome" required></label>
  <label>Unidade <input name="detalhe"></label>
  <label>Observação para a coleta <input name="nota" placeholder="Ex.: em jejum, uso medicação"></label>
  <button type="submit">Cadastrar</button>
</form>
{% endblock %}

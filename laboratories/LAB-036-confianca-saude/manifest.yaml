steps:
  - id: conhecer
    order: 1
    title: Conhecer a loja e achar o resgate
    explanation: |
      Você é do time de produtos digitais da operadora Sereno Saúde. O beneficiário resgata produtos no Clube de Bem-Estar gastando pontos. Numa auditoria, a equipe apontou que o resgate confia no custo que chega do formulário, e que dá para resgatar um produto de 300 pontos informando um custo de 1 ponto.

      A falha aqui é de **confiança em dado do cliente**: o servidor usa, para decidir quanto cobrar, um valor que veio do formulário — um dado que quem faz o pedido controla. O custo do produto, porém, é um dado da **loja**: ele está no banco.

      ```ilustracao
      confianca-cliente
      ```

      Siga o resgate pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): recebe o `produto_id` e o `custo` do formulário e chama o serviço.
      2. **Serviço** (`services/loja_service.py`): debita os pontos. **É aqui que se decide de onde vem o custo.**

      As credenciais de acesso, neste laboratório, são:

      - Usuário `rafael.antunes`, senha `Rafael#Sereno26` (saldo inicial de 500 pontos).
    task: |
      1. Na aba **Aplicação**, entre com `rafael.antunes` e a senha `Rafael#Sereno26`. Você vê o catálogo e o seu saldo.
      2. Resgate um produto normalmente e veja o saldo cair pelo custo real.
      3. Na aba **Código**, abra `services/loja_service.py`.

      Informe abaixo o nome do método que resgata o produto (o que o controller chama).
    concept: Confiança em dado do cliente — o servidor confia num valor que o cliente controla
    validatorRef: confianca-cliente/answer/metodo-sau-v1
    hints:
      - level: 1
        text: 'Em `services/loja_service.py`, a classe `LojaService` tem um único método público.'
      - level: 2
        text: É o método que o controller chama para efetivar o resgate.
      - level: 3
        text: O valor é `resgatar`.
    points: 10
  - id: explorar
    order: 2
    title: Resgatar um produto caro pagando 1 ponto
    explanation: |
      O formulário manda o `custo` junto com o `produto_id`, e o serviço **debita esse custo**, sem conferir com o custo real do produto. O campo de custo é um `input type="hidden"` — dá para editá-lo no navegador ou mandar o pedido direto por `curl`.
    task: |
      Na aba **Terminal**, resgate o produto 1 (que custa 300 pontos) pagando só 1 ponto:

      ```bash
      curl -s -X POST http://127.0.0.1:8080/resgatar -d "produto_id=1&custo=1" --cookie-jar /tmp/c --cookie /tmp/c
      ```

      Se precisar, faça login pela aba **Aplicação** primeiro. Veja que o resgate é aceito e o saldo cai só 1 ponto. Informe abaixo quem deveria definir o custo do produto: o **cliente** ou a **loja**.
    explore: |
      **Pela tela também dá.** Na aba **Aplicação**, abra as ferramentas de desenvolvedor, ache o campo escondido `custo` do produto caro e troque o valor para `1` antes de clicar em Resgatar. O resultado é o mesmo: campo escondido não é campo seguro.
    concept: O servidor confia no custo do formulário, que o cliente adultera
    validatorRef: confianca-cliente/answer/quem-define-sau-v1
    hints:
      - level: 1
        text: O custo é uma informação da loja, não uma escolha de quem compra.
      - level: 2
        text: Quem vende é que define o preço; o comprador só escolhe o produto.
      - level: 3
        text: A resposta é `loja` (ou servidor).
    points: 15
  - id: fonte
    order: 3
    title: Dizer de onde o custo deve vir
    explanation: |
      O cliente escolhe **qual** produto (o `produto_id`). O **custo** é consequência disso, e quem resolve é o servidor, olhando o produto no banco. O valor de custo que chega no formulário não deveria nem ser usado.
    task: |
      De onde o servidor deve ler o custo real do produto, em vez de confiar no formulário?

      Responda com uma palavra (onde a loja guarda o custo de cada produto).
    concept: O custo real vem do produto no banco, no servidor
    validatorRef: confianca-cliente/answer/vem-de-onde-sau-v1
    hints:
      - level: 1
        text: É a fonte da verdade da loja, no servidor.
      - level: 2
        text: O custo de cada produto está guardado lá, junto com o nome.
      - level: 3
        text: A resposta é `banco` (o produto no banco).
    points: 15
  - id: confiar
    order: 4
    title: Decidir se o servidor pode confiar no formulário
    explanation: |
      A regra geral: o servidor **não confia** em dado que o cliente controla e que ele mesmo pode determinar. Esconder o campo (`type="hidden"`) não muda nada — ele aparece no HTML e é editável. A decisão de custo tem que ser do servidor.
    task: |
      O servidor deve confiar no custo que veio do formulário?

      Responda com uma palavra (sim ou não).
    concept: O servidor não confia em dado que o cliente controla
    validatorRef: confianca-cliente/answer/confiar-sau-v1
    hints:
      - level: 1
        text: O cliente consegue mandar qualquer custo que quiser.
      - level: 2
        text: O servidor tem o custo real; não precisa do valor do formulário.
      - level: 3
        text: A resposta é `não`.
    points: 15
  - id: corrigir
    order: 5
    title: Usar o custo real do produto no serviço
    explanation: |
      **Por que a falha existe.** `resgatar` debita o `custo_informado` que veio do formulário, sem olhar o custo real do produto. Quem faz o pedido escolhe o custo.

      **A correção.** Ler o custo do próprio produto (já buscado no banco) e debitar esse valor, ignorando o do formulário. De quebra, conferir se o saldo cobre o custo.
    task: |
      Abra `services/loja_service.py` e troque o método `resgatar` inteiro por este:

      ```python
          def resgatar(self, conta_id: int, produto_id: int, custo_informado: int) -> float:
              """Resgata o produto para a conta e devolve o novo saldo de pontos."""
              conta = self._contas.buscar(conta_id)
              if conta is None:
                  raise ValueError("Conta não encontrada.")
              produto = self._produtos.buscar(produto_id)
              if produto is None:
                  raise ValueError("Produto não encontrado.")
              # O custo é o do produto no banco; o valor do formulário é ignorado.
              if produto.custo > conta.saldo:
                  raise ValueError("Saldo de pontos insuficiente.")
              self._contas.debitar(conta_id, produto.custo)
              return conta.saldo - produto.custo
      ```

      Salve com **Ctrl+S**. A aplicação reinicia e o banco volta ao estado inicial (500 pontos). Então:

      1. na aba **Terminal**, repita o `curl` com `custo=1` no produto 1 e veja que agora o saldo cai **300** (o custo real), não 1;
      2. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o `def resgatar` fica com 4 espaços; o corpo, com 8. O `self._contas.debitar(...)` passa a usar `produto.custo`, não `custo_informado`.
    concept: Correção usando o custo real do produto no servidor
    validatorRef: confianca-cliente/python-flask/loja-servidor-sau-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/loja_service.py`, no método `resgatar`.'
      - level: 2
        text: "Debite produto.custo (do banco), não custo_informado (do formulário)."
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def resgatar` fica com 4 espaços antes de `def`.
    points: 45

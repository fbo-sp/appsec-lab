learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender por que não se deve confiar em dados que o cliente controla
    - Explorar a falha resgatando um produto caro com um custo adulterado no pedido
    - Reconhecer que o custo do produto é um dado do servidor, não do formulário
    - Corrigir usando o custo real do produto (do banco) e ignorando o do formulário
  story:
    role: Pessoa desenvolvedora do time de produtos digitais da operadora Sereno Saúde
    application: Clube de Bem-Estar, onde o beneficiário resgata produtos gastando pontos do programa de saúde
    context: >-
      O beneficiário resgata produtos no Clube de Bem-Estar gastando pontos. Numa auditoria, a equipe apontou que o resgate confia no custo que vem do formulário — dá para resgatar um produto caro informando um custo de 1 ponto.
    mission: Confirmar que a loja aceita um custo adulterado e corrigir usando o custo real do produto
  wrapUp:
    text: |
      Agora o resgate cobra o custo real do produto, lido do banco, e ignora o valor que vem do formulário. Em um sistema real, vale reforçar:

      - **Nunca confie em dado que o cliente controla e que você mesmo pode determinar.** Preço, custo, desconto, papel do usuário, id do dono: tudo isso o cliente consegue alterar no pedido. O servidor tem a fonte da verdade (o banco) e deve usá-la.
      - **Campo escondido não é campo seguro.** Um `input type="hidden"` aparece no HTML e é editável por qualquer um (DevTools, `curl`). Esconder não é proteger.
      - **Receba do cliente só o que ele realmente escolhe.** No resgate, o cliente escolhe *qual* produto (o id); o *custo* é consequência disso, e quem resolve é o servidor. Reduza a superfície de dados confiáveis ao mínimo.
      - **Valide também as regras de negócio.** Depois de pegar o custo real, confira se o usuário tem saldo. Juntar "fonte da verdade no servidor" com "regras no servidor" fecha a brecha.
    references:

steps:
  - id: conhecer
    order: 1
    title: Conhecer o envio de comprovantes de renda
    explanation: |
      Você está na squad de crédito da Credimova. A mesa de análise recebe por dia dezenas de comprovantes de renda que os cooperados anexam no portal, e cada analista abre os arquivos para conferir. Um teste de invasão avisou que o portal decide se aceita um arquivo só pelo tipo que o navegador informa, sem olhar o conteúdo.

      A tela **Enviar comprovante de renda** deixa o usuário anexar um comprovante de renda. Quem recebe os arquivos é a equipe interna (analistas de crédito), na tela **Mesa de Crédito**, abrindo cada anexo pelo link.

      Quando um arquivo é enviado, o navegador manda junto um **`Content-Type`** dizendo que tipo de arquivo seria aquele. O problema: esse rótulo é escrito por quem envia, não medido pelo servidor. Siga o envio pelas camadas:

      1. **Controller** (`controllers/anexo_controller.py`): recebe o arquivo e, no fim, serve os anexos em `/anexos/<nome>`.
      2. **Serviço** (`services/anexo_service.py`): decide se aceita o arquivo. **É aqui que está a decisão de segurança.**

      As credenciais de teste deste laboratório são:

      - Cooperado Marcos Nunes Valério: usuário `marcos.nunes`, senha `Marcos#Cred26`.
      - Analista Regina Alves Moura (equipe): usuário `regina.alves`, senha `Regina#Cred26`.
    task: |
      1. Na aba **Aplicação**, entre com `marcos.nunes` e a senha `Marcos#Cred26`.
      2. Envie um arquivo qualquer que seja PDF, PNG ou JPEG de verdade: ele aparece na lista **Comprovantes enviados**.
      3. Na aba **Código**, abra `services/anexo_service.py` e leia o método `salvar`.

      Informe abaixo o atributo do arquivo que o serviço usa para decidir se o tipo é permitido.
    concept: Validação de upload pelo tipo que o cliente informa
    validatorRef: upload/answer/campo-checado-fin-v1
    hints:
      - level: 1
        text: 'A checagem é a linha `if arquivo.____ not in Config.TIPOS_PERMITIDOS`.'
      - level: 2
        text: É o tipo que o navegador informa no envio (Content-Type), um atributo do objeto `arquivo`.
      - level: 3
        text: O valor é `mimetype`.
    points: 10
  - id: forjar
    order: 2
    title: Enviar um HTML disfarçado de imagem
    explanation: |
      Como o serviço confia no `Content-Type` do envio, dá para mandar um arquivo HTML dizendo que ele é uma imagem. O navegador comum não deixa escolher o tipo, mas uma ferramenta de linha de comando deixa.

      ```ilustracao
      upload-tipo-informado
      ```

      O arquivo `amostras/comprovante.html` (já no workspace) parece um comprovante de renda, mas é uma página HTML. Você vai enviá-lo dizendo que é um `image/png`.
    task: |
      Na aba **Terminal**, primeiro entre como `marcos.nunes` (guardando o cookie de sessão) e depois envie o arquivo forjado:

      ```bash
      curl -s --noproxy '*' -c /tmp/ck -d "login=marcos.nunes&senha=Marcos#Cred26" http://127.0.0.1:8080/login -o /dev/null
      curl -s --noproxy '*' -b /tmp/ck -F "descricao=Comprovante" \
        -F "arquivo=@/workspace/amostras/comprovante.html;type=image/png" \
        http://127.0.0.1:8080/comprovantes -o /dev/null -w "%{http_code}\n"
      ```

      O segundo comando responde `302` (envio aceito). Recarregue a aba **Aplicação**: o arquivo aparece na lista. Clique nele e repare que o endereço abre em `/anexos/...`.

      Informe abaixo o caminho (começando em `/anexos/`) em que o arquivo forjado é servido.
    explore: |
      **Por que o `;type=image/png` importa.** Pela tela do navegador, o arquivo seria enviado como `text/html` e o serviço recusaria. O `curl` deixa você escrever o `Content-Type` à mão, e é só nesse rótulo que o serviço confia. O conteúdo continua sendo HTML.
    concept: Content-Type forjado contorna a lista de tipos permitidos
    validatorRef: upload/answer/caminho-servido-fin-v1
    hints:
      - level: 1
        text: 'O nome do arquivo não muda: o serviço guarda com o nome que você enviou.'
      - level: 2
        text: O link na lista aponta para `/anexos/` seguido do nome do arquivo.
      - level: 3
        text: O valor é `/anexos/comprovante.html`.
    points: 15
  - id: executar
    order: 3
    title: Ver o arquivo ser servido como página
    explanation: |
      O arquivo guardado termina em `.html`, então, ao servi-lo, a aplicação responde com `Content-Type: text/html`. Para o navegador, isso não é um anexo para baixar: é uma **página da própria aplicação**, e o script dentro dela roda na origem do Mesa de Crédito.

      > **Sobre esta demonstração.** O arquivo `comprovante.html` deste laboratório apenas comprova que o navegador o executou (ele escreve um aviso "XSS-OK" na página). Num sistema real, o mesmo furo permitiria a um script agir no lugar de quem abrisse o arquivo — por exemplo, a equipe interna que vê os anexos. Mantivemos a demonstração inofensiva de propósito, por restrições de segurança do ambiente — sem mudar a vulnerabilidade nem a forma de corrigi-la.
    task: |
      Na aba **Terminal**, veja com que tipo o servidor entrega o arquivo forjado:

      ```bash
      curl -s --noproxy '*' -b /tmp/ck -I http://127.0.0.1:8080/anexos/comprovante.html | grep -i content-type
      ```

      Para ver na prática: na aba **Aplicação**, abra o arquivo pela lista (ou, como a equipe, entre com `regina.alves`/`Regina#Cred26` e abra-o na **Mesa de Crédito**). A página mostra a marca **XSS-OK**, prova de que o HTML enviado foi executado.

      Informe abaixo o valor de `Content-Type` com que o servidor entrega o arquivo (só o tipo, sem o `charset`).
    explore: |
      **Por que isso é XSS armazenado.** O arquivo ficou guardado no servidor e é servido como página toda vez que alguém o abre. Quem mais abre os anexos é a equipe interna: o script rodaria com a sessão dela, dentro da origem da aplicação. Guardar e servir conteúdo enviado por terceiros como HTML é o caminho clássico de upload para XSS armazenado.
    concept: Arquivo servido como text/html executa na origem da aplicação
    validatorRef: upload/answer/tipo-servido-fin-v1
    hints:
      - level: 1
        text: 'A linha do `curl -I` é `content-type: text/html; charset=utf-8`.'
      - level: 2
        text: Informe só o tipo, antes do ponto e vírgula.
      - level: 3
        text: O valor é `text/html`.
    points: 15
  - id: assinatura
    order: 4
    title: Saber como reconhecer o arquivo de verdade
    explanation: |
      A correção não é "proibir `.html`": a lista de proibidos nunca termina. O certo é validar pelo **conteúdo**: todo formato de arquivo começa com bytes fixos, a **assinatura** (ou *magic number*).

      ```ilustracao
      assinatura-arquivo
      ```

      Assim o servidor decide o tipo olhando os primeiros bytes, não o rótulo do cliente:

      - **PDF** começa com os bytes `%PDF-`;
      - **PNG** começa com `\x89PNG\r\n\x1a\n`;
      - **JPEG** começa com `\xff\xd8\xff`.

      Um HTML disfarçado não começa com nenhuma dessas assinaturas, então é recusado. Além disso, guardar o arquivo com um **nome próprio** (um UUID com a extensão certa) e mandar o navegador **não adivinhar** o tipo (`X-Content-Type-Options: nosniff`) fecham a brecha.
    task: |
      Veja o começo do arquivo forjado e de um PDF de verdade:

      ```bash
      head -c 16 /workspace/amostras/comprovante.html; echo
      head -c 16 /workspace/amostras/documento.pdf; echo
      ```

      Informe abaixo a assinatura (os primeiros bytes, em texto) com que um arquivo PDF de verdade começa.
    concept: Assinatura do arquivo (magic number) valida o conteúdo real
    validatorRef: upload/answer/assinatura-pdf-fin-v1
    hints:
      - level: 1
        text: O PDF de verdade começa com um sinal de porcentagem e três letras maiúsculas.
      - level: 2
        text: São quatro caracteres seguidos de um hífen.
      - level: 3
        text: O valor é `%PDF`.
    points: 15
  - id: corrigir
    order: 5
    title: Corrigir a validação do upload
    explanation: |
      **Por que a falha existe.** O serviço aceita o arquivo pelo `Content-Type` informado e o guarda com o nome original; um `.html` é então servido como página na origem da aplicação.

      **A correção.** Validar pela assinatura do conteúdo, guardar com um nome gerado (UUID + a extensão certa) e, no download, mandar o navegador não adivinhar o tipo (`nosniff`). São duas mudanças: o serviço e o controller.
    task: |
      **1.** Abra `services/anexo_service.py`. Troque o topo dos imports:

      ```python
      import logging
      import os

      from werkzeug.datastructures import FileStorage
      from werkzeug.utils import secure_filename
      ```

      por (acrescenta `uuid` e tira o `secure_filename`, que não será mais usado):

      ```python
      import logging
      import os
      import uuid

      from werkzeug.datastructures import FileStorage
      ```

      **2.** No mesmo arquivo, troque o método `salvar` inteiro por este:

      ```python
          ASSINATURAS = {b"%PDF-": ".pdf", b"\x89PNG\r\n\x1a\n": ".png", b"\xff\xd8\xff": ".jpg"}

          def salvar(self, dono_id: int, descricao: str, arquivo: FileStorage | None) -> str:
              """Confere o conteúdo, grava com nome próprio e registra o envio. Devolve o nome gravado."""
              if arquivo is None or not arquivo.filename:
                  raise ValueError("Escolha um arquivo para enviar.")
              cabecalho = arquivo.stream.read(8)
              arquivo.stream.seek(0)
              extensao = next((e for assinatura, e in self.ASSINATURAS.items() if cabecalho.startswith(assinatura)), None)
              if extensao is None:
                  raise ValueError("Envie um PDF, PNG ou JPEG de verdade.")
              nome = uuid.uuid4().hex + extensao
              arquivo.save(os.path.join(Config.PASTA_ANEXOS, nome))
              self._repositorio.inserir(dono_id, descricao.strip()[:120], nome)
              logger.info("Anexo recebido: dono=%s arquivo=%s", dono_id, nome)
              return nome
      ```

      **3.** Abra `controllers/anexo_controller.py` e troque a função `baixar` por esta (acrescenta o cabeçalho `nosniff`):

      ```python
      @anexo_bp.get("/anexos/<nome>")
      @login_obrigatorio
      def baixar(nome: str):
          """Entrega o arquivo guardado, sem deixar o navegador adivinhar o tipo."""
          resposta = send_from_directory(Config.PASTA_ANEXOS, nome)
          resposta.headers["X-Content-Type-Options"] = "nosniff"
          return resposta
      ```

      Salve os dois arquivos com **Ctrl+S**. A aplicação reinicia e o banco volta ao estado inicial. Então clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `NameError: name 'uuid'` indica o import faltando; `NameError: name 'secure_filename'` indica que sobrou uma chamada à função que você removeu. `IndentationError` aponta a linha com recuo diferente: o método `salvar` fica com 4 espaços antes de `def`, e o `ASSINATURAS` no mesmo nível.
    concept: Validação por assinatura, nome gerado e nosniff no download
    validatorRef: upload/python-flask/file-upload-fin-v1
    hints:
      - level: 1
        text: 'São duas mudanças, em dois arquivos: o método `salvar` (serviço) e a função `baixar` (controller).'
      - level: 2
        text: 'O `salvar` recusa o que não começa com uma assinatura conhecida e grava com `uuid4().hex` + extensão; o `baixar` acrescenta `X-Content-Type-Options: nosniff`.'
      - level: 3
        text: Copie os três trechos da tarefa sem mudar o recuo.
    points: 45

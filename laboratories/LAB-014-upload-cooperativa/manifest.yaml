# LAB-014 (A3-FIN): upload irrestrito levando a XSS armazenado (CWE-434) no Mesa de Crédito da Cooperativa Credimova (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios (domínio .example). Família A3 upload (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/upload; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

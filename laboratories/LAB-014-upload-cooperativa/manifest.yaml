learning:
  singleVulnerability: true
  estimatedMinutes: 45
  difficulty: beginner
  objectives:
    - Entender por que confiar no tipo informado pelo navegador (Content-Type) não valida um arquivo
    - Enviar um arquivo HTML disfarçado e ver a aplicação servi-lo como página na própria origem
    - Reconhecer o impacto (XSS armazenado) de um upload servido como HTML para a equipe interna
    - Corrigir validando o conteúdo pela assinatura do arquivo, renomeando e impedindo a interpretação como HTML
  story:
    role: Pessoa desenvolvedora da squad de crédito da Cooperativa Credimova
    application: portal Mesa de Crédito, onde o cooperado anexa comprovantes para análise
    context: >-
      No portal de crédito, o cooperado anexa o comprovante de renda e os analistas abrem cada documento para liberar o limite. A equipe de segurança alertou que o portal aceita qualquer arquivo pelo tipo informado no envio, sem olhar o conteúdo.
    mission: Enviar um arquivo HTML disfarçado de imagem, ver a aplicação servi-lo como página e corrigir a validação
  wrapUp:
    text: |
      Agora o servidor decide o tipo pelo **conteúdo** do arquivo, guarda-o com um nome próprio e manda o navegador não "adivinhar" o tipo. Um HTML disfarçado é recusado, e um arquivo salvo não vira página. Em um sistema real, vale reforçar:

      - **Valide pelo conteúdo, nunca pelo que o cliente diz.** O `Content-Type` do envio e a extensão do nome vêm de quem envia. Cheque a assinatura (os primeiros bytes) e, quando possível, uma biblioteca que entenda o formato.
      - **Tire o arquivo da origem da aplicação.** Servir anexos de outro domínio (ou de um bucket com `Content-Disposition: attachment` e `X-Content-Type-Options: nosniff`) faz o navegador baixar, não executar. Nomes gerados (um UUID) evitam ainda a troca/sobrescrita de arquivos.
      - **Trate o upload como entrada hostil.** Limite tamanho e tipos, rode antivírus quando fizer sentido e isole o processamento. O arquivo é dado, não código.
      - **XSS armazenado é o risco clássico.** Um HTML servido na sua origem roda com a sessão de quem o abre — aqui, a equipe interna. As mesmas defesas de XSS (origem separada, `nosniff`, CSP) valem para anexos.
    references:

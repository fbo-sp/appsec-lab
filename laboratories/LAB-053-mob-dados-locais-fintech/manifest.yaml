# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família MOB-02 mob-dados-locais (ADR-021, ADR-025): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/mob-dados-locais; não edite este arquivo à mão.

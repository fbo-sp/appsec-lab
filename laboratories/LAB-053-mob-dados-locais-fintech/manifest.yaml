learning:
  singleVulnerability: true
  estimatedMinutes: 30
  difficulty: beginner
  objectives:
    - Entender o que um app guarda no aparelho e quem consegue ler esses arquivos
    - Encontrar a senha do usuário gravada em texto puro nas preferências do app
    - Reconhecer que, para manter a sessão, basta guardar um token de curta duração
    - Corrigir o armazenamento local para nunca gravar a senha
  story:
    role: >-
      Pessoa desenvolvedora do time de apps do banco digital Pagomais
    application: >-
      App Pagomais, o app em que o cliente consulta o extrato
    context: >-
      Depois do login, o app de contas da Pagomais grava nas preferências do aparelho tudo o que usou para entrar, inclusive a senha em texto puro.
    mission: >-
      Encontrar a senha gravada no aparelho e corrigir o app para guardar só o necessário
  wrapUp:
    text: |
      Agora o app guarda só o login e o token, e a senha não sai da tela de login. Em um app real, vale reforçar:

      - **O aparelho não é cofre.** Arquivos do app (SharedPreferences, NSUserDefaults, SQLite, arquivos em cache) são lidos com root/jailbreak, por backup, por ferramentas forenses ou por malware com acesso ao armazenamento.
      - **Senha não se guarda.** Para manter a sessão, guarde um token curto, que o servidor pode revogar. Para entrar de novo sem digitar a senha, use biometria liberando um token, não a senha.
      - **Segredos vão no armazenamento seguro da plataforma.** Android Keystore (com EncryptedSharedPreferences) e iOS Keychain guardam chaves fora do alcance de quem só copia os arquivos do app.
      - **Menos dados, menos risco.** Antes de gravar algo, pergunte se o app precisa disso offline. O que não é gravado não vaza.

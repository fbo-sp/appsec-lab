# LAB-022 (A6-IND): SSRF (CWE-918) no importador por URL do Portal de Engenharia da Siderúrgica Pindorama (Flask).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família A6 ssrf (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/ssrf; não edite este arquivo à mão.

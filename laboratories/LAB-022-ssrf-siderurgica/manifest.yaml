learning:
  singleVulnerability: true
  estimatedMinutes: 40
  difficulty: intermediate
  objectives:
    - "Entender o que é SSRF: fazer o servidor da aplicação buscar uma URL escolhida por quem ataca"
    - Explorar a falha usando o importador para ler um serviço interno que o usuário não deveria alcançar
    - Entender por que "é só uma busca de documento" vira acesso à infraestrutura interna
    - Corrigir com uma lista de permissão (allowlist) de destinos, validada no servidor
  story:
    role: Pessoa desenvolvedora do time de sistemas industriais da Siderúrgica Pindorama
    application: Portal de Engenharia, onde a equipe importa o documento técnico enviado pelo fornecedor
    context: >-
      O Portal de Engenharia importa a ficha técnica a partir de uma URL que o fornecedor informa; o servidor busca essa URL e mostra a prévia. Antes da certificação ISO/IEC 27001, uma auditoria apontou que o campo de URL não valida o destino, permitindo levar o servidor a buscar serviços internos da planta.
    mission: Confirmar que o importador pode ser levado a buscar um serviço interno e corrigir restringindo o destino
  wrapUp:
    text: |
      Agora o importador só busca o destino que ele realmente precisa — o **Serviço de Documentos** — e recusa qualquer outro endereço. Em um sistema real, vale reforçar:

      - **Allowlist, não blocklist.** Tentar *bloquear* o que é perigoso (127.0.0.1, 169.254.169.254, `file://`, `localhost`...) é uma corrida perdida: sempre sobra uma forma de escrever o mesmo endereço (octal, IPv6, DNS que resolve para interno, redirecionamento). Liste o que é **permitido** — host, porta e esquema exatos — e recuse o resto.
      - **Valide o destino, não só a string.** Resolva o nome e confira o IP de destino, porque um nome aparentemente externo pode resolver para um endereço interno (ataque de *DNS rebinding*). Recuse redirecionamentos, senão um destino permitido pode te empurrar para um proibido.
      - **Trate o metadados da nuvem como hostil.** Em ambientes de nuvem, o endpoint de metadados (ex.: `169.254.169.254`) entrega credenciais temporárias. SSRF que o alcança vira comprometimento da conta. Prefira IMDSv2 (exige token) e bloqueie o acesso de rede a ele a partir das aplicações.
      - **Menos privilégio de rede.** O serviço que busca URLs externas não deveria ter rota para a rede interna de administração. Segmentar a rede limita o estrago mesmo quando a validação falha.

steps:
  - id: conhecer
    order: 1
    title: Conhecer a aplicação
    explanation: |
      Um **Cross-Site Scripting (XSS)** acontece quando o texto digitado por alguém vira **código** dentro da página de outra pessoa: HTML ou JavaScript que o navegador executa como se fosse da própria aplicação.

      Para achar esse ponto, siga o texto do usuário pelas camadas:

      1. **Controller** (`controllers/ordem_controller.py`): recebe a requisição e lê o campo `q` da busca.
      2. **Serviço** (`services/ordem_service.py`): aplica as regras de negócio, como limpar o texto.
      3. **Repositório** (`repositories/ordem_repository.py`): consulta o banco, sempre com parâmetros.
      4. **Template** (`templates/ordens.html`): monta o HTML que volta para o navegador.

      As credenciais de teste deste laboratório são:

      - Técnico de campo Tiago Nunes Batista: usuário `tiago.nunes`, senha `Campo@2026`;
      - Operadora do Centro de Operação Helena Duarte Vaz: usuário `helena.cod`, senha `Operador#Volt26`.
    task: |
      1. Na aba **Aplicação**, entre com o usuário `tiago.nunes` e a senha `Campo@2026`.
      2. Na tela **Minhas ordens**, busque por `religador` e repare na linha **Resultados para**, que repete o que você digitou.
      3. Na aba **Código**, abra `controllers/ordem_controller.py`, veja que o termo vai para o serviço e abra `services/ordem_service.py`.
      4. Encontre o método que o time criou para **limpar** o texto digitado.

      Informe abaixo o nome desse método.
    concept: Fluxo do dado não confiável até o HTML da resposta
    validatorRef: xss/answer/locate-cleaner-ind-v1
    hints:
      - level: 1
        text: O controller chama `servico.buscar(...)`. Dentro de `buscar`, a primeira linha transforma o termo antes de consultar o banco.
      - level: 2
        text: O método fica no topo da classe `OrdemService` e usa a expressão regular `_TAG_SCRIPT`.
      - level: 3
        text: O método é `limpar_texto`.
    points: 10
  - id: testar-protecao
    order: 2
    title: Testar a proteção do time
    explanation: |
      Depois de um teste de invasão, o time criou `limpar_texto`, que remove a tag `<script>` do que o usuário digita. É uma **lista de bloqueio**: tenta adivinhar o que é perigoso e apagar.

      O Jinja2, que monta as páginas do Flask, já tem uma proteção melhor ligada por padrão, o **autoescape**: ao imprimir `{{ termo }}`, ele troca `<` por `&lt;` e `>` por `&gt;`. O navegador mostra os sinais na tela, mas não os interpreta como tags.

      Essa proteção pode ser desligada em um ponto específico com o filtro `|safe`, que diz ao Jinja2 que o texto é HTML confiável e pode ir para a página como está.
    task: |
      Na aba **Aplicação**, faça duas buscas, uma de cada vez, e compare:

      ```text
      <script>alert(1)</script>
      ```

      ```text
      <b>religador</b>
      ```

      Na primeira, o `<script>` some. Na segunda, a palavra aparece em **negrito** na linha **Resultados para**: o navegador interpretou o `<b>` como HTML.

      Na aba **Código**, abra `templates/ordens.html` e encontre a linha que imprime o termo. Informe abaixo o nome do **filtro do Jinja2** que faz o termo ir para a página sem codificação (sem o `|`).
    explore: |
      **Por que comparar as duas buscas.** A primeira mostra que a lista de bloqueio funciona para o caso que o time imaginou. A segunda mostra que ela não resolve o problema: qualquer outra tag passa. Este é o achado típico de uma revisão de segurança: a proteção existe, mas protege contra um único exemplo.

      **Veja o HTML que o navegador recebeu.** No **Terminal**, faça a mesma busca com `curl` e compare as duas linhas que repetem o termo:

      ```bash
      curl -s -c /tmp/c.txt -d "login=tiago.nunes&senha=Campo@2026" http://127.0.0.1:8080/login > /dev/null
      curl -s -b /tmp/c.txt "http://127.0.0.1:8080/ordens?q=%3Cb%3Eteste%3C%2Fb%3E" | grep -E "value=|Resultados"
      ```

      **O que procurar.** No campo de busca (`value=`), o Jinja2 codificou o termo como `&lt;b&gt;`. Na linha **Resultados para**, o mesmo termo saiu como `<b>`. A diferença entre as duas linhas é exatamente o `|safe`.
    concept: Autoescape do Jinja2 e o filtro |safe
    validatorRef: xss/answer/safe-filter-ind-v1
    hints:
      - level: 1
        text: Procure a linha com `Resultados para` no template. O termo está entre `{{` e `}}`.
      - level: 2
        text: Depois do nome da variável vem um `|` e o nome de um filtro. É ele que desliga a codificação.
      - level: 3
        text: "A linha é `Resultados para <mark>{{ termo|safe }}</mark>`. Responda `safe`."
    points: 15
  - id: xss-refletido
    order: 3
    title: Executar JavaScript pela busca
    explanation: |
      Sem `<script>`, ainda dá para executar JavaScript. Atributos de **evento** do HTML, como `onerror`, rodam código quando algo acontece com o elemento. Uma imagem com endereço inválido sempre dispara o `onerror`:

      ```html
      <img src=x onerror="this.outerHTML=document.cookie">
      ```

      O código troca a própria imagem pelo conteúdo de `document.cookie`, os **cookies que o JavaScript da página consegue ler**. Este é um **XSS refletido**: o ataque vem na própria requisição (aqui, no parâmetro `q` do endereço). Um atacante mandaria o link pronto para a vítima, por e-mail ou mensagem.

      Ao entrar, o Portal de Chamados de Campo grava o cookie `campo_token`, o token do tablet de campo, que autoriza abrir ordens em nome da equipe. Ele foi criado **sem HttpOnly**, para o front-end antigo ler.
    task: |
      Na aba **Aplicação**, ainda logado com `tiago.nunes`, busque por:

      ```text
      <img src=x onerror="this.outerHTML=document.cookie">
      ```

      Na linha **Resultados para** aparecem os cookies legíveis pela página, no formato `nome=valor`. Informe abaixo o **valor** do cookie `campo_token`. Todos os dados deste laboratório são fictícios.
    explore: |
      **Por que o cookie de sessão não apareceu.** O Flask guarda o login no cookie `session`, que sai com a marca **HttpOnly**: o navegador o envia nas requisições, mas não deixa o JavaScript ler. O `campo_token` não tem essa marca. É a diferença entre o atacante conseguir ou não roubar o dado com XSS.

      **Veja os atributos no cabeçalho.** No **Terminal**:

      ```bash
      curl -s -i -d "login=tiago.nunes&senha=Campo@2026" http://127.0.0.1:8080/login | grep -i set-cookie
      ```

      **O que procurar.** A linha do `session` termina com `HttpOnly`; a do `campo_token`, não. Num ataque real, em vez de mostrar o cookie na tela, o script o enviaria para um servidor do atacante com `fetch`. Este laboratório não tem acesso à internet, então o efeito fica visível só para você.
    concept: XSS refletido e roubo de cookies sem HttpOnly
    validatorRef: xss/answer/client-cookie-ind-v1
    hints:
      - level: 1
        text: Copie a entrada inteira, com as aspas, e cole no campo de busca. O resultado aparece onde antes ficava o termo destacado.
      - level: 2
        text: "Os cookies aparecem separados por `;`. Procure o trecho que começa com `campo_token=`."
      - level: 3
        text: "O valor tem o formato `VOL-TAB-XXXX-NNNN`."
    points: 20
  - id: xss-armazenado
    order: 4
    title: Atingir a equipe com XSS armazenado
    explanation: |
      No XSS **armazenado**, o código malicioso fica gravado no banco e roda para **todo mundo** que abre a página onde ele aparece, sem precisar de link.

      Na tela da operadora Helena, o campo **Relato do técnico** de cada ordem de serviço é impresso com `|safe` em `templates/painel.html`, porque alguém quis permitir formatação. O texto vem de qualquer usuário do Portal de Chamados de Campo.

      O impacto é maior: a equipe interna tem mais privilégios. O cookie `cod_manobra` guarda a credencial do operador que autoriza manobras remotas na rede elétrica.
    task: |
      1. Na aba **Aplicação**, ainda logado com `tiago.nunes`, use o formulário **Abrir ordem de serviço**: preencha **Equipamento** com qualquer texto e **Relato do técnico** com:

         ```text
         <img src=x onerror="this.outerHTML=document.cookie">
         ```

         Clique em **Cadastrar**.
      2. Clique em **Sair** e entre de novo, agora como operadora Helena: usuário `helena.cod`, senha `Operador#Volt26` (as credenciais também estão na etapa 1).
      3. Na tela **Painel do Centro de Operação**, a linha que você cadastrou mostra os cookies da equipe na coluna **Relato do técnico**.

      Informe abaixo o **valor** do cookie `cod_manobra`.
    explore: |
      **Por que este ataque é mais grave que o da etapa 3.** No refletido, a vítima precisa clicar num link. No armazenado, basta a operadora Helena fazer o trabalho de sempre: abrir o painel. O mesmo código roda para cada pessoa da equipe que abrir a tela, até alguém apagar o registro.

      **Veja o registro gravado.** No **Terminal**, consulte o banco:

      ```bash
      python -c "import sqlite3; [print(l) for l in sqlite3.connect('/tmp/voltera.db').execute('SELECT id, nome, nota FROM ordens ORDER BY id DESC LIMIT 3')]"
      ```

      **O que procurar.** O banco guardou o texto exatamente como você digitou: a limpeza só remove `<script>`. O problema não é o dado no banco, e sim o momento em que ele vira HTML. Por isso a correção é na **saída**, no template.
    concept: XSS armazenado e o impacto em usuários privilegiados
    validatorRef: xss/answer/staff-cookie-ind-v1
    hints:
      - level: 1
        text: Depois de cadastrar, a linha aparece na sua lista com o texto do ataque visível (na sua tela o campo é codificado). O código só roda na tela da equipe.
      - level: 2
        text: "Para trocar de usuário, clique em **Sair** no topo da página e entre com `helena.cod` e senha `Operador#Volt26`."
      - level: 3
        text: "O valor tem o formato `VOL-MNB-NNNN-XX`."
    points: 15
  - id: corrigir
    order: 5
    title: Corrigir codificando a saída
    explanation: |
      **Por que a falha existe.** O texto do usuário vira HTML porque dois templates desligam o autoescape com `|safe`. A limpeza no serviço tenta bloquear um único formato de ataque, e existem centenas.

      **A correção: codificar a saída.** Deixe o Jinja2 fazer o trabalho dele. Sem `|safe`, `<img src=x onerror=...>` vira `&lt;img src=x onerror=...&gt;`: o usuário vê exatamente o que digitou, e o navegador não executa nada. Essa é a regra principal contra XSS: **codificar o dado no momento em que ele é inserido na página**, de acordo com o contexto (aqui, HTML).

      **Por que não melhorar a lista de bloqueio?** Porque sempre falta um caso: `<svg onload=...>`, `<details open ontoggle=...>`, letras maiúsculas e minúsculas misturadas. A validação desta etapa testa várias dessas formas.
    task: |
      **1.** Abra `templates/ordens.html` na aba **Código**. A linha do resultado está assim:

      ```html
      <p class="resultado">Resultados para <mark>{{ termo|safe }}</mark></p>
      ```

      Troque por:

      ```html
      <p class="resultado">Resultados para <mark>{{ termo }}</mark></p>
      ```

      **2.** Abra `templates/painel.html`. A célula da coluna **Relato do técnico** está assim:

      ```html
          <tr><td>{{ autor }}</td><td>{{ item.nome }}</td><td>{{ item.detalhe }}</td><td>{{ item.nota|safe }}</td></tr>
      ```

      Troque `{{ item.nota|safe }}` por `{{ item.nota }}`, deixando o resto da linha igual.

      Salve os dois arquivos com **Ctrl+S**. Os templates valem na hora. Então:

      1. ainda como operadora Helena, recarregue o painel: o ataque aparece como **texto**;
      2. clique em **Sair**, entre de novo com `tiago.nunes` e senha `Campo@2026`, e repita a busca da etapa 3: o texto aparece, e nenhum cookie;
      3. busque por `R-12` e confirme que **Religador R-12 (Alim. 04)** continua aparecendo;
      4. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Uma chave `}}` apagada sem querer gera *Internal Server Error*. No **Terminal**, filtre as linhas de erro (o log também traz os acessos `GET / 200`):

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** Uma linha `jinja2.exceptions.TemplateSyntaxError` diz o arquivo e a linha. Compare com o trecho da tarefa.

      **E a função `limpar_texto`?** Pode ficar, mas não é ela que protege. Experimente buscar `<svg onload=alert(1)>` antes e depois da correção: antes, a lista de bloqueio deixa passar; depois, o autoescape transforma em texto. Conferir se ainda existe `|safe` no projeto é um bom hábito:

      ```bash
      grep -rn "|safe" templates/
      ```
    concept: Codificação de saída (output encoding) por contexto
    validatorRef: xss/python-flask/output-encoding-ind-v1
    hints:
      - level: 1
        text: A mudança é só nos templates. Controller, serviço e repositório não mudam.
      - level: 2
        text: "Há dois `|safe` no projeto: um em `templates/ordens.html` e outro em `templates/painel.html`. Os dois precisam sair."
      - level: 3
        text: "Use exatamente `<mark>{{ termo }}</mark>` em `ordens.html` e `<td>{{ item.nota }}</td>` em `painel.html`. Se a validação falhar, veja na aba **Validação** qual verificação não passou e confira o log com `grep -iE \"error|traceback\" /tmp/app.log | tail`."
    references:
      - title: "Jinja2: escape automático e o filtro safe"
        url: https://jinja.palletsprojects.com/en/stable/templates/#html-escaping
      - title: "OWASP Cheat Sheet: Cross Site Scripting Prevention"
        url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    points: 40

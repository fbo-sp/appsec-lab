# LAB-028 (A13-IND): login sem limite de tentativas (CWE-307) no Portal do Fornecedor da Metalúrgica Aurora (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família A13 tentativas-login (ADR-021): gerado por

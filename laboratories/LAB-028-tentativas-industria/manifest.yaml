learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender por que um login sem limite de tentativas permite ataque de força bruta
    - Explorar a falha enviando várias tentativas de senha seguidas, sem bloqueio
    - Reconhecer que o limite precisa ser contado no servidor, por usuário
    - Corrigir limitando as tentativas por usuário na camada de serviço
  story:
    role: Pessoa desenvolvedora do time digital da Metalúrgica Aurora
    application: Portal do Fornecedor, onde o fornecedor entra com usuário e senha para acessar pedidos e notas
    context: >-
      O fornecedor entra no Portal do Fornecedor com usuário e senha. Antes de uma auditoria, a equipe apontou que o login aceita tentativas ilimitadas de senha — dá para testar senha após senha (força bruta) sem que nada bloqueie.
    mission: Confirmar que o login aceita tentativas ilimitadas e corrigir limitando as tentativas por usuário
  wrapUp:
    text: |
      Agora o login bloqueia o usuário depois de poucas tentativas erradas seguidas, e a força bruta deixa de ser viável. Em um sistema real, vale reforçar:

      - **Senha com hash não defende contra força bruta online.** O hash protege as senhas se o banco vazar; ele não impede ninguém de testar senha após senha na tela de login. São defesas para problemas diferentes.
      - **Conte as tentativas no servidor, por identificador.** Travar o botão no navegador não adianta: quem ataca manda o pedido direto. O servidor é que precisa contar as tentativas falhas — por usuário e também por origem (IP) — e recusar quando passar do limite.
      - **Prefira atraso progressivo e janela de tempo a bloqueio permanente.** Bloquear para sempre vira um jeito fácil de trancar a conta de uma vítima (negação de serviço). O comum é liberar de novo depois de uma janela, aumentar o atraso a cada falha (backoff) e exigir um segundo fator ou CAPTCHA.
      - **Registre e monitore.** Uma rajada de logins falhos para um mesmo usuário, ou a partir de um mesmo IP, é um sinal clássico de ataque. Registrar a tentativa recusada ajuda a detectar o abuso cedo.

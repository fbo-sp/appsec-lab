steps:
  - id: conhecer
    order: 1
    title: Conhecer o login e achar o serviço de autenticação
    explanation: |
      Você é do time digital da Metalúrgica Aurora. O fornecedor entra no Portal do Fornecedor com usuário e senha. A equipe apontou que o login aceita tentativas de senha ilimitadas, e que dá para testar senha após senha (força bruta) sem que nada bloqueie a conta.

      A falha deste laboratório **não** é o armazenamento da senha: ela já é guardada com hash forte. A falha é de outro tipo — o login aceita **tentativas ilimitadas**, então um atacante pode testar senha após senha (força bruta) até acertar.

      ```ilustracao
      forca-bruta
      ```

      Siga o login pelas camadas:

      1. **Controller** (`controllers/auth_controller.py`): recebe usuário e senha do formulário e chama o serviço.
      2. **Serviço** (`services/auth_service.py`): confere a senha e devolve a conta. **É aqui que falta contar as tentativas.**

      As credenciais válidas de um usuário, neste laboratório, são:

      - Usuário `diego.campos`, senha `Diego#Aurora26`.
    task: |
      1. Na aba **Aplicação**, entre com `diego.campos` e a senha `Diego#Aurora26`. Você chega ao **Portal do Fornecedor**. Depois clique em **Sair**.
      2. Na aba **Código**, abra `services/auth_service.py`.

      Informe abaixo o nome do método que confere o login e a senha (o que o controller chama).
    concept: Força bruta — testar senhas sem limite de tentativas
    validatorRef: tentativas-login/answer/metodo-ind-v1
    hints:
      - level: 1
        text: 'Em `services/auth_service.py`, a classe `AuthService` tem um único método público.'
      - level: 2
        text: É o método que o controller chama para conferir usuário e senha.
      - level: 3
        text: O valor é `autenticar`.
    points: 10
  - id: explorar
    order: 2
    title: Testar várias senhas seguidas, sem bloqueio
    explanation: |
      O método `autenticar` só responde "bate" ou "não bate". Ele não conta quantas vezes seguidas aquele usuário errou. Então nada impede de tentar senha após senha: é exatamente assim que funciona um ataque de força bruta ou de *credential stuffing* (testar listas de senhas vazadas).
    task: |
      Na aba **Aplicação**, na tela de login, tente entrar como `diego.campos` com uma senha **errada** (por exemplo `senha1`). Você recebe "Usuário ou senha inválidos.". Repita com `senha2`, `senha3`, `senha4`, `senha5`, `senha6`…

      Veja que a aplicação **continua aceitando novas tentativas**, sempre com a mesma mensagem — nunca bloqueia. Informe abaixo se, depois de muitas tentativas erradas, o login **bloqueia** ou **continua** aceitando tentativas.
    explore: |
      **Por que isso é grave.** Num sistema real, um atacante não digita na tela: ele manda centenas de pedidos por segundo direto para `/login`, com `curl` ou um script, variando a senha. Sem limite, é só questão de tempo até acertar uma senha fraca. Contar as tentativas no servidor é o que torna esse ataque inviável.
    concept: Sem limite de tentativas, o login aceita força bruta
    validatorRef: tentativas-login/answer/comportamento-ind-v1
    hints:
      - level: 1
        text: Repare que a mensagem é sempre a mesma, por mais que você erre.
      - level: 2
        text: Nenhuma tela de "muitas tentativas" aparece; o login nunca trava.
      - level: 3
        text: A resposta é `continua`.
    points: 15
  - id: medida
    order: 3
    title: Nomear a defesa que falta
    explanation: |
      A defesa contra força bruta online é limitar o número de **tentativas** de login seguidas e bloquear quando passar do limite. A contagem precisa ser **por usuário** (e, idealmente, também por IP), para não deixar um atacante testar senhas à vontade.
    task: |
      Complete a frase: para impedir a força bruta, o login precisa limitar o número de ___ por usuário.

      Responda com uma palavra (o que se conta e se limita a cada login falho).
    concept: A defesa é limitar as tentativas de login por usuário
    validatorRef: tentativas-login/answer/defesa-ind-v1
    hints:
      - level: 1
        text: É o que o atacante faz muitas vezes seguidas até acertar.
      - level: 2
        text: Cada senha testada é uma delas.
      - level: 3
        text: A resposta é `tentativas`.
    points: 15
  - id: onde
    order: 4
    title: Decidir onde o limite tem que valer
    explanation: |
      Dá para desabilitar o botão de login no navegador depois de algumas tentativas. Isso ajuda o usuário honesto, mas **não defende nada**: quem ataca manda o pedido direto para a aplicação (por `curl`, por exemplo), sem passar pela tela.

      O limite que realmente vale é o que o **servidor** conta e aplica, na camada de serviço, antes de conferir a senha. É lá que você vai colocá-lo.
    task: |
      Onde a contagem das tentativas precisa ser feita para valer de verdade: no navegador (cliente) ou no servidor?

      Responda com uma palavra.
    concept: O limite de tentativas é contado e aplicado no servidor
    validatorRef: tentativas-login/answer/onde-ind-v1
    hints:
      - level: 1
        text: O atacante não usa a sua tela de login; ele fala direto com a aplicação.
      - level: 2
        text: A trava do navegador é só conforto; a que vale roda do outro lado.
      - level: 3
        text: A resposta é `servidor`.
    points: 15
  - id: corrigir
    order: 5
    title: Limitar as tentativas no serviço de autenticação
    explanation: |
      **Por que a falha existe.** `autenticar` confere a senha e responde, sem nunca contar quantas vezes aquele usuário errou. Sem contagem, não há como bloquear.

      **A correção.** Guardar, por usuário, quantas tentativas falharam. Se passar de um limite (aqui, 5), recusar o login — mesmo com a senha certa — até a contagem zerar. A cada falha, somar 1; a cada acerto, zerar.
    task: |
      Abra `services/auth_service.py` e troque o método `autenticar` inteiro por este (note as duas linhas novas de classe, `LIMITE` e `_tentativas`, logo antes do método):

      ```python
          # Quantas tentativas seguidas de login são permitidas por usuário antes de bloquear.
          LIMITE = 5
          _tentativas: dict[str, int] = {}

          def autenticar(self, login: str, senha: str) -> Conta | None:
              """Confere login e senha e devolve a conta (ou None se não baterem)."""
              chave = login.strip().lower()
              if self._tentativas.get(chave, 0) >= self.LIMITE:
                  raise ValueError("Muitas tentativas de login. Tente novamente mais tarde.")
              encontrado = self._repositorio.buscar_por_login(chave)
              if encontrado is not None:
                  conta, senha_hash = encontrado
                  if check_password_hash(senha_hash, senha):
                      self._tentativas[chave] = 0
                      return conta
              self._tentativas[chave] = self._tentativas.get(chave, 0) + 1
              return None
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então, na aba **Aplicação**:

      1. erre a senha de `diego.campos` cinco vezes seguidas;
      2. na sexta tentativa, veja que aparece **"Muitas tentativas de login"** — o login travou;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: `LIMITE` e `_tentativas` ficam com 4 espaços (atributos de classe), o `def autenticar` também com 4, e o corpo com 8. Copie o bloco da tarefa sem mudar o recuo.
    concept: Correção da força bruta com limite de tentativas por usuário no servidor
    validatorRef: tentativas-login/python-flask/login-protegido-ind-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/auth_service.py`, no método `autenticar` (mais dois atributos de classe).'
      - level: 2
        text: "Conte as falhas por usuário num dicionário e recuse quando passar de 5."
      - level: 3
        text: Copie o bloco da tarefa sem mudar o recuo. `LIMITE`, `_tentativas` e `def autenticar` ficam com 4 espaços.
    points: 45

  objectives:
    - Entender por que o cookie de sessão vale tanto quanto a senha
    - Ler o Set-Cookie e os cabeçalhos de uma resposta pelo Terminal
    - Saber o que Secure, HttpOnly, SameSite e HSTS protegem
    - Corrigir as opções do cookie e enviar o HSTS em toda resposta
  story:
    role: Pessoa desenvolvedora do time de canais digitais da Nébula Cartões
    application: Nébula Cartões Online, onde o cliente vê a fatura, o limite e as compras do cartão
    context: >-
      Num teste de rotina no Wi-Fi de um coworking, um analista de segurança da Nébula capturou o cookie de sessão de um colega abrindo o portal por um link antigo em HTTP, e entrou na conta dele no próprio notebook. O portal está atrás de um balanceador com HTTPS, mas o cookie não tem nenhuma proteção.
    mission: Ler o cookie de sessão que o login entrega, entender o que falta nele e corrigir as flags do cookie e o HSTS
  wrapUp:
    text: |
      Agora o cookie de sessão só viaja por HTTPS, fica fora do alcance do JavaScript e não é enviado por outros sites, e o navegador é instruído a usar sempre HTTPS. Em um sistema real, vale reforçar:

      - **HTTPS de ponta a ponta.** O balanceador redireciona HTTP para HTTPS e usa só TLS 1.2 ou 1.3. Sem certificado válido, `Secure` e HSTS não protegem nada.
      - **HSTS com cuidado.** Comece com um `max-age` curto, confirme que todos os subdomínios têm HTTPS e só então use `includeSubDomains` com um ano. A lista de *preload* dos navegadores é difícil de desfazer.
      - **`SameSite=Lax` é o mínimo.** Para áreas críticas (troca de senha, transferência), combine com token anti-CSRF; veja a família de CSRF (LAB-011 a LAB-013).
      - **Sessão curta e renovada.** Expire a sessão por inatividade, gere um novo identificador no login e invalide-o no servidor ao sair.

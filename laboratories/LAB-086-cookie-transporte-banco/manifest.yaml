# LAB-086 (L3-FIN): cookie de sessão sem Secure, HttpOnly e SameSite e sem HSTS (OWASP A02:2021 / A04:2025, CWE-614) no Nébula Cartões Online da Nébula Cartões (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família L3 cookie-transporte (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/cookie-transporte; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

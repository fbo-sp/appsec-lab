steps:
  - id: conhecer
    order: 1
    title: Conhecer a API administrativa e os papéis
    explanation: |
      Você é do time de sistemas do Hospital Santa Clara. O Console Interno tem uma API administrativa (/api/admin/usuarios) que lista todos os usuários e deveria ser só do papel admin. Numa auditoria, a equipe apontou que a API não confere o papel, e que um usuário comum, logado, chama a API de admin e recebe a lista completa.

      **Autenticação** diz quem é o usuário (ele fez login). **Autorização** diz o que ele pode fazer. A API administrativa lista todos os usuários e só o papel `admin` deveria usá-la. Quando uma função sensível não confere o papel, qualquer usuário autenticado a executa — é a falha de autorização em nível de função (BFLA).

      ```ilustracao
      bfla
      ```

      Siga a chamada pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): a rota `/api/admin/usuarios` pergunta ao serviço se o papel pode administrar.
      2. **Serviço** (`services/permissao_service.py`): responde se o papel pode usar as funções administrativas. **É aqui que falta conferir o papel.**

      As credenciais, neste laboratório, são:

      - Admin: `sandra.rocha`, senha `Sandra#SantaClara26` (papel `admin`).
      - Comum: `pedro.alves`, senha `Pedro#SantaClara26` (papel `comum`).
    task: |
      1. Na aba **Aplicação**, entre como admin (`sandra.rocha` / `Sandra#SantaClara26`) e clique em "listar todos os usuários": você vê a lista completa. Depois **Sair**.
      2. Na aba **Código**, abra `services/permissao_service.py`.

      Informe abaixo o nome do método que decide se o papel pode usar as funções administrativas.
    concept: Autorização em nível de função — conferir o papel antes de executar
    validatorRef: autorizacao-api/answer/metodo-sau-v1
    hints:
      - level: 1
        text: 'Em `services/permissao_service.py`, a classe `PermissaoService` tem um único método público.'
      - level: 2
        text: É o método que o controller chama antes de listar os usuários.
      - level: 3
        text: O valor é `pode_administrar`.
    points: 10
  - id: explorar
    order: 2
    title: Chamar a API de admin como usuário comum
    explanation: |
      O método `pode_administrar` devolve `True` para qualquer papel — ele nem olha o papel recebido. Então um usuário comum, só por estar logado, consegue chamar a API administrativa.
    task: |
      Na aba **Aplicação**, entre agora como o usuário **comum** (`pedro.alves` / `Pedro#SantaClara26`). No navegador, abra a rota da API administrativa direto:

      ```
      /api/admin/usuarios
      ```

      (ou pela aba **Terminal**, com a sessão do comum, chame `curl` nessa rota). Veja que a lista completa de usuários volta, mesmo você sendo comum. Informe abaixo se o usuário comum **conseguiu** ou foi **barrado** ao chamar a API de admin.
    explore: |
      **Por que isso é grave.** A API devolve login, nome e papel de todo mundo — um mapa dos administradores para um próximo ataque. Em sistemas reais, funções assim criam, apagam ou promovem contas. Esconder o botão no menu não adianta: o atacante chama a rota direto.
    concept: Sem conferir o papel, a função de admin fica aberta a todos
    validatorRef: autorizacao-api/answer/resultado-sau-v1
    hints:
      - level: 1
        text: Veja se a resposta trouxe a lista de usuários ou uma negativa.
      - level: 2
        text: A API respondeu normalmente, mesmo para o usuário comum.
      - level: 3
        text: A resposta é `conseguiu`.
    points: 15
  - id: diferenca
    order: 3
    title: Separar autenticação de autorização
    explanation: |
      Estar logado (autenticado) não é o mesmo que ter permissão (autorizado). A API confere que o usuário fez login (`login_obrigatorio`), mas não confere o **papel**. Essas são duas perguntas diferentes, e as duas precisam de resposta.
    task: |
      Qual é a palavra para a checagem que falta — não "quem é o usuário", mas "o que ele pode fazer"?

      Responda com uma palavra.
    concept: Autenticação diz quem é; autorização diz o que pode fazer
    validatorRef: autorizacao-api/answer/conceito-sau-v1
    hints:
      - level: 1
        text: Começa com "autor...".
      - level: 2
        text: É decidir o que um usuário TEM PERMISSÃO de fazer.
      - level: 3
        text: A resposta é `autorização`.
    points: 15
  - id: papel
    order: 4
    title: Nomear o que precisa ser conferido
    explanation: |
      A função administrativa só pode rodar para quem tem o papel certo. A correção é conferir, no servidor, se o papel do usuário é o de administrador antes de executar a função.
    task: |
      Que papel o usuário precisa ter para usar a API administrativa?

      Responda com uma palavra (o papel exigido).
    concept: Só o papel admin pode usar a função administrativa
    validatorRef: autorizacao-api/answer/papel-sau-v1
    hints:
      - level: 1
        text: É o papel oposto de "comum".
      - level: 2
        text: Aparece no painel, no campo Papel, para a conta de administrador.
      - level: 3
        text: A resposta é `admin`.
    points: 15
  - id: corrigir
    order: 5
    title: Exigir o papel admin no serviço de permissão
    explanation: |
      **Por que a falha existe.** `pode_administrar` devolve `True` para todo mundo, sem olhar o papel.

      **A correção.** Devolver verdadeiro só quando o papel for `admin`. Assim, o usuário comum recebe "acesso negado" (HTTP 403) e o admin continua liberado.
    task: |
      Abra `services/permissao_service.py` e troque o método `pode_administrar` inteiro por este:

      ```python
          def pode_administrar(self, papel: str) -> bool:
              """Diz se o papel pode usar as funções administrativas."""
              return papel == "admin"
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. logado como o usuário **comum**, chame `/api/admin/usuarios` e veja que agora vem **acesso negado** (403);
      2. logado como **admin**, chame a mesma rota e veja que a lista **continua** vindo;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o `def pode_administrar` fica com 4 espaços; o corpo (`return papel == "admin"`), com 8.
    concept: Correção da autorização conferindo o papel admin no servidor
    validatorRef: autorizacao-api/python-flask/autorizacao-funcao-sau-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/permissao_service.py`, no método `pode_administrar`.'
      - level: 2
        text: "Devolva True só quando papel == \"admin\"."
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def` fica com 4 espaços.
    points: 45

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Distinguir autenticação (quem é) de autorização (o que pode fazer)
    - Explorar a falha chamando a API administrativa como um usuário comum
    - Reconhecer que cada função sensível precisa conferir o papel do usuário
    - Corrigir exigindo o papel admin antes de executar a função
  story:
    role: Pessoa desenvolvedora do time de sistemas do Hospital Santa Clara
    application: Console Interno, onde a equipe acessa, conforme o papel, as funções de atendimento e as administrativas
    context: >-
      O Console Interno tem uma API administrativa que lista todos os usuários e deveria ser só do papel admin. Numa auditoria, a equipe apontou que a API não confere o papel — um usuário comum, logado, chama a API de admin e recebe a lista completa.
    mission: Confirmar que o usuário comum usa a API administrativa e corrigir exigindo o papel admin
  wrapUp:
    text: |
      Agora a API administrativa só responde para o papel admin. Em um sistema real, vale reforçar:

      - **Autenticar não é autorizar.** Saber quem é o usuário (ele fez login) não diz o que ele pode fazer. Cada função sensível precisa conferir, no servidor, se aquele usuário tem permissão para ela.
      - **Autorização em nível de função (BFLA).** Esconder o link do menu de admin não protege a API: quem ataca chama a rota direto. A checagem de papel tem que estar na própria função, no servidor.
      - **Negue por padrão.** Prefira liberar explicitamente (só `admin`) a bloquear casos conhecidos. Uma função nova deve começar negada para quem não tem papel suficiente.
      - **O papel vem de fonte confiável.** O papel sai do banco e fica na sessão do servidor; nunca de um campo que o cliente mande no pedido (isso seria outra falha, de confiança no cliente).

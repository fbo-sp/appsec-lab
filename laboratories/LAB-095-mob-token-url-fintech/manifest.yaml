learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: beginner
  objectives:
    - Entender por que um segredo na URL vaza mesmo com HTTPS
    - Encontrar o token de sessão no log e reaproveitá-lo
    - Saber onde o token deve viajar
    - Corrigir o servidor para recusar token na URL e o app para parar de mandá-lo
  story:
    role: >-
      Pessoa desenvolvedora do time de apps do banco digital Pagomais
    application: >-
      App Pagomais, o app em que o cliente consulta o extrato
    context: >-
      O time de segurança de uma empresa cliente avisou a Pagomais que o log do proxy corporativo deles mostrava URLs da API do app com o token de sessão inteiro, de dezenas de funcionários que usam o app no Wi-Fi da empresa.
    mission: >-
      Mostrar que o token de sessão na URL fica gravado em logs e pode ser reaproveitado, e corrigir o servidor e o app para que o token só viaje no cabeçalho Authorization
  wrapUp:
    text: |
      Agora o token de sessão só viaja no cabeçalho `Authorization`, e o servidor recusa qualquer pedido com token na URL. Em um app real, vale reforçar:

      - **URL não é lugar de segredo.** Mesmo com HTTPS, a URL completa fica no log do servidor, em proxies corporativos e de inspeção TLS, em ferramentas de APM e no histórico. Token, senha, CPF e número de cartão vão no corpo ou no cabeçalho.
      - **Recuse, não só prefira.** Aceitar o token na URL "por compatibilidade" mantém o vazamento para sempre. Recuse e atualize o app.
      - **Mascare os logs.** Configure o servidor e os proxies para mascarar parâmetros sensíveis, e trate logs antigos com token como incidente: revogue as sessões expostas.
      - **Transporte seguro de verdade.** Só HTTPS (TLS 1.2+), certificado validado e, para apps de alto risco, *certificate pinning*. A validação de certificado e o pinning ficam para um laboratório próprio (MOB-13), porque precisam de TLS real.

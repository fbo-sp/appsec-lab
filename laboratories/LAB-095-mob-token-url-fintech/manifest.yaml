# LAB-095 (L9-FIN): token de sessão enviado na URL e gravado em logs (CWE-598) no App Pagomais da Pagomais (app mobile simulado, Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família L9 mob-token-url (ADR-021, ADR-025): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/mob-token-url; não edite este arquivo à mão.

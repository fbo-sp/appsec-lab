learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender a diferença entre a tela pedir a digital e o servidor exigir a digital
    - Explorar a falha chamando a operação sensível direto na API, sem passar pela biometria
    - Reconhecer que o servidor precisa receber e validar uma prova da biometria
    - Corrigir o serviço da operação exigindo uma prova válida e recente
  story:
    role: >-
      Pessoa desenvolvedora do time de apps do banco digital Pagomais
    application: >-
      App Pagomais, o app em que o cliente consulta o extrato e faz operações sensíveis
    context: >-
      O app de contas da Pagomais pede a digital antes de a transferência por PIX, mas a API executa a operação sem conferir se a biometria aconteceu.
    mission: >-
      Executar a operação sem a digital e corrigir a API para exigir uma prova válida da biometria
  wrapUp:
    text: |
      Agora a operação sensível só é executada com uma prova recente da biometria, conferida pelo servidor. Em um app real, vale reforçar:

      - **Tela não é controle.** Pedir a digital na interface é conforto do usuário. Se o servidor não confere nada, basta chamar a API direto (Terminal, proxy, app modificado ou Frida) para pular a tela.
      - **A prova certa é criptográfica.** No Android, `BiometricPrompt` com `CryptoObject` libera uma chave do Keystore que só funciona depois da digital; no iOS, o Keychain com `kSecAccessControlBiometryCurrentSet` faz o mesmo. O app assina um desafio do servidor com essa chave e o servidor confere a assinatura.
      - **Prova curta e amarrada.** A prova vale por pouco tempo, para uma conta e, de preferência, para aquela operação. Prova velha, de outra conta ou inventada é recusada.
      - **Biometria local sozinha não autentica no servidor.** Um retorno `true` do sensor é só um booleano dentro de um app que o atacante controla.

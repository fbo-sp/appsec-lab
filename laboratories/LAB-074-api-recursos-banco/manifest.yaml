steps:
  - id: conhecer
    order: 1
    title: Conhecer a API paginada
    explanation: |
      Você é do time de plataforma da Corretora Pináculo. No último dia útil do mês, a API de extrato ficou fora do ar por 40 minutos, bem na hora em que os clientes conferiam o fechamento. No log, a infraestrutura achou um robô de agregação chamando /api/lancamentos com limite=1000000 a cada poucos segundos. O chamado chegou ao seu time: por que a API aceitou?

      Uma API que lista muitos itens devolve o resultado em **páginas**: o cliente diz quantos itens quer por vez (`limite`) e qual página (`pagina`). Isso protege o servidor e a rede, desde que o **servidor** imponha um teto. Se o tamanho da página fica a critério do cliente, uma única chamada pode pedir a base inteira: é o **consumo irrestrito de recursos** (OWASP API4).

      ```ilustracao
      paginacao-teto
      ```

      Siga a listagem pelas camadas:

      1. **Controller** (`controllers/api_controller.py`): lê `limite` e `pagina` da URL e registra no log o tamanho e o tempo da resposta.
      2. **Serviço** (`services/lancamento_service.py`): calcula o deslocamento e pede a página ao repositório. **É aqui que falta o teto.**
      3. **Repositório** (`repositories/lancamento_repository.py`): `SELECT ... LIMIT ? OFFSET ?`.

      As credenciais, neste laboratório, são:

      - Cliente: `eduardo.saraiva`, senha `Eduardo#Pinaculo26` (Eduardo Saraiva Monteiro).
    task: |
      1. Na aba **Aplicação**, entre como `eduardo.saraiva` / `Eduardo#Pinaculo26`.
      2. No painel, clique no link da API (`/api/lancamentos?limite=20&pagina=1`). O navegador mostra o JSON que o app recebe.

      Informe abaixo o valor do campo `quantidade` dessa resposta.
    concept: Paginação limita quanto cada chamada lê e devolve
    validatorRef: api-recursos/answer/quantidade-fin-v1
    hints:
      - level: 1
        text: O campo `quantidade` fica logo no começo do JSON.
      - level: 2
        text: É o mesmo número do `limite` do link.
      - level: 3
        text: A resposta é `20`.
    points: 10
  - id: explorar
    order: 2
    title: Pedir a base inteira numa chamada
    explanation: |
      O app pede 20 por vez, mas nada impede outra pessoa de chamar a API com outro `limite`. Neste laboratório a base da conta tem 3000 lançamentos, então o efeito é pequeno e contido; num banco de produção, com milhões de linhas, a mesma chamada prende o banco, a memória e a rede.
    task: |
      Na barra de endereço da aba **Aplicação**, troque o limite por um número enorme:

      ```
      /api/lancamentos?limite=100000
      ```

      Informe abaixo o valor de `quantidade` que veio na resposta.
    explore: |
      **Veja o custo no log.** O controller registra o tamanho e o tempo de cada listagem. No **Terminal**:

      ```bash
      grep "Listagem:" /tmp/app.log
      ```

      **O que procurar.** Compare a linha de `limite=20` com a de `limite=100000`: `itens` e `tempo_ms` crescem juntos. O app.log também registra os acessos (linhas com `GET`), por isso o `grep`.

      **O outro lado da mesma falha.** Recursos não são só CPU e memória: na mesma API, o envio do código de confirmação por SMS não tinha limite por conta, e cada SMS custa à corretora. Um robô que dispara milhares de códigos gera prejuízo direto, sem derrubar nada.
    concept: Sem teto no servidor, o cliente decide quanto o servidor trabalha
    validatorRef: api-recursos/answer/total-fin-v1
    hints:
      - level: 1
        text: Use exatamente a rota da tarefa e veja o campo `quantidade`.
      - level: 2
        text: Veio a base inteira da conta, descrita no comentário de `database/seed.py`.
      - level: 3
        text: A resposta é `3000`.
    points: 15
  - id: negativo
    order: 3
    title: Testar um valor especial
    explanation: |
      Quem valida só "não pode ser grande demais" esquece os valores especiais. No SQLite, `LIMIT -1` significa **sem limite**. Uma correção que faça só `min(limite, 100)` deixa o `-1` passar.
    task: |
      Abra agora:

      ```
      /api/lancamentos?limite=-1
      ```

      Informe abaixo se o `-1` devolveu **tudo** ou **nada**.
    concept: Zero, negativo e enorme precisam estar na validação
    validatorRef: api-recursos/answer/negativo-fin-v1
    hints:
      - level: 1
        text: Compare a `quantidade` com a da etapa anterior.
      - level: 2
        text: Veio o mesmo número de itens que com `limite=100000`.
      - level: 3
        text: A resposta é `tudo`.
    points: 15
  - id: onde
    order: 4
    title: Encontrar onde o limite deveria ser aplicado
    explanation: |
      O controller só converte o texto da URL em número. Quem decide o tamanho da página é o serviço: abra `services/lancamento_service.py`. Repare na constante `LIMITE_MAXIMO`, combinada com a infraestrutura, que ninguém usa.
    task: |
      Informe abaixo o nome do método do serviço que usa o `limite` do cliente sem teto.
    concept: O teto pertence ao serviço, antes do banco
    validatorRef: api-recursos/answer/metodo-fin-v1
    hints:
      - level: 1
        text: A classe do serviço tem um único método público.
      - level: 2
        text: É o método que o controller chama para montar a página.
      - level: 3
        text: A resposta é `listar`.
    points: 15
  - id: corrigir
    order: 5
    title: Aplicar o teto de página no servidor
    explanation: |
      **Por que a falha existe.** `listar` usa o `limite` como veio.

      **A correção.** Prender o limite entre 1 e `LIMITE_MAXIMO` antes de consultar: `max(1, min(limite, LIMITE_MAXIMO))`. O `min` corta o que for grande demais; o `max` impede zero e negativo. O app oficial, que pede 20, não percebe diferença.
    task: |
      Abra `services/lancamento_service.py` e troque o método `listar` inteiro por este:

      ```python
          def listar(self, conta_id: int, limite: int, pagina: int) -> list[Lancamento]:
              """Devolve uma página de lançamentos da conta, com no máximo LIMITE_MAXIMO itens."""
              limite = max(1, min(limite, LIMITE_MAXIMO))
              deslocamento = max(pagina - 1, 0) * limite
              return self._repositorio.listar(conta_id, limite, deslocamento)
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. abra `/api/lancamentos?limite=100000` e veja `quantidade` igual a 100;
      2. abra `/api/lancamentos?limite=-1` e veja que não vem mais tudo;
      3. abra o link do painel (`limite=20`) e veja que o app **continua** recebendo 20;
      4. clique em **Validar**.
    explore: |
      **Recusar ou limitar?** Duas escolhas são aceitas: limitar em silêncio (como aqui) ou recusar com HTTP 400 quando o pedido passa do teto. O importante é que o servidor nunca entregue mais que o máximo.

      **Se algo não funcionar depois de salvar.** No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      O `def listar` fica com 4 espaços; o corpo, com 8.
    concept: Teto de página entre 1 e o máximo, aplicado no servidor
    validatorRef: api-recursos/python-flask/teto-pagina-fin-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/lancamento_service.py`, no método `listar`.'
      - level: 2
        text: "Use max(1, min(limite, LIMITE_MAXIMO)) antes de calcular o deslocamento."
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def` fica com 4 espaços.
    points: 45

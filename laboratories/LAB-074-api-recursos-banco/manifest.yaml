  story:
    role: Pessoa desenvolvedora do time de plataforma da Corretora Pináculo
    application: Pináculo Invest, onde o investidor acompanha o extrato de movimentações pelo navegador e pelo app
    context: >-
      No último dia útil do mês, a API de extrato da Pináculo Invest ficou fora do ar por 40 minutos. O time de infraestrutura achou no log chamadas de um robô de agregação com limite=1000000, repetidas a cada poucos segundos, que faziam o banco ler o histórico inteiro de cada conta.
    mission: Reproduzir a listagem sem teto de forma contida, entender onde falta o limite e aplicá-lo no servidor
  wrapUp:
    text: |
      Agora a API entrega no máximo 100 lançamentos por chamada, qualquer que seja o `limite` pedido. Em um sistema real, vale reforçar:

      - **Todo parâmetro de tamanho tem teto no servidor.** Tamanho de página, quantidade de itens num lote, tamanho do arquivo enviado e profundidade de consulta. O app oficial pedir pouco não garante nada: quem ataca chama a API direto.
      - **Cuidado com os valores especiais.** Zero, negativo e muito grande. No SQLite, `LIMIT -1` é "sem limite"; outros bancos e bibliotecas têm armadilhas parecidas.
      - **Limite de taxa e de custo.** Além do tamanho, limite quantas chamadas cada conta faz por minuto, e principalmente as que custam dinheiro, como envio de SMS e consultas a bureaus pagos (o lab de tentativas de login mostra o limite por tentativas).
      - **Meça e alerte.** O log com `itens` e `tempo_ms` desta API é o tipo de sinal que o monitoramento usa para ver um abuso começando.

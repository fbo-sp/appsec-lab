steps:
  - id: conhecer
    order: 1
    title: Conhecer a busca e achar o serviço que monta o filtro
    explanation: |
      Você está no time de sistemas internos da Aurora Energia. O operador entra no Diretório de Equipe e busca colegas pelo nome para ver em que unidade cada um trabalha. Um pentest apontou que, digitando só um asterisco na busca, a tela devolve o diretório inteiro de uma vez. Isso é injeção de LDAP — o nome digitado está virando sintaxe de filtro em vez de ser tratado como texto.

      A busca monta um **filtro no estilo LDAP** a partir do nome digitado e consulta o diretório. Num diretório LDAP, o filtro `(cn=NOME)` procura pessoas cujo *common name* casa com `NOME`, e o `*` é **curinga**: `(cn=*)` casa com qualquer um.

      ```ilustracao
      ldap-injection
      ```

      Siga a busca pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): recebe o nome digitado e chama o serviço.
      2. **Serviço** (`services/busca_service.py`): monta o filtro e consulta o diretório. **É aqui que está a falha.**

      As credenciais válidas de um funcionário, neste laboratório, são:

      - Usuário `ti.suporte`, senha `TI#Aurora26`.
    task: |
      1. Na aba **Aplicação**, entre com `ti.suporte` e a senha `TI#Aurora26`. Você chega ao **Diretório de Equipe**.
      2. Busque por um nome que existe, por exemplo `Diego Campos Ferraz`, e veja a pessoa aparecer.
      3. Na aba **Código**, abra `services/busca_service.py`.

      Informe abaixo o nome do método que monta o filtro e faz a busca (o que o controller chama).
    concept: Injeção de LDAP — entrada do usuário juntada crua no filtro
    validatorRef: ldap-injection/answer/metodo-ind-v1
    hints:
      - level: 1
        text: 'Em `services/busca_service.py`, a classe `BuscaService` tem um único método público.'
      - level: 2
        text: É o método que o controller chama para buscar pessoas pelo nome.
      - level: 3
        text: O valor é `por_nome`.
    points: 10
  - id: explorar
    order: 2
    title: Buscar por um curinga e ver o diretório inteiro vazar
    explanation: |
      O método monta o filtro assim: `filtro = f"(cn={nome})"`. O nome digitado entra **cru**. Se você digita um texto normal, vira `(cn=João)` e tudo bem. Mas se você digita só um asterisco, vira `(cn=*)` — e o `*` é o curinga do LDAP, que casa com **todo mundo**.
    task: |
      Na aba **Aplicação**, no campo de busca do **Diretório de Equipe**, digite apenas:

      ```
      *
      ```

      e clique em **Buscar**. Veja que a tela devolve **todas** as pessoas do diretório de uma vez, não só uma. Informe abaixo o que a busca por `*` devolve: **uma pessoa** ou **o diretório inteiro**.
    explore: |
      **Por que isso é grave.** O nome digitado deixou de ser um dado e virou parte da **sintaxe** do filtro. Com `*` já dá para listar o diretório todo (vazamento de dados). Com outros caracteres de filtro (`(`, `)`, operadores `&` e `|`) dá para montar condições e, em alguns sistemas, contornar controles de acesso. É a mesma família da injeção de SQL, só que no diretório.
    concept: Sem escape, o * vira curinga e lista todo o diretório
    validatorRef: ldap-injection/answer/comportamento-ind-v1
    hints:
      - level: 1
        text: Compare a busca por um nome real com a busca por `*`.
      - level: 2
        text: O `*` é curinga; `(cn=*)` casa com qualquer pessoa.
      - level: 3
        text: A resposta é `o diretório inteiro`.
    points: 15
  - id: medida
    order: 3
    title: Nomear a defesa que falta
    explanation: |
      A falha é que o nome digitado entra cru no filtro e vira sintaxe. A defesa é **escapar** os caracteres especiais do filtro (`*`, `(`, `)`, `\` e o nulo) antes de montá-lo. Escapado, um `*` digitado vira `\2a`, que o diretório trata como o caractere `*` **literal** — texto, não curinga.
    task: |
      Complete a frase: para o nome digitado ser tratado como texto, e não como sintaxe do filtro, a busca precisa ___ os caracteres especiais antes de montar o filtro.

      Responda com um verbo (o que se faz com os caracteres especiais da entrada).
    concept: A defesa é escapar os caracteres especiais do filtro LDAP
    validatorRef: ldap-injection/answer/defesa-ind-v1
    hints:
      - level: 1
        text: É o mesmo que se faz com aspas e caracteres especiais para que virem texto.
      - level: 2
        text: Transformar `*` em `\2a`, `(` em `\28`, e assim por diante.
      - level: 3
        text: A resposta é `escapar`.
    points: 15
  - id: onde
    order: 4
    title: Decidir como a entrada passa a ser tratada
    explanation: |
      Depois de escapar, o que o usuário digita nunca muda a **estrutura** do filtro: continua sendo só um valor a procurar. Buscar por `*` passa a procurar o texto `*` (que ninguém tem como nome), em vez de virar curinga.

      O ponto central da correção é esse: a entrada do usuário tem que ser tratada como **dado/texto**, nunca como parte da sintaxe do filtro.
    task: |
      Depois da correção, o asterisco que o usuário digita passa a ser tratado como o quê dentro do filtro: como **curinga** (sintaxe) ou como **texto** (um dado comum)?

      Responda com uma palavra.
    concept: A entrada corrigida é tratada como texto, não como sintaxe
    validatorRef: ldap-injection/answer/onde-ind-v1
    hints:
      - level: 1
        text: O objetivo do escape é justamente tirar o poder de sintaxe do caractere.
      - level: 2
        text: Escapado, `*` deixa de ser curinga e vira um caractere comum.
      - level: 3
        text: A resposta é `texto`.
    points: 15
  - id: corrigir
    order: 5
    title: Escapar a entrada no serviço de busca
    explanation: |
      **Por que a falha existe.** `por_nome` monta `f"(cn={nome})"` com o nome cru. Qualquer caractere de filtro que o usuário digite entra como sintaxe.

      **A correção.** Antes de montar o filtro, trocar cada caractere especial da entrada pela sua forma escapada (RFC 4515): `\` → `\5c`, `*` → `\2a`, `(` → `\28`, `)` → `\29`. A ordem importa: a barra invertida tem que ser trocada **primeiro**, senão você escaparia as barras que acabou de inserir. Em um projeto real você usaria a função pronta da biblioteca de LDAP (por exemplo `ldap3.utils.conv.escape_filter_chars`); aqui o escape é escrito à mão para ficar explícito.
    task: |
      Abra `services/busca_service.py` e troque o corpo do método `por_nome` (as três linhas a partir do comentário) por este:

      ```python
              # Escapa os caracteres especiais do filtro LDAP: a entrada vira texto, não sintaxe.
              nome_seguro = nome
              for especial, escapado in (("\\", r"\5c"), ("*", r"\2a"), ("(", r"\28"), (")", r"\29")):
                  nome_seguro = nome_seguro.replace(especial, escapado)
              filtro = f"(cn={nome_seguro})"
              return buscar(filtro)
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então, na aba **Aplicação**:

      1. busque por `*` e veja que agora aparece **"Nenhuma pessoa encontrada"** — o curinga virou texto;
      2. busque por `Diego Campos Ferraz` e veja que a busca normal continua funcionando;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o corpo do método fica com 8 espaços, e a linha de dentro do `for` com 12. Copie o bloco da tarefa sem mudar o recuo.
    concept: Correção da injeção de LDAP escapando a entrada na camada de serviço
    validatorRef: ldap-injection/python-flask/busca-protegida-ind-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/busca_service.py`, na classe `BuscaService`.'
      - level: 2
        text: "Escape cada caractere especial do filtro antes de montar a string `(cn=...)`."
      - level: 3
        text: Copie o bloco da tarefa sem mudar o recuo. O corpo do método fica com 8 espaços; troque a barra invertida antes do resto.
    points: 45

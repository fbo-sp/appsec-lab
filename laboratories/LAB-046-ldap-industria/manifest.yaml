learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender por que juntar a entrada do usuário crua em um filtro LDAP permite injeção
    - Explorar a falha buscando por um curinga e vendo o diretório inteiro vazar
    - Reconhecer que a defesa é escapar os caracteres especiais do filtro antes de montá-lo
    - Corrigir a busca escapando a entrada na camada de serviço
  story:
    role: Pessoa desenvolvedora do time de sistemas internos da Aurora Energia
    application: Diretório de Equipe, onde o operador busca colegas pelo nome e vê a unidade
    context: >-
      O operador entra no Diretório de Equipe e busca colegas pelo nome. Um pentest apontou que, digitando apenas um asterisco na busca, a tela lista o diretório inteiro — injeção de LDAP.
    mission: Confirmar que a busca por um curinga lista todo o diretório e corrigir escapando os caracteres especiais do filtro
  wrapUp:
    text: |
      Agora a busca escapa os caracteres especiais do filtro, então o que o usuário digita é tratado como texto e não como sintaxe de filtro. Buscar por `*` não lista mais o diretório inteiro. Em um sistema real, vale reforçar:

      - **Injeção não é só SQL.** Qualquer lugar onde você monta uma consulta juntando texto do usuário — LDAP, comandos do sistema, XPath, NoSQL, cabeçalhos — tem o mesmo risco. A causa é sempre a mesma: dado do usuário virando sintaxe. Em LDAP, o `*` é curinga; `(`, `)`, `\` e o nulo também têm significado no filtro.
      - **Escape a entrada com a função da sua biblioteca.** Não monte a string de filtro na mão. Bibliotecas de LDAP trazem um escape de filtro pronto (por exemplo, `ldap3.utils.conv.escape_filter_chars` em Python, ou `javax.naming` no Java). Ele cobre os caracteres certos; a lista escrita à mão esquece algum.
      - **Prefira consultas parametrizadas quando houver.** Assim como `?` no SQL, algumas APIs de diretório permitem montar o filtro com os valores separados da estrutura, o que elimina a injeção na origem.
      - **Valide e limite também.** Aceite só o que faz sentido para um nome, limite o tamanho e devolva no máximo uma página de resultados. Isso reduz o estrago mesmo que um escape falhe.

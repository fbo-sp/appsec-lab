  objectives:
    - Entender o que é um WebView e por que o HTML dele é código do app
    - Mostrar que uma mensagem escrita por outro usuário vira HTML dentro do app
    - Saber o que a codificação de saída e a política de conteúdo (CSP) protegem
    - Corrigir a página da central sem o filtro safe e com CSP
  story:
    role: >-
      Pessoa desenvolvedora do time de apps do banco digital Pagomais
    application: >-
      App Pagomais, o app em que o cliente vê o extrato e as mensagens que chegam junto com cada Pix
    context: >-
      Clientes da Pagomais receberam Pix de R$ 0,01 com mensagens que, na central de mensagens do app, apareciam como um botão "Atualize seus dados" com a cara do banco. A central é uma página mostrada num WebView.
    mission: >-
      Mostrar que uma mensagem escrita por outro usuário vira HTML dentro do app e corrigir a página da central com codificação de saída e política de conteúdo
  wrapUp:
    text: |
      Agora a mensagem aparece como texto, do jeito que foi escrita, e a página da central diz ao WebView que não carregue nem execute nada além do próprio estilo. Em um app real, vale reforçar:

      - **WebView é código do app.** Tudo que a página do WebView mostra roda dentro do app oficial, com a confiança que o usuário tem nele. Trate cada campo vindo de outro usuário como entrada não confiável.
      - **Codifique na saída, sempre.** Deixe o template codificar (`{{ texto }}`); `|safe` e `innerHTML` com dado de usuário são bugs. Se precisar de formatação, use um formato limitado (como Markdown) e um sanitizador com lista de permissões.
      - **Desligue o que não usa.** Num WebView nativo, deixe JavaScript desligado quando a página não precisa (`setJavaScriptEnabled(false)` no Android), não exponha pontes (`addJavascriptInterface`) e não carregue arquivos locais.
      - **CSP é a segunda camada.** Ela não substitui a codificação, mas limita o estrago se algo escapar.

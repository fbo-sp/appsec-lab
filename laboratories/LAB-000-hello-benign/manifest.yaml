# LAB-000 — laboratório BENIGNO de teste do motor (sem vulnerabilidade intencional).
# Finalidade: exercitar contrato de manifesto, registro, sessão e ciclo de vida do runtime.
# NÃO é conteúdo pedagógico do MVP e não deve ser publicado para alunos.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE de teste (sha256 de um texto fixo), não uma imagem
# publicada. Só é aceitável com o FakeRuntimeAdapter, que não faz pull de imagens. O pipeline de
# publicação (IMP-028/US-028) deverá verificar a existência do digest no registry.
apiVersion: labs.cecyber.io/v1alpha1
kind: AppSecLab
metadata:
  id: LAB-000
  version: 0.2.0
  title: Laboratório benigno de verificação do motor
  # O contrato exige uma CWE principal. CWE-1000 é a raiz da visão "Research Concepts" do MITRE,
  # usada aqui apenas como marcador neutro: este laboratório NÃO contém vulnerabilidade.
  primaryCwe: CWE-1000
  secondaryCwes: []
learning:
  singleVulnerability: true
  estimatedMinutes: 5
  difficulty: beginner
  objectives:
    - Verificar que a plataforma provisiona, consulta e encerra uma sessão de laboratório
    - Experimentar o fluxo de etapas com validação automática fora do workspace
  story:
    role: Engenheiro(a) de plataforma
    application: Serviço "hello" fictício que apenas responde a uma verificação de saúde
    context: Homologação técnica do motor de laboratórios antes de qualquer conteúdo vulnerável
    mission: Explorar o ambiente, alterar a página e validar cada etapa
variants:
  - id: python-http
    language: python
    framework: stdlib
    image: registry.local/labs/lab-000-hello@sha256:9b80e32c25ae1954058eb513d96cac3ae4ba525cf0d1bb641b7b980c6cb857fb
    runtimeProfile: benign-test
    workspacePath: /workspace
    startup:
      command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
      port: 8080
    resources:
      cpuMillicores: 100
      memoryMiB: 128
      storageMiB: 64
      pidsMax: 32
    session:
      ttlMinutes: 15
    interfaces: [editor, terminal, web]
steps:
  - id: explore
    order: 1
    title: Explorar o ambiente
    explanation: Seu laboratório roda em um contêiner exclusivo e temporário, com um usuário sem privilégios.
    task: No terminal, descubra com qual usuário seus comandos são executados e informe-o abaixo.
    concept: Princípio do menor privilégio
    validatorRef: benign/answer/whoami-v1
    hints:
      - level: 1
        text: O terminal fica logo abaixo do editor de arquivos.
      - level: 2
        text: O comando whoami mostra o nome do usuário atual.
    points: 40
  - id: edit-page
    order: 2
    title: Alterar a aplicação
    explanation: >-
      A validação não confia no seu ambiente: ela copia o workspace, sobe uma instância isolada da
      aplicação e testa o comportamento a partir de fora.
    task: Edite index.html para que a página inicial exiba o texto “Olá, CECyber”, salve e clique em Validar.
    concept: Validação comportamental fora do workspace
    validatorRef: benign/python-http/edit-page-v1
    hints:
      - level: 1
        text: Abra o arquivo index.html na lista de arquivos.
      - level: 2
        text: Inclua, por exemplo, <p>Olá, CECyber</p> dentro de <body> e salve com Ctrl+S.
    points: 60
policy:
  sequentialUnlock: true
  allowStepRetry: true
  persistProgressAcrossReset: true
  allowSolutionReveal: false
  finalPassingScore: 100

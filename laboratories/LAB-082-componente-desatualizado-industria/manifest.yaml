learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender por que uma dependência desatualizada é uma falha da sua aplicação
    - Usar o inventário de dependências (requirements.txt e SBOM) para cruzar versões com um aviso de segurança
    - Reproduzir a falha publicada da biblioteca de forma controlada
    - Corrigir atualizando a dependência, e não com um filtro de texto no código
  story:
    role: Pessoa desenvolvedora do time de sistemas de manutenção da Siderúrgica Ferro Norte
    application: Ferro Norte Manutenção, onde o técnico acompanha as ordens de serviço da área e gera a OS para impressão
    context: >-
      O time de segurança de produtos publicou o AVISO-2026-031 sobre a biblioteca interna relatorix, que imprime as ordens de serviço. O sistema de manutenção usa a relatorix desde 2023 e ninguém atualizou a versão desde então. O sistema é acessado por empreiteiras pela internet, e o prazo é de sete dias.
    mission: Cruzar a versão da biblioteca com o aviso, reproduzir a falha publicada e corrigir atualizando a dependência
  wrapUp:
    text: |
      A aplicação agora usa a relatorix 2.4.1 e o modelo de documento não sai mais da pasta. Em um sistema real, vale reforçar:

      - **Saiba o que você usa.** Mantenha um inventário de componentes (SBOM) de cada sistema, inclusive das dependências das dependências. Sem ele, um aviso como o AVISO-2026-031 vira uma caça manual em dezenas de repositórios.
      - **Automatize o cruzamento.** Ferramentas de SCA (como `pip-audit`, OWASP Dependency-Check, Dependabot ou Renovate) comparam as versões fixadas com as bases de vulnerabilidades e abrem o pedido de atualização sozinhas.
      - **Atualize de verdade.** Filtros de texto no seu código não corrigem a falha de uma biblioteca: ela pode decodificar, normalizar ou montar caminhos de um jeito que seu filtro não vê.
      - **Componente sem manutenção também é risco.** Uma biblioteca parada há anos não recebe correções; planeje a troca antes do próximo aviso. A OWASP 2025 ampliou o tema para toda a cadeia de suprimentos (A03).
    references:

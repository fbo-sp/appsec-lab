steps:
  - id: conhecer
    order: 1
    title: Conhecer o sistema e suas dependências
    explanation: |
      Você é do time de sistemas de manutenção da Siderúrgica Ferro Norte. Na segunda-feira, o Time de Segurança de TI e TA publicou o AVISO-2026-031: a biblioteca interna relatorix, que imprime as ordens de serviço, deixa ler arquivos fora da pasta de modelos. O sistema de manutenção é usado por empreiteiras pela internet, então o prazo é de sete dias. O detalhe constrangedor: a versão da relatorix no sistema é a mesma desde 2023, quando ele entrou no ar.

      Quase todo sistema é feito mais de código de terceiros do que de código próprio. Cada biblioteca entra com uma **versão fixada** (o *pin*, como `relatorix==2.1.0`), e é essa versão que roda em produção até alguém atualizá-la. Quando uma falha é descoberta numa versão, todos os sistemas que a usam ficam vulneráveis, mesmo sem uma linha errada no código deles: é a falha de **componentes vulneráveis e desatualizados** (OWASP A06:2021, A03:2025).

      ```ilustracao
      dependencia-desatualizada
      ```

      Siga a geração do documento pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): recebe o modelo escolhido na tela.
      2. **Serviço** (`services/documento_service.py`): junta os dados da conta e chama a biblioteca.
      3. **Biblioteca** `relatorix`: abre o modelo da pasta `modelos/` e preenche os campos. A versão usada está em `requirements.txt`.

      As credenciais, neste laboratório, são:

      - Técnico de manutenção: `diego.carvalho`, senha `Diego#FerroNorte26` (Diego Carvalho Neves).
    task: |
      1. Na aba **Aplicação**, entre como `diego.carvalho` / `Diego#FerroNorte26`, escolha o modelo **Padrão** e clique em **Gerar documento**.
      2. Na aba **Código**, abra `requirements.txt`.

      Informe abaixo a versão da biblioteca `relatorix` que a aplicação usa.
    explore: |
      **Veja o mesmo dado no inventário.** Abra `sbom.json`. É um SBOM (*Software Bill of Materials*) no formato CycloneDX: a lista de componentes do sistema, com nome, versão e identificador (`purl`). É o documento que o time de segurança consulta para saber quais sistemas usam uma biblioteca quando sai um aviso.

      **Por que vale olhar.** No dia a dia, o SBOM é gerado no pipeline de build e inclui também as dependências das dependências, que não aparecem no `requirements.txt`.
    concept: Cada dependência roda na versão fixada até alguém atualizá-la
    validatorRef: componente-desatualizado/answer/versao-ind-v1
    hints:
      - level: 1
        text: Procure a linha que começa com `relatorix` em `requirements.txt`.
      - level: 2
        text: A versão vem depois de `==`. A tela do painel também mostra a versão do gerador.
      - level: 3
        text: A resposta é `2.1.0`.
    points: 10
  - id: aviso
    order: 2
    title: Cruzar a versão com o aviso de segurança
    explanation: |
      Quando uma falha é encontrada numa biblioteca, o fornecedor (ou o time de segurança da empresa) publica um **aviso**: o que a falha permite, quais versões são afetadas e qual versão corrige. O trabalho de quem mantém o sistema é cruzar o aviso com o inventário: "eu uso uma versão afetada?"
    task: |
      Na aba **Código**, abra `avisos/AVISO-2026-031-relatorix.md` e compare com a versão da etapa 1.

      Informe abaixo a versão da `relatorix` que corrige a falha.
    explore: |
      **Leia as notas de versão.** No espelho interno, abra `espelho/relatorix/2.4.1/CHANGELOG.md`. A linha "Segurança" diz exatamente o que mudou na 2.4.1.

      **Por que vale olhar.** Antes de atualizar uma dependência em produção, o time lê o changelog para saber se a nova versão muda algum comportamento que o sistema usa. Aqui, a única mudança visível é a mensagem de erro.
    concept: O aviso diz o que a falha permite, quem é afetado e qual versão corrige
    validatorRef: componente-desatualizado/answer/corrigida-ind-v1
    hints:
      - level: 1
        text: Veja a tabela "Versões afetadas e corrigidas" do aviso.
      - level: 2
        text: É a versão marcada como "Corrigida".
      - level: 3
        text: A resposta é `2.4.1`.
    points: 15
  - id: explorar
    order: 3
    title: Reproduzir a falha publicada
    explanation: |
      O aviso diz que a `relatorix` até a 2.4.0 abre o modelo pelo nome sem conferir se ele fica dentro da pasta `modelos/`. O nome do modelo vem da tela, no parâmetro `modelo` da rota `/documento`. Então um nome que sobe um nível com `../` faz o gerador abrir um arquivo de fora da pasta, como `config/integracoes_demo.ini`, um arquivo interno (fictício) que nunca deveria chegar ao navegador.
    task: |
      Na aba **Terminal**, entre com a conta da etapa 1 e peça o arquivo de configuração como se fosse um modelo:

      ```bash
      curl -s -c /tmp/c -d "login=diego.carvalho&senha=Diego#FerroNorte26" http://127.0.0.1:8080/login > /dev/null
      curl -s -b /tmp/c "http://127.0.0.1:8080/documento?modelo=../config/integracoes_demo.ini"
      ```

      Informe abaixo o texto que aparece na primeira linha da resposta, depois do `;`.
    explore: |
      **A forma codificada.** O aviso cita `%2e%2e%2f`, que é `../` codificado. Teste:

      ```bash
      curl -s -b /tmp/c "http://127.0.0.1:8080/documento?modelo=%252e%252e%252fconfig%252fintegracoes_demo.ini"
      ```

      O `%25` vira `%` quando o Flask lê o parâmetro, e a biblioteca decodifica de novo por conta própria (`unquote`). O código da aplicação vê `%2e%2e%2fconfig...`, sem nenhum `..` ou `/`, mas a biblioteca abre `../config/...`. **É por isso que um filtro de texto no seu código não corrige a falha de uma biblioteca.**
    concept: A falha publicada da biblioteca vira uma falha do seu sistema
    validatorRef: componente-desatualizado/answer/marcador-ind-v1
    hints:
      - level: 1
        text: A primeira linha do arquivo `.ini` é um comentário que começa com `;`.
      - level: 2
        text: Também dá para abrir `config/integracoes_demo.ini` na aba **Código** e ver a mesma linha.
      - level: 3
        text: A resposta é `INTEGRACOES-DEMO`.
    points: 15
  - id: onde
    order: 4
    title: Decidir onde se corrige
    explanation: |
      A tentação é abrir `services/documento_service.py` e bloquear nomes com `..`. Não resolve: a biblioteca decodifica o nome depois do seu filtro (veja o **Explorar mais** da etapa 3), e a próxima falha da mesma versão não vai caber no seu filtro. O próprio aviso orienta: atualizar a dependência. A correção é trocar a versão fixada, no arquivo que declara as dependências.
    task: |
      Informe abaixo o nome do arquivo onde a versão da `relatorix` é fixada.
    concept: Falha de componente se corrige atualizando o componente
    validatorRef: componente-desatualizado/answer/arquivo-ind-v1
    hints:
      - level: 1
        text: É o arquivo que você abriu na etapa 1.
      - level: 2
        text: É o arquivo que o `pip install -r` lê.
      - level: 3
        text: A resposta é `requirements.txt`.
    points: 15
  - id: corrigir
    order: 5
    title: Atualizar a dependência
    explanation: |
      **Por que a falha existe.** A aplicação fixa `relatorix==2.1.0`, uma versão afetada pelo AVISO-2026-031.

      **A correção.** Fixar a versão corrigida, `2.4.1`. Ela confere, depois de decodificar o nome, que o caminho final fica dentro da pasta `modelos/`. Os modelos legítimos continuam funcionando.
    task: |
      Abra `requirements.txt` e troque a linha da `relatorix` por esta:

      ```text
      relatorix==2.4.1
      ```

      Salve com **Ctrl+S**. A aplicação reinicia com a nova versão (o painel passa a mostrar "relatorix 2.4.1"). Então:

      1. entre de novo como `diego.carvalho` e gere o documento no modelo **Padrão**, para ver que ele continua funcionando;
      2. repita o `curl` da etapa 3 (os dois comandos) e veja a resposta "Modelo de documento não encontrado";
      3. clique em **Validar**.
    explore: |
      **Confira qual versão foi carregada.** No **Terminal**:

      ```bash
      grep "espelho interno" /tmp/app.log
      ```

      O `app.log` também registra os acessos (linhas `GET /...`); o `grep` mostra só a linha de quais pacotes o carregador usou, uma por reinício.

      **Se a aplicação não subir depois de salvar.** Uma versão que não existe no espelho gera um erro que lista as versões disponíveis:

      ```bash
      grep -iE "error|espelho" /tmp/app.log | tail -n 5
      ```
    concept: Atualizar a dependência para a versão corrigida
    validatorRef: componente-desatualizado/python-flask/versao-corrigida-ind-v1
    hints:
      - level: 1
        text: 'A mudança é só em `requirements.txt`, na linha da `relatorix`.'
      - level: 2
        text: Use a versão marcada como "Corrigida" no aviso da etapa 2.
      - level: 3
        text: A linha fica `relatorix==2.4.1`. Salve e espere o painel mostrar a nova versão.
    points: 45
policy:
  sequentialUnlock: true
  allowStepRetry: true
  persistProgressAcrossReset: true
  allowSolutionReveal: false
  finalPassingScore: 100

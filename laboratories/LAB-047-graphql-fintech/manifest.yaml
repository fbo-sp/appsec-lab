learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender que BOLA é a autorização por objeto quebrada, mesmo com o usuário autenticado
    - Explorar a falha pedindo, pela API GraphQL, o objeto de outro usuário só trocando o id
    - Reconhecer que o resolver precisa conferir o dono de cada objeto, não só se há login
    - Corrigir o resolver conferindo que o objeto pertence ao usuário logado
  story:
    role: Pessoa desenvolvedora do time de API da fintech Pagomais
    application: Portal de Pagamentos, onde o cliente consulta seus pagamentos por uma API GraphQL
    context: >-
      O cliente consulta seus pagamentos pela API GraphQL. Um teste de invasão alertou que, logado como um cliente, dá para ler o pagamento de outro cliente só trocando o id na query — BOLA.
    mission: Confirmar que a API devolve o pedido de outro usuário e corrigir conferindo o dono no resolver
  wrapUp:
    text: |
      Agora o resolver confere o dono de cada pedido, então um usuário só lê os seus. Em um sistema real, vale reforçar:

      - **Autenticação não é autorização.** Saber *quem* é o usuário (login) é diferente de decidir *o que* ele pode ver. BOLA acontece quando a API confere o login mas devolve qualquer objeto pelo id, sem checar o dono. É a falha nº 1 da OWASP API Security Top 10.
      - **A checagem é por objeto, no servidor.** Para cada objeto que a API devolve (pedido, exame, documento, conta), confira no servidor se o usuário logado tem direito àquele objeto específico. Não confie em id que vem do cliente como se fosse sempre o dele.
      - **GraphQL não dá autorização de graça.** O resolver de cada campo precisa aplicar a mesma regra de acesso que você aplicaria numa rota REST. Trocar o transporte (REST, GraphQL, gRPC) não muda a responsabilidade.
      - **Ids difíceis de adivinhar não resolvem.** Usar UUID em vez de 1, 2, 3 só dificulta o chute; não é controle de acesso. A defesa é checar o dono, não esconder o id.
    references:

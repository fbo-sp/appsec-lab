steps:
  - id: conhecer
    order: 1
    title: Conhecer a API GraphQL e achar o resolver do pedido
    explanation: |
      Você está no time de API da fintech Pagomais. O cliente consulta seus pagamentos por uma API GraphQL (POST /graphql). O time de segurança abriu um chamado: logado como um cliente, dá para ler o pagamento de qualquer outro cliente só trocando o id na query. A API confere que você está logado, mas não confere se o pagamento pedido é seu — é BOLA, a autorização por objeto quebrada.

      A consulta é feita por uma API `POST /graphql`, com um corpo JSON como `{"query": "{ pedido(id: 1) { descricao valor } }", "variables": {"id": 1}}`. (Para o laboratório ficar direto, a API é um GraphQL **simplificado**: só a operação `pedido` existe e o id vem de `variables.id`.)

      ```ilustracao
      graphql-bola
      ```

      Siga o pedido pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): recebe a query, pega o id do usuário logado da sessão e chama o resolver.
      2. **Serviço/resolver** (`services/pedido_service.py`): devolve o pedido. **É aqui que falta conferir o dono.**

      As credenciais válidas de um usuário, neste laboratório, são:

      - Usuário `ana.ribeiro`, senha `Ana#Pagomais26` (dono do pedido de id `1`).
    task: |
      1. Na aba **Aplicação**, entre com `ana.ribeiro` e a senha `Ana#Pagomais26`. Você chega ao **Portal de Pagamentos**.
      2. Na aba **Código**, abra `services/pedido_service.py`.

      Informe abaixo o nome do método que resolve o pedido (o que o controller chama).
    concept: BOLA — a API devolve o objeto pelo id sem conferir o dono
    validatorRef: graphql-bola/answer/metodo-fin-v1
    hints:
      - level: 1
        text: 'Em `services/pedido_service.py`, a classe `PedidoService` tem um único método público.'
      - level: 2
        text: É o método que o controller chama, passando o id do usuário logado e o id do pedido.
      - level: 3
        text: O valor é `resolver`.
    points: 10
  - id: explorar
    order: 2
    title: Pedir o pedido de outro usuário só trocando o id
    explanation: |
      O resolver recebe o id do usuário logado **e** o id do pedido, mas usa só o id do pedido para buscar no banco. Ele não compara o dono do pedido com quem está logado. Então, trocando o id na query, você pede o objeto de qualquer outro usuário.
    task: |
      Logado como `ana.ribeiro` (dono do pedido `1`), use o **Terminal** para pedir o pedido de **outro** usuário, de id `2`:

      ```bash
      curl -s -b /tmp/cookie.txt -c /tmp/cookie.txt \
        -X POST http://127.0.0.1:8080/login \
        --data "login=ana.ribeiro&senha=Ana#Pagomais26" -o /dev/null
      curl -s -b /tmp/cookie.txt -H "Content-Type: application/json" \
        -X POST http://127.0.0.1:8080/graphql \
        --data '{"query":"{ pedido(id: 2) { descricao valor } }","variables":{"id":2}}'
      ```

      Veja que a resposta traz a descrição do pedido `2`, que **não é seu**. Informe abaixo se a API **devolve** o pedido de outro usuário ou **nega** o acesso.
    explore: |
      **Por que isso é grave.** Com um laço trocando o id (`1, 2, 3, …`), um atacante baixa os objetos de todos os usuários — dados de pagamento, exames, ordens. É exatamente o cenário de BOLA/IDOR: a API confia num id que o cliente escolhe. Ids em UUID só dificultam o chute; não são controle de acesso.
    concept: Trocando o id, a API devolve o objeto de outro usuário
    validatorRef: graphql-bola/answer/comportamento-fin-v1
    hints:
      - level: 1
        text: Compare a descrição que voltou com a do seu próprio pedido (id `1`).
      - level: 2
        text: O pedido `2` é de outro usuário, mas a API devolveu mesmo assim.
      - level: 3
        text: A resposta é `devolve`.
    points: 15
  - id: medida
    order: 3
    title: Nomear o que o resolver precisa conferir
    explanation: |
      A API já confere que você está **logado** (a rota exige login). O que falta é conferir, para **cada objeto**, se ele pertence ao usuário logado. O resolver tem o id do usuário logado em mãos; basta comparar com o dono do pedido.
    task: |
      Complete a frase: antes de devolver o pedido, o resolver precisa conferir se o ___ do pedido é o usuário logado.

      Responda com uma palavra (quem é o titular do objeto).
    concept: O resolver precisa conferir o dono do objeto
    validatorRef: graphql-bola/answer/defesa-fin-v1
    hints:
      - level: 1
        text: É quem o pedido pertence; está na coluna `dono_id` do pedido.
      - level: 2
        text: Compare `pedido.dono_id` com o id do usuário logado.
      - level: 3
        text: A resposta é `dono`.
    points: 15
  - id: onde
    order: 4
    title: Separar estar logado de ter direito ao objeto
    explanation: |
      É tentador achar que, se a rota exige login, está tudo protegido. Não está: **autenticação** responde *quem é você*; **autorização por objeto** responde *você pode ver este objeto específico?*. BOLA é exatamente confundir as duas — exigir login e esquecer de checar o dono de cada objeto.
    task: |
      Estar autenticado (logado) já garante, sozinho, que você só consegue ver os **seus** pedidos?

      Responda com uma palavra: sim ou não.
    concept: Autenticação não é autorização por objeto
    validatorRef: graphql-bola/answer/onde-fin-v1
    hints:
      - level: 1
        text: Você estava logado e mesmo assim leu o pedido de outro usuário.
      - level: 2
        text: Login diz quem você é; não diz a quais objetos você tem direito.
      - level: 3
        text: A resposta é `não`.
    points: 15
  - id: corrigir
    order: 5
    title: Conferir o dono do pedido no resolver
    explanation: |
      **Por que a falha existe.** `resolver` recebe `usuario_id`, mas busca o pedido só por `pedido_id` e devolve. O dono nunca é comparado.

      **A correção.** Depois de buscar o pedido, conferir se ele existe **e** se o `dono_id` é o usuário logado. Se não for (ou não existir), devolver `None` — a API responde "acesso negado", sem vazar o objeto de ninguém.
    task: |
      Abra `services/pedido_service.py` e troque o corpo do método `resolver` (as duas linhas a partir do comentário) por este:

      ```python
              # Confere o dono: só devolve o pedido se ele pertencer ao usuário logado.
              pedido = self._repositorio.buscar(pedido_id)
              if pedido is None or pedido.dono_id != usuario_id:
                  return None
              return pedido
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então, no **Terminal** (logado como `ana.ribeiro`):

      1. peça o pedido `1` (o seu) e veja que ele continua voltando;
      2. peça o pedido `2` (de outro) e veja que agora a resposta é **"acesso negado"**;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o corpo do método fica com 8 espaços e o `return None` de dentro do `if` com 12. Copie o bloco da tarefa sem mudar o recuo.
    concept: Correção do BOLA conferindo o dono do objeto no resolver
    validatorRef: graphql-bola/python-flask/resolver-protegido-fin-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/pedido_service.py`, no método `resolver`.'
      - level: 2
        text: "Depois de buscar, compare `pedido.dono_id` com `usuario_id` e devolva `None` se não baterem."
      - level: 3
        text: Copie o bloco da tarefa sem mudar o recuo. O corpo do método fica com 8 espaços.
    points: 45

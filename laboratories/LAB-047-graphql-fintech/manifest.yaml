# LAB-047 (A17-FIN): BOLA numa API GraphQL (CWE-639) no Portal de Pagamentos da Pagomais (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família A17 graphql-bola (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/graphql-bola; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

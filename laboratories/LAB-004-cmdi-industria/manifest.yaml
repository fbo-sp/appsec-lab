# LAB-004: OS Command Injection (CWE-78) no portal de manutenção da Ferrara Metais (Flask).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. A injeção executa comandos só dentro do contêiner da sessão, como o usuário sem
# privilégios 10001, sem capabilities e sem rede externa. CLPs simulados e dados 100% fictícios.
# Gate G5 (contenção validada) continua obrigatório antes de qualquer ambiente além do local.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.
apiVersion: labs.cecyber.io/v1alpha1
kind: AppSecLab
metadata:
  id: LAB-004
  version: 1.0.0
  title: "Command Injection: o teste de rede que virou terminal"
  primaryCwe: CWE-78
  secondaryCwes: []
learning:
  singleVulnerability: true
  estimatedMinutes: 40
  difficulty: beginner
  objectives:
    - Reconhecer quando uma aplicação repassa dados do usuário para o shell do sistema operacional
    - Entender o papel dos metacaracteres do shell, como ponto e vírgula, pipe e $( )
    - Demonstrar o impacto lendo um arquivo sensível fictício da planta
    - Corrigir a falha validando a entrada e executando o programa sem shell, com lista de argumentos
  story:
    role: Desenvolvedor(a) do time de sistemas industriais da Ferrara Metais
    application: Portal de Manutenção da Planta Contagem, com o teste de comunicação com CLPs
    context: >-
      O time de segurança de OT (tecnologia operacional) encontrou, no log do portal de manutenção,
      comandos estranhos executados junto com o teste de comunicação dos CLPs. O portal fica na mesma
      rede do supervisório SCADA que controla as linhas de produção.
    mission: Reproduzir o ataque, entender até onde ele chega e corrigir o código do teste
  wrapUp:
    text: |
      Agora o endereço digitado é validado e o programa roda sem shell, então metacaracteres viram texto comum. Em um sistema real, vale reforçar outras camadas:

      - **Evitar o sistema operacional quando possível.** Muitas tarefas têm bibliotecas próprias. Um teste de conexão, por exemplo, pode usar `socket` do Python em vez de chamar um programa externo.
      - **Menor privilégio.** O processo da aplicação não deve ter acesso a arquivos como credenciais do SCADA. Aqui ele roda sem privilégios e em contêiner isolado, o que limitou o estrago.
      - **Segredos fora de arquivos legíveis.** Credenciais de sistemas industriais devem ficar em um cofre de segredos, com acesso registrado.
      - **Segmentação de rede (IT/OT).** Um portal web não deveria alcançar diretamente o supervisório. Modelos como a ISA/IEC 62443 organizam a rede da planta em zonas e conduítes.
      - **Monitorar o log.** O log desta aplicação registrava cada comando executado; alertas sobre caracteres como `;` e `|` ajudam a detectar a exploração cedo.
    references:
      - title: "OWASP Cheat Sheet: OS Command Injection Defense"
        url: https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
      - title: "OWASP Top 10: A03 Injection"
        url: https://owasp.org/Top10/A03_2021-Injection/
      - title: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
        url: https://cwe.mitre.org/data/definitions/78.html
      - title: "CISA: segurança de sistemas de controle industrial (ICS)"
        url: https://www.cisa.gov/topics/industrial-control-systems

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender o que é uma falha de lógica de negócio e por que ela passa pelos testes funcionais
    - Explorar a falha pedindo um resgate acima do saldo e um valor negativo
    - Reconhecer que a regra de negócio precisa ser conferida no servidor, não confiada ao cliente
    - Corrigir aplicando as regras (valor positivo e dentro do saldo) na camada de serviço
  story:
    role: Pessoa desenvolvedora do time de produtos digitais da operadora Sereno Saúde
    application: Portal do Beneficiário, onde o beneficiário solicita o reembolso a partir do saldo de reembolso já aprovado
    context: >-
      O beneficiário solicita o reembolso de consultas a partir de um saldo de reembolso já aprovado. Numa auditoria, a equipe apontou que o pedido confia no valor enviado no formulário sem conferir as regras de negócio — dá para solicitar um valor acima do saldo aprovado ou até um valor negativo.
    mission: Confirmar que o reembolso aceita valores que deveria recusar e corrigir aplicando as regras de negócio
  wrapUp:
    text: |
      Agora o resgate só acontece quando o valor respeita as regras de negócio: positivo e dentro do saldo disponível. Em um sistema real, vale reforçar:

      - **Falha de lógica de negócio não é um bug de código — é uma regra esquecida.** O código "funciona": ele resgata. O que faltava era a regra que diz *quando* resgatar é válido. Esse tipo de falha passa batido nos testes funcionais (que checam o caminho feliz) e só aparece quando alguém envia um valor que ninguém imaginou — negativo, zero, maior que o saldo.
      - **Valide no servidor, sempre.** O formulário pode ter um `min="0"` e um máximo, mas isso é só conforto para o usuário honesto: quem ataca manda o pedido direto, sem o formulário. A regra que vale é a que roda no servidor, na camada de serviço, antes de efetivar a operação.
      - **Pense nos limites.** Para cada valor que o usuário controla, pergunte: pode ser negativo? zero? muito grande? fracionado? Em dinheiro, cuidado também com arredondamento e com contas que podem ficar negativas.
      - **Registre e monitore.** Operações que violam uma regra de negócio (resgate acima do saldo, muitos resgates seguidos) são ótimos sinais de fraude. Registrar a tentativa recusada ajuda a detectar o abuso cedo.

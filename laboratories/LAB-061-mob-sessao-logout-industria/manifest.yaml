steps:
  - id: conhecer
    order: 1
    title: "Conhecer o app e achar o logout"
    explanation: |
      Você está no time de apps da Aurora Energia. Um técnico de campo usou o app de campo da Aurora Energia num celular emprestado, tocou em Sair e devolveu o aparelho. Dias depois, alguém acessou a conta dele com o token copiado daquele celular. O time de segurança quer saber por que o token ainda valia.

      **Um laboratório mobile.** Na aba **Aplicação**, o app aparece numa moldura de celular. Ele é um app **simulado** (não há emulador), mas fala com a API do servidor do mesmo jeito que um app Android ou iOS. Toda falha de app mobile termina numa decisão de segurança: quem a toma, o aparelho ou o servidor?

      ```ilustracao
      mob-sessao-logout
      ```

      Siga o logout pelas camadas:

      1. **App** (`static/app.js`): o botão **Sair** chama `POST /api/sair` e esquece o token.
      2. **Controller** (`controllers/api_controller.py`): recebe `POST /api/sair` e chama o serviço de sessão.
      3. **Serviço** (`services/sessao_service.py`): encerra a sessão. **É aqui que está a falha.**

      As credenciais de teste deste laboratório são:

      - Usuário `diego.campos`, senha `Diego#Aurora26` (Diego Campos Ferraz).
    task: |
      1. Na aba **Aplicação**, entre no app do celular com `diego.campos` e a senha `Diego#Aurora26`. Depois toque em **Sair**.
      2. Na aba **Código**, abra `services/sessao_service.py`.

      Informe abaixo o nome do método que encerra a sessão.
    concept: "Logout: quem encerra a sessão de verdade?"
    validatorRef: mob-sessao-logout/answer/metodo-ind-v1
    hints:
      - level: 1
        text: "A classe `SessaoService` tem um método público além de `__init__`."
      - level: 2
        text: "É o método chamado em `POST /api/sair`."
      - level: 3
        text: "O valor é `sair`."
    points: 10
  - id: explorar
    order: 2
    title: "Reusar o token depois de sair"
    explanation: |
      Faça o papel de quem copiou o token antes do logout: entre, guarde o token, saia e tente usar o mesmo token.
    task: |
      No **Terminal**, entre pela API e guarde o token:

      ```bash
      TOKEN=$(curl -s -X POST http://127.0.0.1:8080/api/login \
        -H "Content-Type: application/json" \
        -d '{"login":"diego.campos","senha":"Diego#Aurora26"}' \
        | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
      echo "$TOKEN"
      ```

      Saia (como o app faz) e depois use o token antigo:

      ```bash
      curl -s -X POST http://127.0.0.1:8080/api/sair -H "Authorization: Bearer $TOKEN" -o /dev/null -w "%{http_code}\n"
      curl -s http://127.0.0.1:8080/api/conta -H "Authorization: Bearer $TOKEN"
      ```

      Depois do logout, o token antigo ainda abriu a conta? Responda **sim** ou **não**.
    explore: |
      **De onde vêm cópias do token.** Um proxy de depuração, um backup do aparelho, um log que imprime cabeçalhos, um app malicioso com acessibilidade ou o próprio celular emprestado. Por isso o logout precisa valer para **todas** as cópias, não só para a que o app guardou.
    concept: "O token continua valendo depois de sair"
    validatorRef: mob-sessao-logout/answer/comportamento-ind-v1
    hints:
      - level: 1
        text: "Veja se a última resposta traz o seu nome."
      - level: 2
        text: "O logout respondeu 204, mas o token seguiu ativo."
      - level: 3
        text: "A resposta é `sim`."
    points: 15
  - id: medida
    order: 3
    title: "Nomear o que o servidor faz no logout"
    explanation: |
      O token é um valor guardado no servidor, com a marca de ativo. Para que nenhuma cópia funcione mais, o servidor precisa desativá-lo.
    task: |
      Complete: no logout, o servidor precisa ___ o token.

      Responda com um verbo.
    concept: "No logout, o servidor revoga o token"
    validatorRef: mob-sessao-logout/answer/defesa-ind-v1
    hints:
      - level: 1
        text: "Veja os métodos de `repositories/token_repository.py`."
      - level: 2
        text: "Um deles marca o token como inativo."
      - level: 3
        text: "A resposta é `revogar`."
    points: 15
  - id: onde
    order: 4
    title: "Decidir se apagar no aparelho basta"
    explanation: |
      Apagar o token do aparelho evita que **aquele** app continue logado. Mas o token não vive só no aparelho.
    task: |
      Apagar o token só no aparelho encerra a sessão?

      Responda **sim** ou **não**.
    concept: "Apagar no aparelho não encerra a sessão"
    validatorRef: mob-sessao-logout/answer/onde-ind-v1
    hints:
      - level: 1
        text: "Você usou o token depois de o app esquecê-lo."
      - level: 2
        text: "O servidor ainda o aceitava."
      - level: 3
        text: "A resposta é `não`."
    points: 15
  - id: corrigir
    order: 5
    title: "Revogar o token no logout"
    explanation: |
      **Por que a falha existe.** `sair` só devolve `None`: nada muda no servidor.

      **A correção.** Chamar `self._tokens.revogar(token)`, que marca o token como inativo. Depois disso, `conta_do_token` não o reconhece mais e a API responde `401`.
    task: |
      Abra `services/sessao_service.py` e troque as duas linhas do corpo de `sair` (a partir do comentário) por estas:

      ```python
              # Revoga o token no servidor: depois do logout ele não abre mais nada.
              self._tokens.revogar(token)
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. na aba **Aplicação**, entre e saia de novo: o app continua funcionando;
      2. no **Terminal**, refaça o login, o logout e o uso do token antigo, e veja `nao autorizado`;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação e o app no celular para de responder. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o corpo do método fica com 8 espaços e o que está dentro de um `if`, com 12. Copie o bloco da tarefa sem mudar o recuo.
    concept: "Correção: o logout revoga o token no servidor"
    validatorRef: mob-sessao-logout/python-flask/logout-revoga-ind-v1
    hints:
      - level: 1
        text: "A mudança é só em `services/sessao_service.py`, no método `sair`."
      - level: 2
        text: "Use `self._tokens.revogar(token)`."
      - level: 3
        text: "Copie o bloco da tarefa sem mudar o recuo: 8 espaços."
    points: 45
policy:

learning:
  singleVulnerability: true
  estimatedMinutes: 30
  difficulty: beginner
  objectives:
    - Entender que sair do app precisa encerrar a sessão no servidor, não só na tela
    - Explorar a falha reusando o token depois do logout
    - Reconhecer que o servidor precisa revogar o token no logout
    - Corrigir o serviço de sessão revogando o token
  story:
    role: >-
      Pessoa desenvolvedora do time de apps da Aurora Energia
    application: >-
      App Aurora Campo, o app em que o técnico de campo consulta as ordens de serviço
    context: >-
      Ao tocar em Sair, o app de campo da Aurora Energia esquece o token, mas o servidor continua aceitando o mesmo token.
    mission: >-
      Reusar o token depois do logout e corrigir a API para revogar a sessão no servidor
  wrapUp:
    text: |
      Agora o logout revoga o token no servidor, e um token antigo não abre mais a conta. Em um app real, vale reforçar:

      - **Logout é do servidor.** Apagar o token do aparelho protege só aquele aparelho. Uma cópia do token (proxy, backup, log, malware) continua valendo até o servidor revogar.
      - **Tokens curtos e renováveis.** Token de acesso com poucos minutos de vida e token de renovação que o servidor controla limitam o estrago de um token vazado.
      - **Revogar tudo quando preciso.** Troca de senha, "sair de todos os aparelhos" e suspeita de fraude devem invalidar todas as sessões da conta.
      - **JWT também precisa de revogação.** Token autocontido não é revogável sozinho: use validade curta, lista de revogação ou versão de sessão na conta.
    references:

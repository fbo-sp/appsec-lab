      manobra. Na madrugada de domingo, o técnico de plantão recebeu um e-mail de um endereço externo, se passando pelo centro de operação, e tocou no link. A manobra "Religar alimentador energizado" no
      disjuntor 12 da SE Aurora Sul foi liberada sem nenhuma tela de confirmação. O supervisor só a barrou porque estranhou o horário.

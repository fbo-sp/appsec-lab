    historia_abertura: Você está no time de apps da Clínica Lumen. Para agilizar o encaminhamento, os médicos mandam ao paciente um link `lumen://compartilhar?...` que abre o app e compartilha o laudo com
      o especialista. Esta semana, a ouvidoria recebeu reclamações de pacientes que encontraram todos os laudos compartilhados com uma tal "Clinica Parceira Bem Estar", que nunca autorizaram. Todos tinham
      tocado num SMS dizendo que o laudo estava pronto.

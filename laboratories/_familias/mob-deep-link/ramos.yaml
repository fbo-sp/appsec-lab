    missao: Mostrar que um link aberto no celular executa a operação sem o usuário confirmar e corrigir o servidor para exigir a confirmação de uso único também nesse caminho
    titulo: o link do WhatsApp que fez o Pix sozinho
    papel: Pessoa desenvolvedora do time de apps do banco digital Pagomais
    aplicacao: App Pagomais, o app em que o cliente consulta o extrato e faz Pix
    contexto: 'O marketing da Pagomais lançou a campanha "Pix em um toque": um link pagomais://pix abre o app com o Pix já preenchido. Clientes começaram a reclamar de Pix que não fizeram, todos depois
      de tocar num link recebido pelo WhatsApp.'
    historia_abertura: 'Você está no time de apps do banco digital Pagomais. Há um mês, o marketing lançou a campanha "Pix em um toque": um link `pagomais://pix?...`, enviado por e-mail e redes sociais,
      abre o app com o Pix já preenchido. Esta semana, a central recebeu 37 reclamações de Pix de R$ 1.950,00 para "Premios Cashback Ltda", que os clientes juram não ter feito. Todos tinham tocado num link
      recebido pelo WhatsApp prometendo cashback.'
    operacao_nome: Pix
    esquema: pagomais
    rota_link: pix
    acao_alvo: Vale Insumos Ltda
    acao_detalhe: R$ 500,00
    link_campanha: pagomais://pix?alvo=Premios+Cashback+Ltda&detalhe=R$+1.950,00
    link_alvo: Premios Cashback Ltda
    link_detalhe: R$ 1.950,00
    notif_app: WhatsApp
    notif_remetente: +55 11 94821-7730
    notif_texto: 'Pagomais: você ganhou R$ 150 de cashback! Toque no link para resgatar no app.'
    impacto: Qualquer pessoa que consiga fazer um link chegar ao celular do cliente (WhatsApp, SMS, e-mail, um QR Code numa vitrine) faz um Pix da conta dele, no valor e para a chave que quiser, com um
      único toque.

    aplicacao: App Aurora Campo, o app em que o técnico de campo consulta as ordens de serviço e libera manobras
    contexto: Para acelerar o atendimento de emergência, o centro de operação da Aurora Energia manda links auroracampo://manobra que abrem o app na liberação da manobra. Um técnico recebeu um e-mail externo
      com um link desses e, ao tocar, a manobra foi liberada sem nenhuma tela de confirmação.

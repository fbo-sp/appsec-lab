<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[[app_nome]]</title>
  <link rel="stylesheet" href="/static/estilo.css">
  <style>:root { --marca: [[cor]]; }</style>
</head>
<body>
  <!-- App mobile SIMULADO (ADR-025): aparece dentro da moldura de celular da aba Aplicação. -->
  <div class="status" aria-hidden="true"><span>9:41</span><span>5G ▮▮▮ 100%</span></div>
  <main id="app" class="app"></main>
  <script>
    window.LAB = {
      marca: "[[marca]]",
      lista: "[[lista_titulo]]",
      acao: "[[acao_titulo]]",
      operacao: "[[operacao_nome]]",
      acaoAlvo: "[[acao_alvo]]",
      acaoDetalhe: "[[acao_detalhe]]",
      link: "[[link_campanha]]",
      notificacao: { app: "[[notif_app]]", remetente: "[[notif_remetente]]", texto: "[[notif_texto]]" },
      recursos: {{ recursos|tojson }}
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>

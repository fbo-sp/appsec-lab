# Família L7 api-recursos (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py api-recursos
# Logins, senhas, rota, prefixo e total estão espelhados em
# apps/backend/app/validation/suites_familias.py (RECURSOS_RAMOS); os testes Docker conferem os dois.
# A falha é de consumo irrestrito de recursos (OWASP API4): o serviço de listagem usa o limite de página
# que o cliente mandar, sem teto (e LIMIT -1 do SQLite abre tudo).
ramos:
  - destino: LAB-074-api-recursos-banco
    vars:
      lab_id: LAB-074
      versao: 1.0.0
      codigo: L7-FIN
      ramo: fin
      setor: financeiro
      imagem: lab-074-api-recursos
      titulo: o extrato que derrubou a API no fechamento do mês
      empresa: Corretora Pináculo
      marca: "▲ Pináculo"
      app_nome: Pináculo Invest
      cor: "#0f172a"
      papel: Pessoa desenvolvedora do time de plataforma da Corretora Pináculo
      aplicacao: Pináculo Invest, onde o investidor acompanha o extrato de movimentações pelo navegador e pelo app
      contexto: No último dia útil do mês, a API de extrato da Pináculo Invest ficou fora do ar por 40 minutos. O time de infraestrutura achou no log chamadas de um robô de agregação com limite=1000000, repetidas a cada poucos segundos, que faziam o banco ler o histórico inteiro de cada conta.
      missao: Reproduzir a listagem sem teto de forma contida, entender onde falta o limite e aplicá-lo no servidor
      painel_titulo: Extrato
      painel_desc: Movimentações da sua conta de investimentos.
      login_desc: Entre com seu usuário e senha da Pináculo Invest.
      banco: pinaculo_invest
      recurso: lancamentos
      recurso_plural: lançamentos
      recurso_singular: lançamento
      recurso_singular_arquivo: lancamento
      classe: Lancamento
      prefixo: LCT-
      total: 3000
      app_movel: Pináculo
      login_a: eduardo.saraiva
      senha_a: "Eduardo#Pinaculo26"
      nome_a: Eduardo Saraiva Monteiro
      custo_extra: 'Recursos não são só CPU e memória: na mesma API, o envio do código de confirmação por SMS não tinha limite por conta, e cada SMS custa à corretora. Um robô que dispara milhares de códigos gera prejuízo direto, sem derrubar nada.'
      historia_abertura: 'Você é do time de plataforma da Corretora Pináculo. No último dia útil do mês, a API de extrato ficou fora do ar por 40 minutos, bem na hora em que os clientes conferiam o fechamento. No log, a infraestrutura achou um robô de agregação chamando /api/lancamentos com limite=1000000 a cada poucos segundos. O chamado chegou ao seu time: por que a API aceitou?'
      seed_contas:
        - [1, eduardo.saraiva, Eduardo Saraiva Monteiro, "Eduardo#Pinaculo26", cliente]
      modelos:
        - ["Compra de ações PNXA4", -1520.4]
        - ["Dividendos PNXA4", 86.75]
        - ["Aplicação CDB Pináculo 110% CDI", -5000.0]
        - ["Resgate Tesouro Selic", 2310.18]
        - ["Taxa de custódia", -12.9]

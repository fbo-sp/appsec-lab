      papel: Pessoa desenvolvedora do time de APIs do Banco Cobalto
      aplicacao: Cobalto Online, onde o cliente consulta os comprovantes de Pix pelo navegador e pelo app
      contexto: A API de comprovantes de Pix ganhou uma v2 depois que um teste de invasão achou IDOR na v1. O app novo já usa a v2, que confere o dono do comprovante. Um analista de fraude notou acessos a /api/v1/comprovantes vindos de fora do app oficial, e ninguém sabe dizer se a v1 ainda está no ar.
      missao: Descobrir a versão antiga que continua respondendo, mostrar que ela entrega comprovantes de outros clientes e aposentá-la no servidor
      painel_titulo: Meus comprovantes
      painel_desc: Comprovantes de Pix enviados e recebidos na sua conta.

      recurso_singular: comprovante
      ano_v1: "2022"
      ano_v2: "2025"
      app_movel: Cobalto 3.x
      time_api: Plataforma de APIs
      login_a: larissa.prado
      senha_a: "Larissa#Cobalto26"
      nome_a: Larissa Prado Nunes
      nome_b: Rogério Tavares Lima
      doc_a: "101"
      doc_b: "201"
      impacto: 'Um comprovante de Pix traz nome, CPF parcial, banco, valor e chave do destinatário. Em mãos erradas, vira matéria-prima para golpe do "comprovante falso" e engenharia social, e é dado pessoal protegido pela LGPD.'
      historia_abertura: 'Você é do time de APIs do Banco Cobalto. Em 2025, depois de um teste de invasão achar IDOR na API de comprovantes, o time lançou a v2, que confere o dono, e tirou a v1 da documentação. Esta semana, um analista de fraude abriu um chamado: há acessos a /api/v1/comprovantes vindos de fora do app oficial. Ninguém sabe dizer se a v1 ainda está no ar.'

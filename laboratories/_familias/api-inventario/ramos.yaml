# Família L5 api-inventario (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py api-inventario
# Logins, senhas, rotas e o titular do documento alheio estão espelhados em
# apps/backend/app/validation/suites_familias.py (INVENTARIO_RAMOS); os testes Docker conferem os dois.
# A falha é de inventário (OWASP API9): controllers/api_v1_controller.py, a versão legada, saiu da
# documentação mas continua registrada e devolve documentos de qualquer conta.
ramos:
  - destino: LAB-068-api-inventario-banco
    vars:
      lab_id: LAB-068
      versao: 1.0.0
      codigo: L5-FIN

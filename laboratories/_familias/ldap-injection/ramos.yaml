# Família A18 ldap-injection (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py ldap-injection
# Logins/senhas e o diretório fictício estão espelhados em
# apps/backend/app/validation/suites_familias.py (registro protegido); os testes Docker conferem os
# dois lados. A falha é injeção de LDAP: services/busca_service.py junta o nome CRU no filtro
# (cn=NOME), então um * digitado vira curinga e lista o diretório inteiro.
ramos:

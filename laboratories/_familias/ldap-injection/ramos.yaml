      titulo: a busca que lista o diretório inteiro
      empresa: Pagomais
      marca: "₽ Pagomais"
      app_nome: Diretório Corporativo
      cor: "#1d4ed8"
      papel: Pessoa desenvolvedora do time de plataforma interna da fintech Pagomais
      aplicacao: Diretório Corporativo, onde o funcionário busca colegas pelo nome e vê nome e setor
      contexto: O funcionário entra no Diretório Corporativo e busca colegas pelo nome. Um teste de invasão alertou que, digitando apenas um asterisco na busca, a tela lista o diretório inteiro — injeção de LDAP.
      missao: Confirmar que a busca por um curinga lista todo o diretório e corrigir escapando os caracteres especiais do filtro
      painel_titulo: Diretório Corporativo
      painel_desc: Busque um colega pelo nome para ver o setor dele.
      login_desc: Entre com as credenciais do funcionário para acessar o diretório.

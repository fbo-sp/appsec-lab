# Família L2 log-auditoria (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py log-auditoria
# Logins, senhas e o nome do banco estão espelhados em apps/backend/app/validation/suites_familias.py
# (AUDITORIA_RAMOS); os testes Docker conferem os dois.
# A falha é de registro (OWASP A09, CWE-778): services/auth_service.py só registra o login certo;
# as tentativas erradas não deixam rastro na tabela auditoria.
ramos:
  - destino: LAB-077-log-auditoria-banco
    vars:
      lab_id: LAB-077
      versao: 1.0.0
      codigo: L2-FIN
      ramo: fin
      setor: financeiro
      imagem: lab-077-log-auditoria
      titulo: as senhas erradas que ninguém viu
      empresa: Seguradora Maré Alta
      marca: "≈ Maré Alta"
      app_nome: Portal do Corretor Maré Alta
      cor: "#155e75"
      papel: Pessoa desenvolvedora do time de canais digitais da Seguradora Maré Alta
      aplicacao: Portal do Corretor Maré Alta, onde os corretores emitem cotações, propostas e endossos de seguro auto e residencial
      contexto: Um corretor ligou dizendo que alguém emitiu um endosso na carteira dele de madrugada. O time de prevenção a fraudes pediu a trilha de tentativas de acesso à conta dele nos últimos dias, e a trilha só mostra logins que deram certo.
      missao: Mostrar que as tentativas erradas de login não deixam rastro e corrigir o serviço de autenticação para registrar sucesso e falha, sem nunca gravar a senha
      painel_titulo: Painel do corretor
      painel_desc: Dados da sua conta e a atividade de segurança registrada para ela.
      login_desc: Entre com seu usuário de corretor e senha.
      banco: portal_corretor
      papel_usuario: Corretora
      login_a: patricia.moura
      senha_a: "Patricia#MareAlta26"
      nome_a: Patrícia Moura Lins
      impacto: 'Sem esses registros, o time de prevenção a fraudes não consegue dizer se a conta do corretor foi atacada por adivinhação de senha, de onde vieram as tentativas, nem desde quando. Um endosso fraudulento pode desviar indenizações e a investigação começa no escuro.'
      historia_abertura: 'Você é do time de canais digitais da Seguradora Maré Alta. Na segunda-feira, o corretor Edson Paiva ligou para a central: alguém entrou na conta dele de madrugada e emitiu um endosso trocando o beneficiário de uma apólice. O time de prevenção a fraudes pediu a lista de tentativas de acesso à conta nos últimos sete dias, para saber se a senha foi adivinhada. A resposta da TI foi constrangedora: a trilha só mostra os logins que deram certo.'
      seed_contas:
        - [1, patricia.moura, Patrícia Moura Lins, "Patricia#MareAlta26", corretora]
        - [2, edson.paiva, Edson Paiva Rocha, "Edson#MareAlta26", corretor]

      aplicacao: Sanare Prestador, onde médicos e clínicas credenciados pedem autorização de exames e consultam a elegibilidade dos beneficiários
      contexto: O time de privacidade recebeu um alerta de que credenciais de prestadores estão sendo vendidas em um fórum. Pediu a lista de contas com muitas tentativas de login erradas para bloqueá-las antes que alguém consulte dados de beneficiários, e a trilha só mostra logins que deram certo.
      missao: Mostrar que as tentativas erradas de login não deixam rastro e corrigir o serviço de autenticação para registrar sucesso e falha, sem nunca gravar a senha
      painel_titulo: Painel do prestador
      painel_desc: Dados da sua conta e a atividade de segurança registrada para ela.
      login_desc: Entre com seu usuário de prestador e senha.
      banco: sanare_prestador
      papel_usuario: Médica credenciada
      login_a: dra.helena.castro
      senha_a: "Helena#Sanare26"
      nome_a: Dra. Helena Castro Pires
      impacto: 'Sem esses registros, a área de privacidade não consegue saber quais contas de prestadores estão sob ataque nem de onde vêm as tentativas. Uma conta invadida dá acesso a dados de saúde de beneficiários, dado pessoal sensível pela LGPD, e o incidente pode precisar ser comunicado à ANPD sem que se saiba o alcance.'
      historia_abertura: 'Você é do time de sistemas de rede credenciada da Operadora Sanare. Na terça-feira, a área de privacidade recebeu um aviso do time de inteligência de ameaças: um fórum anuncia "acessos de prestadores de planos de saúde". O encarregado de dados pediu, com urgência, a lista de contas do Sanare Prestador com muitas tentativas de login erradas nas últimas 48 horas, para bloqueá-las. A resposta da TI: a trilha só mostra os logins que deram certo.'
      seed_contas:
        - [1, dra.helena.castro, Dra. Helena Castro Pires, "Helena#Sanare26", medica]
        - [2, clinica.bemviver, Clínica Bem Viver, "BemViver#Sanare26", clinica]

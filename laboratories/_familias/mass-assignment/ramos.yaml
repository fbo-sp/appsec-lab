# Família A5 Mass Assignment (ADR-021): o que muda por ramo de atividade. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py mass-assignment
# Logins, valores de campos e respostas estão espelhados em apps/backend/app/validation/suites_familias.py
# (registro protegido); os testes Docker conferem os dois.
ramos:
  - destino: LAB-008-massa-fintech
    vars:
      historia_beneficio: "Na Trilha Pay, o pacote Private libera PIX de até R$ 250 mil por dia. Para um golpista que controla a conta de uma vítima, ou para uma conta laranja, é a diferença entre um prejuízo pequeno e um grande."
      historia_perfil: "Na Trilha Pay, o analista de crédito aprova aumentos de limite. Um cliente com esse perfil aprovaria o próprio limite e veria o cadastro de todos os clientes."
      lab_id: LAB-008
      versao: 1.0.0
      codigo: A5-FIN
      ramo: fin
      setor: financeiro
      imagem: lab-008-massa
      titulo: o perfil que vira analista de crédito
      empresa: Trilha Pay
      marca: "◆ Trilha Pay"
      app_nome: App Trilha Pay
      cor: "#3b2a8f"
      papel: Desenvolvedor(a) do squad de conta digital da Trilha Pay
      aplicacao: App Trilha Pay, tela "Meu perfil" e a API /api/perfil
      contexto: O app de celular e o site da Trilha Pay usam a mesma API de perfil. Um cliente comentou no suporte que o pacote da conta "mudou sozinho" para Private, e o time de fraude quer saber se isso é possível antes de abrir um incidente.
      missao: Descobrir quais campos a API aceita, demonstrar o impacto e corrigir o serviço
      banco: trilhapay
      cliente_login: bruno.sales
      cliente_senha: Bruno@2026
      cliente_desc: Cliente Bruno Sales Teixeira
      cliente_papel: cliente
      perfil_comum: cliente
      perfil_priv: analista
      perfil_priv_desc: analista de crédito, que aprova aumentos de limite
      rota_priv: backoffice
      area_priv_titulo: Backoffice de crédito
      area_priv_desc: Tela interna em que os analistas aprovam aumentos de limite e veem os dados cadastrais de todos os clientes.
      chave_priv_nome: codigo_aprovacao_turno
      chave_priv_label: Código de aprovação de limite do turno
      chave_priv: TRP-LIM-6630-PZ
      campo: pacote
      campo_label: Pacote da conta
      campo_label_minusculo: pacote da conta
      campo_desc: pacote contratado, que define limites e tarifas
      valor_original: essencial
      valor_ataque: private
      beneficio_original: limite de PIX de R$ 2.000,00 por dia
      beneficio_ataque: limite de PIX de R$ 250.000,00 por dia, sem tarifas
      resposta_beneficio_pergunta: o novo limite diário de PIX, só com números (por exemplo, 5000)
      resposta_beneficio: "250000"
      seed_usuarios:

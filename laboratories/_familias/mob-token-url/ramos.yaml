# Família L9 mob-token-url (ADR-021, ADR-025): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py mob-token-url
# Usa o app mobile comum (mesmas marcas, logins e dados de mob-modo-teste). Logins e o nome estão espelhados
# em apps/backend/app/validation/suites_familias.py (TOKENURL_RAMOS); os testes Docker conferem.
# A falha (CWE-598, Mobile 2016 M3): o app manda o token de sessão na URL (cliente/config.json) e
# services/identidade_service.py aceita; o token fica gravado em logs. Versão simulada: sem TLS real (MOB-13).

    missao: Mostrar que o token de sessão na URL fica gravado em logs e pode ser reaproveitado, e corrigir o servidor e o app para que o token só viaje no cabeçalho Authorization
    titulo: o token de sessão que apareceu no log do proxy
    papel: Pessoa desenvolvedora do time de apps do banco digital Pagomais
    aplicacao: App Pagomais, o app em que o cliente consulta o extrato
    contexto: O time de segurança de uma empresa cliente avisou a Pagomais que o log do proxy corporativo deles mostrava URLs da API do app com o token de sessão inteiro, de dezenas de funcionários que
      usam o app no Wi-Fi da empresa.
    historia_abertura: 'Você está no time de apps do banco digital Pagomais. Na segunda-feira, o time de segurança de uma grande empresa cliente mandou um e-mail preocupado: revisando o log do proxy corporativo,
      eles encontraram centenas de URLs da API da Pagomais com `?token=...` no fim, de funcionários que usam o app no Wi-Fi da empresa. Qualquer pessoa com acesso a esse log, dentro da empresa ou no fornecedor
      do proxy, tinha o token de sessão desses clientes.'
    dominio_api: pagomais.exemplo
    impacto: Quem lê o log (o time de TI de uma empresa, o fornecedor do proxy, uma ferramenta de monitoramento, um backup esquecido) cola o token num pedido e vê o extrato, o saldo e os dados do cliente,
      sem senha nenhuma.

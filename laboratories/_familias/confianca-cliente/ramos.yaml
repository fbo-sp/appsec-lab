# Família A10 confianca-cliente (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py confianca-cliente
# Logins e senhas estão espelhados em apps/backend/app/validation/suites_familias.py (registro
# protegido); os testes Docker conferem os dois. Seed fixo em todos os ramos: saldo 500 pontos,
# produto 1 custa 300, produto 2 custa 150. A falha é de confiança no cliente: services/loja_service.py
# debita o custo que veio do formulário, em vez do custo real do produto (no banco).
ramos:
  - destino: LAB-035-confianca-cooperativa
    vars:
      lab_id: LAB-035
      versao: 1.0.0
      codigo: A10-FIN
      ramo: fin
      setor: financeiro
      imagem: lab-035-confianca
      titulo: a loja que confia no preço do cliente
      empresa: Cooperativa Credimova
      marca: "◆ Credimova"
      app_nome: Clube de Pontos
      cor: "#1d4ed8"
      papel: Pessoa desenvolvedora da squad de engajamento da Cooperativa Credimova
      aplicacao: Clube de Pontos, onde o cooperado resgata produtos gastando pontos do programa de fidelidade
      contexto: O cooperado resgata produtos no Clube de Pontos gastando pontos. Um teste de invasão alertou que o resgate confia no custo que vem do formulário — dá para resgatar um produto caro informando um custo de 1 ponto.
      missao: Confirmar que a loja aceita um custo adulterado e corrigir usando o custo real do produto
      painel_titulo: Clube de Pontos
      painel_desc: Resgate produtos com os seus pontos.
      login_desc: Entre com as credenciais do cooperado para acessar o Clube de Pontos.
      banco: credimova_pontos
      login_a: marina.gomes
      senha_a: "Marina#Cred26"
      nome_a: Marina Aguiar Gomes
      historia_abertura: 'Você está na squad de engajamento da Cooperativa Credimova. O cooperado resgata produtos no Clube de Pontos gastando pontos. O time de segurança abriu um chamado: o resgate confia no custo que chega do formulário, e um teste de invasão mostrou que dá para resgatar um produto de 300 pontos informando um custo de 1 ponto.'
      seed_contas:
        - [1, marina.gomes, Marina Aguiar Gomes, "Marina#Cred26", 500.0]
        - [2, rodrigo.sena, Rodrigo Sena Vilela, "Rodrigo#Cred26", 500.0]

      contexto: O Portal do Investidor carrega o perfil do cliente por uma API. Um teste de invasão alertou que a API de perfil reflete qualquer origem no CORS — um site malicioso que o cliente visite consegue ler, pelo navegador dele, os dados da conta logada.

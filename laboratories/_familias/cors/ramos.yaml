# Família A7 cors (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py cors
# Logins e senhas estão espelhados em apps/backend/app/validation/suites_familias.py (registro
# protegido); os testes Docker conferem os dois. A falha é de CORS: services/cors_service.py reflete
# qualquer origem recebida (com Allow-Credentials), em vez de liberar só origens confiáveis.

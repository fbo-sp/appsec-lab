# Família A6 ssrf (ADR-021): o que muda por ramo de atividade. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py ssrf
# Logins da equipe, destino legítimo e a credencial vazada estão espelhados em
# apps/backend/app/validation/suites_familias.py (registro protegido); os testes Docker conferem os dois.
# A falha é SSRF no importador por URL (services/importador_service.py): o servidor busca qualquer URL
# informada, então dá para apontar para o console interno (127.0.0.1:9000) e ler credenciais.
ramos:
  - destino: LAB-020-ssrf-cooperativa
    vars:
      lab_id: LAB-020
      versao: 1.0.0
      codigo: A6-FIN
      ramo: fin
      setor: financeiro
      imagem: lab-020-ssrf
      titulo: o importador de comprovantes que busca qualquer URL
      empresa: Cooperativa Credimova
      marca: "◆ Credimova"
      app_nome: Mesa de Crédito
      cor: "#1d4ed8"
      papel: Pessoa desenvolvedora da squad de crédito da Cooperativa Credimova
      aplicacao: Mesa de Crédito, onde a equipe importa o comprovante de renda enviado pelo parceiro para analisar a proposta
      contexto: A Mesa de Crédito importa o comprovante de renda a partir de uma URL que o sistema parceiro informa; o servidor busca essa URL e mostra a prévia. Um teste de invasão alertou que o campo de URL não valida o destino, e que dá para fazer o servidor buscar endereços internos.
      missao: Confirmar que o importador pode ser levado a buscar um serviço interno e corrigir restringindo o destino
      mesa_titulo: Mesa de Crédito
      mesa_desc: Importe o comprovante de renda informado pelo parceiro para analisar a proposta.
      login_desc: Entre com as credenciais da equipe de crédito para acessar a Mesa.
      login_staff: analista.credito
      senha_staff: "Analista#Cred26"
      nome_staff: Marina Aguiar Gomes
      papel_staff: Analista de crédito
      login_staff2: supervisor.mesa
      senha_staff2: "Supervisor#Cred26"
      nome_staff2: Rodrigo Sena Vilela
      papel_staff2: Supervisor da mesa
      doc_conteudo: |
        COMPROVANTE DE RENDA (documento fictício — parceiro Credimova)
        Proponente: Marina Aguiar Gomes
        Renda bruta mensal: R$ 7.420,00
        Vínculo: CLT
        Documento conferido pelo parceiro em 2026-11-10.
      doc_trecho: Renda bruta mensal
      meta_servico: provedor-de-pagamentos
      meta_chave: CHAVE-FICTICIA-CREDIMOVA-NAO-USAR
      historia_abertura: 'Você está na squad de crédito da Cooperativa Credimova. A Mesa de Crédito importa o comprovante de renda a partir de uma URL que o sistema parceiro informa: o servidor abre essa URL e mostra a prévia para o analista. O time de segurança abriu um chamado: o campo de URL não confere o destino, e um teste de invasão mostrou que o servidor pode ser levado a buscar endereços internos da cooperativa.'

      receberam Pix de R$ 0,01 de desconhecidos e, na central, em vez de um texto, apareceu um botão com a cara do banco pedindo para "atualizar os dados". A central é uma página do servidor mostrada num
      WebView, e alguém conseguiu desenhar nela.

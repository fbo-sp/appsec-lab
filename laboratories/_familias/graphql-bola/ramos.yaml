# Família A17 graphql-bola (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py graphql-bola
# Logins/senhas e os pedidos fictícios estão espelhados em
# apps/backend/app/validation/suites_familias.py (registro protegido); os testes Docker conferem os
# dois lados. A falha é BOLA: services/pedido_service.py resolve o pedido só pelo id, sem conferir se
# o pedido pertence ao usuário logado. Descrições sem acento de propósito: a resposta JSON é ASCII.

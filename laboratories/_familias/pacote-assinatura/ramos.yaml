# Família L4 pacote-assinatura (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py pacote-assinatura
# Logins, senhas, a chave HMAC FICTÍCIA e o parâmetro alterado estão espelhados em
# apps/backend/app/validation/suites_familias.py (PACOTE_RAMOS); os testes Docker conferem os dois.
# A falha é de integridade (OWASP A08, CWE-345): services/pacote_service.py aplica o pacote sem conferir
# a assinatura HMAC. A assinatura de pacote_json foi calculada com chave_fornecedor sobre o conteúdo
# canônico (JSON sem a assinatura, chaves ordenadas, separadores compactos); ao mudar o pacote, recalcule.
ramos:
- destino: LAB-083-pacote-assinatura-banco
  vars:
    lab_id: LAB-083
    versao: 1.0.0
    codigo: L4-FIN
    ramo: fin
    setor: financeiro
    imagem: lab-083-pacote-assinatura
    titulo: a tabela de regras antifraude que ninguém conferiu
    empresa: Banco Solaris
    marca: ☀ Solaris
    app_nome: Solaris Antifraude
    cor: '#b45309'
    papel: Pessoa desenvolvedora do time de prevenção a fraudes do Banco Solaris
    aplicacao: Solaris Antifraude, o motor que decide quais Pix e compras passam direto, vão para análise ou são bloqueados
    contexto: As regras do motor antifraude chegam em pacotes do bureau parceiro, assinados com HMAC. Uma auditoria interna perguntou se o motor confere a assinatura antes de aplicar, e ninguém soube responder
      com certeza.
    missao: Mostrar que um pacote alterado depois de assinado é aplicado e corrigir a importação para conferir a assinatura do fornecedor antes de aplicar
    painel_titulo: Regras antifraude em vigor
    painel_desc: Limites e critérios que o motor aplica a cada transação.
    login_desc: Entre com seu usuário do time de prevenção a fraudes.
    banco: solaris_antifraude
    pacote_tipo: regras antifraude
    fornecedor: Bureau Atento Antifraude
    papel_usuario: Analista de prevenção a fraudes
    login_a: beatriz.nogueira
    senha_a: Beatriz#Solaris26
    nome_a: Beatriz Nogueira Sales
    pacote_arquivo: regras-antifraude-2026.11.1.json
    versao_inicial: 2026.10.3
    versao_pacote: 2026.11.1
    param: limite_pix_noturno
    param_desc: o limite de Pix noturno sem análise
    valor_ok: '1000'
    valor_mal: '50000'
    chave_fornecedor: lab-fin-chave-hmac-ficticia-bureau-2026
    impacto: 'Se um pacote adulterado é aceito, quem conseguir alterar o arquivo no caminho (no servidor de troca de arquivos, num e-mail, num repositório) muda as regras do banco: um limite de Pix noturno
      de R$ 50.000 sem análise é exatamente o que um golpista precisa.'
    historia_abertura: 'Você é do time de prevenção a fraudes do Banco Solaris. As regras do motor antifraude não são escritas aqui: chegam do Bureau Atento Antifraude, toda semana, num pacote JSON assinado
      com HMAC e deixado num servidor de troca de arquivos. Esta semana, a auditoria interna perguntou: "se alguém com acesso a esse servidor trocar um número no arquivo, o motor percebe?". Ninguém soube
      responder com certeza.'
    pacote_json: "{\n  \"fornecedor\": \"Bureau Atento Antifraude\",\n  \"versao\": \"2026.11.1\",\n  \"parametros\": {\n    \"limite_pix_noturno\": 1000,\n    \"score_minimo_aprovacao\": 720,\n    \"dias_dispositivo_novo\"\
      : 3\n  },\n  \"assinatura\": \"3a84d25a664101b8cb1ca92d3e5640cb752581febf1f2133122dab7453d03ea6\"\n}"
    seed_contas:
    - - 1
      - beatriz.nogueira
      - Beatriz Nogueira Sales
      - Beatriz#Solaris26
      - analista
    seed_parametros:
    - - limite_pix_noturno
      - Valor máximo de Pix entre 20h e 6h sem análise
      - 1000
      - R$
    - - score_minimo_aprovacao
      - Score mínimo para aprovar sem análise
      - 700
      - pontos
    - - dias_dispositivo_novo
      - Dias de quarentena de um dispositivo novo
      - 3
      - dias

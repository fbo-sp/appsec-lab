{% extends "base.html" %}
{% block conteudo %}
<h1>[[painel_titulo]]</h1>
<p class="ajuda">[[painel_desc]]</p>

<dl class="dados">
  <dt>Titular</dt><dd>{{ conta.nome }}</dd>
  <dt>[[saldo_label]]</dt><dd>R$ {{ "%.2f"|format(conta.saldo) }}</dd>
</dl>

<form method="post" action="{{ url_for('painel.resgatar') }}" class="cartao">
  <label>Valor do [[termo_acao]] (R$)
    <input name="valor" type="text" placeholder="100,00" required>
  </label>
  <button type="submit">[[acao_label]]</button>
  <p class="ajuda">[[acao_desc]]</p>
</form>

{% if resultado %}<p class="banner reforcado">{{ resultado }}</p>{% endif %}
{% if erro %}<p class="banner antigo">{{ erro }}</p>{% endif %}
{% endblock %}

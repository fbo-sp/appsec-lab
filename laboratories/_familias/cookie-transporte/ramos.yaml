      nome_a: Gustavo Lemos Farias
      rotulo_titular: Titular
      rotulo_valor: Valor
      itens_titulo: Compras recentes
      impacto: 'Num Wi-Fi aberto, quem está na mesma rede vê o tráfego HTTP em texto claro. Sem `Secure`, um único acesso por um link antigo com `http://` leva o cookie junto, e o atacante cola o cookie no próprio navegador: vê a fatura, o limite e os dados do cartão, sem precisar da senha.'
      historia_abertura: 'Você é do time de canais digitais da Nébula Cartões. Na sexta-feira, num teste de rotina no Wi-Fi de um coworking, um analista de segurança capturou o cookie de sessão de um colega que abriu o portal por um link antigo de e-mail, ainda com `http://`. Colou o cookie no próprio navegador e entrou na conta do colega, com fatura e limite à mostra. O portal tem HTTPS no balanceador, mas o cookie de sessão sai sem nenhuma proteção.'

# Família L3 cookie-transporte (ADR-021): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py cookie-transporte
# Logins e senhas estão espelhados em apps/backend/app/validation/suites_familias.py (COOKIE_RAMOS);
# os testes Docker conferem os dois.
# A falha é de proteção no transporte (OWASP A02:2021 / A04:2025, CWE-614): config.py deixa o cookie
# de sessão sem Secure, HttpOnly e SameSite, e CABECALHOS_SEGURANCA não tem o HSTS.
ramos:
  - destino: LAB-086-cookie-transporte-banco
    vars:
      lab_id: LAB-086
      versao: 1.0.0
      codigo: L3-FIN
      ramo: fin
      setor: financeiro
      imagem: lab-086-cookie-transporte
      titulo: o cookie de sessão que viajou aberto no Wi-Fi do coworking
      empresa: Nébula Cartões
      marca: "✧ Nébula"
      app_nome: Nébula Cartões Online
      cor: "#6d28d9"
      papel: Pessoa desenvolvedora do time de canais digitais da Nébula Cartões
      aplicacao: Nébula Cartões Online, onde o cliente vê a fatura, o limite e as compras do cartão
      contexto: Num teste de rotina no Wi-Fi de um coworking, um analista de segurança da Nébula capturou o cookie de sessão de um colega abrindo o portal por um link antigo em HTTP, e entrou na conta dele no próprio notebook. O portal está atrás de um balanceador com HTTPS, mas o cookie não tem nenhuma proteção.
      missao: Ler o cookie de sessão que o login entrega, entender o que falta nele e corrigir as flags do cookie e o HSTS
      painel_titulo: Meu cartão

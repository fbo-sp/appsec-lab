# Família L11 mob-app-adulterado (ADR-021, ADR-025): o que muda por ramo. O modelo comum está em ./modelo.
# Depois de editar, rode:  uv run python scripts/gerar-familia.py mob-app-adulterado
# Usa o app mobile comum (mesmas marcas, logins e dados de mob-modo-teste). Logins estão espelhados em
# apps/backend/app/validation/suites_familias.py (ADULTERADO_RAMOS); os testes Docker conferem.
# A falha (CWE-602, Mobile 2016 M8): services/recurso_service.py libera o recurso do plano avançado
# com o plano e a "integridade" que o app informa; um app modificado diz o que quiser. A loja (Play
# Integrity / App Attest) é SIMULADA em services/atestacao_service.py, com hash e chave em /opt/loja.

    titulo: o relatório de ativos liberado por um app adulterado
    papel: Pessoa desenvolvedora do time de apps da Aurora Energia
    aplicacao: App Aurora Campo, o app em que o técnico de campo consulta as ordens de serviço da equipe
    contexto: A segurança de TA da Aurora Energia encontrou, no celular de um técnico de uma empreiteira, uma versão modificada do App Aurora Campo que libera o Relatório de ativos da subestação, exclusivo
      da habilitação de supervisor.
    historia_abertura: Você está no time de apps da Aurora Energia. Numa inspeção de rotina, a segurança de TA encontrou no celular de um técnico de empreiteira uma versão modificada do App Aurora Campo,
      instalada fora da loja, que mostra o Relatório de ativos da subestação, com equipamentos, firmware e pontos de acesso remoto, exclusivo da habilitação de supervisor. O técnico não é supervisor. E
      a API entregou o relatório.
    plano_nome: habilitação de supervisor
    recurso_titulo: Relatório de ativos
    recurso_resultado: 'SE Vale Verde: 14 equipamentos, 3 com firmware desatualizado e 2 pontos de acesso remoto.'
    impacto: 'Qualquer técnico, inclusive de empreiteira, com o app adulterado vê o inventário dos equipamentos da subestação, o firmware desatualizado e os pontos de acesso remoto: o mapa que alguém precisaria

    missao: Simular um app modificado que libera um recurso pago, mostrar que o servidor confia nele e corrigir o servidor para decidir pelo cadastro e conferir o selo de integridade assinado pela loja
    titulo: o cashback em dobro liberado por um app pirata
    papel: Pessoa desenvolvedora do time de apps do banco digital Pagomais
    aplicacao: App Pagomais, o app em que o cliente consulta o extrato e ativa os benefícios do plano
    contexto: 'O time de prevenção a fraudes da Pagomais encontrou num grupo de mensagens um "Pagomais Mod": uma versão modificada do app que libera o Cashback em dobro, benefício exclusivo do plano Pagomais
      Mais, para qualquer cliente.'
    historia_abertura: 'Você está no time de apps do banco digital Pagomais. Na segunda-feira, o time de prevenção a fraudes viu o custo do Cashback em dobro, benefício exclusivo do plano Pagomais Mais,
      triplicar em uma semana. A explicação apareceu num grupo de mensagens: um tal de "Pagomais Mod", uma versão modificada do app, distribuída fora da loja, que mostra o botão do benefício para qualquer
      cliente. E a API aceita.'
    plano_nome: plano Pagomais Mais
    recurso_titulo: Cashback em dobro
    recurso_resultado: ativado nas compras do cartão até o fim do mês.
    impacto: 'Cada cliente do plano básico com o app pirata recebe o dobro de cashback, pago pela Pagomais, sem pagar a mensalidade do plano. O app pirata também é distribuído fora da loja: o mesmo pacote
      pode trazer código que rouba senhas, e o cliente nem percebe a diferença.'

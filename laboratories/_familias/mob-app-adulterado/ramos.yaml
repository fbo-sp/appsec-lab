    titulo: a teleconsulta imediata liberada por um app pirata
    papel: Pessoa desenvolvedora do time de apps da Clínica Lumen
    aplicacao: App Lumen Saúde, o app em que o paciente consulta os exames e agenda teleconsultas
    contexto: A coordenação de telemedicina da Clínica Lumen estranhou a fila da Teleconsulta imediata, exclusiva do plano Lumen Ouro, cheia de pacientes do plano básico. Um app modificado, distribuído
      fora da loja, libera o botão para qualquer paciente.
    historia_abertura: 'Você está no time de apps da Clínica Lumen. Na terça-feira, a coordenação de telemedicina reclamou: a fila da Teleconsulta imediata, exclusiva do plano Lumen Ouro, está cheia de
      pacientes do plano básico, e quem pagou pelo Ouro está esperando. O suporte descobriu um "Lumen Saúde Plus" circulando em grupos de mensagens: o app modificado mostra o botão para qualquer paciente.
      E a API aceita.'
    plano_nome: plano Lumen Ouro
    recurso_titulo: Teleconsulta imediata
    recurso_resultado: você entrou na fila prioritária; um médico chama em até 10 minutos.
    impacto: Pacientes do plano básico com o app pirata ocupam a fila prioritária paga pelo plano Ouro, com custo de médico de plantão para a clínica e atraso para quem tem direito. O app pirata, distribuído
      fora da loja, também pode trazer código que lê os exames do paciente, dado de saúde protegido pela LGPD.

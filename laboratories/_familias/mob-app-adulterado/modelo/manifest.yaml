# [[lab_id]] ([[codigo]]): servidor que confia no app modificado (Code Tampering, CWE-602) no [[app_nome]] da [[empresa]] (app mobile simulado, Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família L11 mob-app-adulterado (ADR-021, ADR-025): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/mob-app-adulterado; não edite este arquivo à mão.

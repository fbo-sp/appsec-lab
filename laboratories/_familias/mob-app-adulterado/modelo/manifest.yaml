  objectives:
    - Entender que o código do app pode ser modificado por quem tem o celular
    - Simular um app reempacotado e ver o servidor liberar o que não devia
    - Ler o veredito do selo de integridade da loja
    - Corrigir o servidor para decidir pelo cadastro e conferir o selo assinado
  story:
    role: >-
      [[papel]]
    application: >-
      [[aplicacao]]
    context: >-
      [[contexto]]
    mission: >-
      [[missao]]
  wrapUp:
    text: |
      Agora o servidor decide o plano pelo cadastro e só libera o recurso com um selo de integridade válido, assinado pela loja, desta conta, dentro da validade e com o veredito `app_oficial`. Em um app real, vale reforçar:

      - **O app é do usuário, não seu.** Qualquer regra que só existe no app (esconder um botão, conferir um plano, dizer "estou íntegro") pode ser trocada por quem reempacota o app. Regra de negócio e de acesso mora no servidor.
      - **Atestação de verdade.** Use Play Integrity (Android) e App Attest / DeviceCheck (iOS). O selo é verificado no servidor (com a API ou a chave pública da plataforma), amarrado a um desafio de uso único e com validade curta.
      - **Proteções no binário ajudam, mas não decidem.** Ofuscação, detecção de root/jailbreak, de depurador e de hooking aumentam o custo do ataque (MASVS-RESILIENCE), mas rodam no aparelho do atacante: são camada extra, nunca o controle principal.
      - **Monitore.** Pedidos com selo `app_modificado` ou sem selo são sinal de app pirata em circulação: registre, alerte e, se preciso, bloqueie a conta.

    mission: [[missao]]
  wrapUp:
    text: |
      Agora o download só entrega arquivos de dentro da pasta de documentos. Em um sistema real, vale reforçar:

      - **Path traversal é sair da pasta permitida.** Juntar uma pasta base com um nome que o usuário controla não basta: `../` sobe de diretório e um caminho absoluto ignora a base inteira. O arquivo final pode acabar em qualquer lugar do sistema de arquivos.
      - **Validar por string é frágil.** Bloquear o texto `..` deixa passar caminho absoluto, codificações (`%2e%2e`, `....//`) e links simbólicos. A regra robusta é resolver o caminho final (`realpath`) e conferir que ele começa **dentro** da pasta base.
      - **Melhor ainda: não use o nome como caminho.** Trate o nome só como identificador — por exemplo, use `os.path.basename`, uma lista de documentos permitidos, ou guarde os arquivos por um id que você controla.
      - **Menos privilégio no processo.** O serviço deve rodar com acesso só à pasta de documentos; assim, mesmo um deslize não alcança arquivos sensíveis do sistema.

steps:
  - id: conhecer
    order: 1
    title: Conhecer o download e achar a leitura do arquivo
    explanation: |
      [[historia_abertura]]

      **Path traversal** (travessia de diretório) acontece quando o nome de arquivo que o usuário controla é usado para montar um caminho, sem conferir se o caminho final fica dentro da pasta permitida. Com `../`, o atacante sobe de diretório; com um caminho absoluto, ignora a pasta de uma vez.

      ```ilustracao
      path-traversal
      ```

      Siga o download pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): a rota `/documento` recebe o nome e chama o serviço.
      2. **Serviço** (`services/documento_service.py`): monta o caminho e abre o arquivo. **É aqui que falta conferir a pasta.**

      As credenciais de acesso, neste laboratório, são:

      - Usuário `[[login_a]]`, senha `[[senha_a]]`.
    task: |
      1. Na aba **Aplicação**, entre com `[[login_a]]` e a senha `[[senha_a]]`. Você chega ao **[[painel_titulo]]** e vê a lista de documentos. Baixe `extrato.txt` para ver um download legítimo.
      2. Na aba **Código**, abra `services/documento_service.py`.

      Informe abaixo o nome do método que lê o documento (o que o controller chama).
    concept: Path traversal — um nome de arquivo que sai da pasta permitida
    validatorRef: path-traversal/answer/metodo-[[ramo]]-v1
    hints:
      - level: 1
        text: 'Em `services/documento_service.py`, a classe `DocumentoService` tem um único método público.'
      - level: 2
        text: É o método que o controller chama para abrir e devolver o arquivo.
      - level: 3
        text: O valor é `ler`.
    points: 10
  - id: explorar
    order: 2
    title: Baixar um arquivo fora da pasta de documentos
    explanation: |
      O método `ler` junta a pasta `documentos/` com o nome recebido e abre o arquivo, sem conferir se o caminho final continua dentro dessa pasta. Ao lado da pasta existe um arquivo `segredo_interno.txt`, que **não** deveria ser baixável. Vamos alcançá-lo com `../`.
    task: |
      Na aba **Terminal**, peça um arquivo fora da pasta, subindo um nível com `../`:

      ```bash
      curl -s "http://127.0.0.1:8080/documento?nome=../segredo_interno.txt" --cookie-jar /tmp/c --cookie /tmp/c
      ```

      Se precisar, primeiro faça login pela aba **Aplicação** e repita o curl pelo navegador. Você verá o conteúdo de `segredo_interno.txt` (com uma `CHAVE-INTERNA`) — um arquivo de fora da pasta de documentos. Informe abaixo se o download **saiu** da pasta de documentos ou ficou **dentro** dela.
    explore: |
      **Teste também um caminho absoluto.** Peça `nome=/workspace/segredo_interno.txt`: como o nome é absoluto, ao juntar com a pasta base o Python descarta a base e abre o caminho absoluto direto. É a mesma falha pela outra ponta — por isso bloquear só o texto `..` não resolve.
    concept: Sem conferir a pasta, o nome com ../ lê arquivos de fora
    validatorRef: path-traversal/answer/saiu-[[ramo]]-v1
    hints:
      - level: 1
        text: Compare onde fica `segredo_interno.txt` com a pasta `documentos/`.
      - level: 2
        text: O `../` subiu um nível, para fora da pasta de documentos.
      - level: 3
        text: A resposta é `saiu`.
    points: 15
  - id: fragil
    order: 3
    title: Entender por que bloquear ".." não basta
    explanation: |
      Uma tentação é só recusar o nome quando ele contém `..`. Mas isso é frágil: um **caminho absoluto** (`/workspace/segredo_interno.txt`) não tem `..` e mesmo assim sai da pasta; e ainda há codificações (`%2e%2e`, `....//`) e links simbólicos. Validar por string, proibindo trechos, sempre deixa uma brecha.

      A regra robusta não olha o texto do nome: ela resolve o caminho final e confere se ele **fica dentro** da pasta de documentos.
    task: |
      O nome `/workspace/segredo_interno.txt` sai da pasta de documentos e **não** contém `..`. Que tipo de caminho é esse, que ignora a pasta base mesmo sem `..`?

      Responda com uma palavra (o oposto de um caminho relativo).
    concept: Validar por string deixa passar caminho absoluto e codificações
    validatorRef: path-traversal/answer/absoluto-[[ramo]]-v1
    hints:
      - level: 1
        text: Começa com `/` e aponta o arquivo desde a raiz do sistema.
      - level: 2
        text: É o oposto de "relativo".
      - level: 3
        text: A resposta é `absoluto`.
    points: 15
  - id: dentro
    order: 4
    title: Nomear a regra que vale
    explanation: |
      A correção não proíbe trechos do nome: ela resolve o caminho final (com `realpath`) e só aceita se ele estiver **dentro** da pasta de documentos. Assim, tanto `../` quanto caminho absoluto quanto link simbólico caem na mesma checagem: o caminho final tem que começar na pasta base.
    task: |
      Complete a regra: o caminho final do arquivo tem que ficar ___ da pasta de documentos.

      Responda com uma palavra (onde o caminho final precisa estar).
    concept: A regra é garantir que o caminho final fique dentro da pasta base
    validatorRef: path-traversal/answer/regra-[[ramo]]-v1
    hints:
      - level: 1
        text: É o oposto de "fora".
      - level: 2
        text: O caminho final não pode escapar da pasta de documentos.
      - level: 3
        text: A resposta é `dentro`.
    points: 15
  - id: corrigir
    order: 5
    title: Garantir o caminho dentro da pasta no serviço
    explanation: |
      **Por que a falha existe.** `ler` abre o caminho montado sem conferir onde ele aponta. Quem envia o nome escolhe o caminho.

      **A correção.** Resolver o caminho final com `os.path.realpath` e só abrir se ele estiver dentro da pasta base. Qualquer coisa fora dela é recusada.
    task: |
      Abra `services/documento_service.py` e troque o método `ler` inteiro por este:

      ```python
          def ler(self, nome: str) -> str:
              """Lê o documento de nome ``nome`` dentro da pasta de documentos e devolve o conteúdo."""
              base = os.path.realpath(self.BASE)
              caminho = os.path.realpath(os.path.join(base, nome))
              if caminho != base and not caminho.startswith(base + os.sep):
                  raise ValueError("Documento não permitido.")
              with open(caminho, encoding="utf-8") as arquivo:
                  return arquivo.read()
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então, na aba **Terminal** (ou pelo navegador, logado):

      1. repita `nome=../segredo_interno.txt` e veja que agora dá **documento não encontrado**;
      2. teste `nome=/workspace/segredo_interno.txt`: também é recusado;
      3. baixe `extrato.txt` e veja que o documento legítimo **continua** funcionando;
      4. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o `def ler` fica com 4 espaços; o corpo, com 8. A checagem (`if caminho != base and not caminho.startswith(...)`) fica antes do `with open(...)`.
    concept: Correção do path traversal garantindo o caminho dentro da base
    validatorRef: path-traversal/python-flask/documento-seguro-[[ramo]]-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/documento_service.py`, no método `ler`.'
      - level: 2
        text: "Resolva o caminho com os.path.realpath e confira que ele começa dentro da pasta base."
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def ler` fica com 4 espaços antes de `def`.
    points: 45
policy:
  sequentialUnlock: true

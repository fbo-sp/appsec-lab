steps:
  - id: conhecer
    order: 1
    title: Conhecer a consulta ao parceiro
    explanation: |
      Você é do time de crédito da Fintech Vértix. Na madrugada de ontem, o monitoramento viu 37 propostas de cartão aprovadas com limite de R$ 4,8 milhões, sem nenhum analista mexer. Horas depois, o Bureau Sigma avisou que um servidor dele tinha sido invadido. O chamado chegou ao seu time: por que o Vértix Crédito aceitou isso?

      Quando o seu sistema chama a API de outra empresa, a resposta dela vira **entrada** do seu sistema, como um formulário preenchido por alguém de fora. A diferença é que costumamos confiar mais no parceiro do que no usuário. Se o parceiro for invadido, tiver um defeito ou trocar o formato sem avisar, essa confiança vira a porta de entrada: é o **consumo inseguro de APIs** (OWASP API10).

      ```ilustracao
      consumo-api
      ```

      Siga a consulta pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): o botão "Consultar" chama o cliente do parceiro.
      2. **Cliente** (`services/parceiro_client.py`): faz a chamada HTTP e devolve o JSON.
      3. **Serviço** (`services/consulta_service.py`): grava o resultado no banco. **É aqui que falta conferir.**

      As credenciais, neste laboratório, são:

      - Analista de crédito: `renata.quintela`, senha `Renata#Vertix26` (Renata Quintela Dias).
    task: |
      1. Na aba **Aplicação**, entre como `renata.quintela` / `Renata#Vertix26`.
      2. Na proposta `PROP-4471`, clique em **Consultar bureau**. Veja a mensagem com o limite sugerido devolvido e o status `em análise`.
      3. Na aba **Código**, encontre o arquivo que faz a chamada HTTP ao parceiro.

      Informe abaixo o nome desse arquivo (por exemplo, `algum_arquivo.py`).
    concept: A resposta de uma API externa é entrada do seu sistema
    validatorRef: api-consumo-parceiro/answer/cliente-fin-v1
    hints:
      - level: 1
        text: Fica na pasta `services/` e tem "parceiro" no nome.
      - level: 2
        text: É o arquivo com `urllib.request.urlopen`.
      - level: 3
        text: A resposta é `parceiro_client.py`.
    points: 10
  - id: explorar
    order: 2
    title: Simular o parceiro comprometido
    explanation: |
      No laboratório, o parceiro é simulado dentro do contêiner, sem internet, e tem um interruptor que imita uma invasão do lado dele. Foi o que aconteceu com o Bureau Sigma: com um servidor dele invadido, a API passou a devolver limites milionários e um campo novo, que o Vértix Crédito tratou como aprovação.
    task: |
      1. Na barra de endereço da aba **Aplicação**, abra `/parceiro/admin` e clique em **Simular parceiro comprometido**.
      2. Volte ao painel (link na página) e clique de novo em **Consultar bureau** na proposta `PROP-4471`.
      3. Veja, em "Consultas gravadas", o limite sugerido e o status da nova linha.

      Informe abaixo o status que a nova consulta recebeu.
    explore: |
      **O que o parceiro mandou.** Pelo **Terminal**, veja a resposta crua da API simulada:

      ```bash
      curl -s http://127.0.0.1:8080/parceiro/api/consulta/PROP-4471
      ```

      **O que procurar.** Dois problemas: o `limite_sugerido` está muito acima do teto combinado e apareceu um campo novo, `aprovacao_automatica`, que não existe no contrato. O Vértix Crédito aceitou os dois. Para conferir o que foi gravado no banco, use `grep "Consulta gravada" /tmp/app.log` (o app.log também registra os acessos, por isso o `grep`).
    concept: O consumidor aceitou valor absurdo e um campo fora do contrato
    validatorRef: api-consumo-parceiro/answer/status-fin-v1
    hints:
      - level: 1
        text: Olhe a última coluna da linha mais nova em "Consultas gravadas".
      - level: 2
        text: O campo `aprovacao_automatica` do parceiro decidiu o status.
      - level: 3
        text: A resposta é `aprovado`.
    points: 15
  - id: contrato
    order: 3
    title: Nomear a regra que o consumidor deve conferir
    explanation: |
      Toda integração tem um acordo sobre o formato da resposta: quais campos vêm, de que tipo e em que faixa. Para o Bureau Sigma, ele está no topo de `services/consulta_service.py`: só `referencia` e `limite_sugerido`, com valor entre 0 e R$ 50.000. Esse acordo é a régua para recusar o que vier fora.
    task: |
      Como se chama esse acordo entre as duas empresas sobre os campos, tipos e faixas da resposta da API?

      Responda com uma palavra.
    concept: O contrato da API define o que é uma resposta válida
    validatorRef: api-consumo-parceiro/answer/contrato-fin-v1
    hints:
      - level: 1
        text: É a mesma palavra de um documento assinado entre duas empresas.
      - level: 2
        text: Aparece logo no comentário do topo de `services/consulta_service.py`.
      - level: 3
        text: A resposta é `contrato`.
    points: 15
  - id: onde
    order: 4
    title: Encontrar onde a resposta é gravada sem conferência
    explanation: |
      O cliente HTTP só busca a resposta; quem decide o que entra no banco é o serviço. Abra `services/consulta_service.py`: o método de gravação pega o `limite_sugerido` como veio e ainda usa `aprovacao_automatica` para decidir o status.
    task: |
      Informe abaixo o nome do método que grava a resposta do parceiro sem conferir o contrato.
    concept: A conferência pertence ao serviço que grava, antes do banco
    validatorRef: api-consumo-parceiro/answer/metodo-fin-v1
    hints:
      - level: 1
        text: A classe `ConsultaService` tem um único método público.
      - level: 2
        text: É o método que o controller chama depois do cliente do parceiro.
      - level: 3
        text: A resposta é `registrar`.
    points: 15
  - id: corrigir
    order: 5
    title: Conferir o contrato antes de gravar
    explanation: |
      **Por que a falha existe.** `registrar` grava o valor como veio e deixa um campo do parceiro decidir o status.

      **A correção.** Antes de gravar: recusar a resposta se tiver campos fora do contrato, recusar se o valor não for número ou estiver fora da faixa de 0 a R$ 50.000, e decidir o status do nosso lado (`em análise`). A recusa é feita levantando `RespostaInvalida`, que o controller já transforma em "Resposta do parceiro inválida: nada foi gravado".
    task: |
      Abra `services/consulta_service.py` e troque o método `registrar` inteiro por este:

      ```python
          def registrar(self, conta_id: int, referencia: str, dados: dict) -> Consulta:
              """Confere o contrato da resposta antes de gravar; o status é decisão nossa."""
              if set(dados) != {"referencia", "limite_sugerido"}:
                  raise RespostaInvalida("campos fora do contrato")
              valor = dados["limite_sugerido"]
              if not isinstance(valor, (int, float)) or not 0 <= valor <= 50000:
                  raise RespostaInvalida("valor fora da faixa")
              return self._repositorio.inserir(conta_id, referencia, valor, "em análise")
      ```

      Salve com **Ctrl+S**. A aplicação reinicia (e o banco volta ao início). Então:

      1. com o parceiro ainda **comprometido**, consulte `PROP-4471` e veja "Resposta do parceiro inválida: nada foi gravado";
      2. em `/parceiro/admin`, volte ao **modo normal**, consulte de novo e veja que a consulta **continua** sendo gravada;
      3. clique em **Validar**.
    explore: |
      **Por que recusar e não "consertar" o valor.** Trocar um valor absurdo pelo teto esconde o problema: a proposta seguiria com um número que ninguém informou. Recusar e registrar no log deixa o incidente visível. Veja a recusa com `grep "recusada" /tmp/app.log`.

      **Se algo não funcionar depois de salvar.** No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      O `def registrar` fica com 4 espaços; o corpo, com 8; as linhas dentro dos `if`, com 12.
    concept: Validar campos e faixas da resposta do parceiro e decidir o status no servidor
    validatorRef: api-consumo-parceiro/python-flask/contrato-parceiro-fin-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/consulta_service.py`, no método `registrar`.'
      - level: 2
        text: Recuse campos extras e valor fora da faixa, e grave sempre o status `em análise`.
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def` fica com 4 espaços.
    points: 45

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Tratar a resposta da API de um parceiro como entrada não confiável
    - Simular o parceiro comprometido e ver o dado absurdo entrar no banco
    - Reconhecer o contrato (campos e faixas) como a regra que o consumidor confere
    - Corrigir conferindo campos e faixa antes de gravar, e decidindo o status do nosso lado
  story:
    role: Pessoa desenvolvedora do time de crédito da Fintech Vértix
    application: Vértix Crédito, onde analistas consultam o Bureau Sigma para definir o limite das propostas de cartão
    context: >-
      O Vértix Crédito consulta a API do Bureau Sigma e grava o limite sugerido de cada proposta. Na madrugada de ontem, o monitoramento viu 37 propostas aprovadas com limite de R$ 4,8 milhões, sem nenhum analista mexer. O Bureau Sigma confirmou depois que um servidor dele foi invadido.
    mission: Reproduzir a resposta adulterada do parceiro, entender por que ela entrou no banco e passar a conferir o contrato antes de gravar
  wrapUp:
    text: |
      Agora a resposta do Bureau Sigma só entra no banco se seguir o contrato, e o status é decidido pelo Vértix Crédito. Em um sistema real, vale reforçar:

      - **API de parceiro é entrada externa.** Valide a resposta com o mesmo rigor de um formulário: esquema (campos e tipos), faixas e tamanho. Rejeite o que estiver fora, em vez de "corrigir" o valor.
      - **Decisão de negócio fica do seu lado.** O parceiro informa; quem aprova, libera ou paga é a sua regra. Um campo extra na resposta nunca deve mudar o fluxo.
      - **Transporte e tempo.** Use TLS com verificação de certificado, tempo limite (como o `timeout=3` do cliente) e não siga redirecionamentos para endereços não combinados.
      - **Monitore o parceiro.** Registre e alerte quando as respostas começarem a ser recusadas: pode ser o primeiro sinal de que o parceiro foi invadido.

# LAB-079 (L2-IND): login sem trilha de auditoria das falhas (OWASP A09, CWE-778) no Luz do Vale Operação da Distribuidora Luz do Vale (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família L2 log-auditoria (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/log-auditoria; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

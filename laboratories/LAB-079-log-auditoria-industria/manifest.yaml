learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender por que a trilha de auditoria é o que permite detectar e investigar um ataque
    - Mostrar que tentativas de login erradas hoje não deixam rastro
    - Saber o que um evento de segurança precisa conter (e o que nunca pode conter)
    - Corrigir registrando sucesso e falha do login, com login, IP e hora
  story:
    role: Pessoa desenvolvedora do time de sistemas de operação da Distribuidora Luz do Vale
    application: Luz do Vale Operação, onde os técnicos de campo e o centro de operação registram ordens de manobra na rede de distribuição
    context: >-
      O centro de operação estranhou uma ordem de manobra criada fora do turno por uma conta de técnico. A segurança da informação pediu as tentativas de acesso àquela conta para saber se a senha foi adivinhada, e a trilha só mostra logins que deram certo.
    mission: Mostrar que as tentativas erradas de login não deixam rastro e corrigir o serviço de autenticação para registrar sucesso e falha, sem nunca gravar a senha
  wrapUp:
    text: |
      Agora toda tentativa de login, certa ou errada, deixa rastro na trilha de auditoria. Em um sistema real, vale reforçar:

      - **Registre o que importa para investigar.** Login com sucesso e com falha, troca de senha, mudança de permissão, acesso negado e operações sensíveis, sempre com quem, de onde, quando e o resultado.
      - **Nunca registre segredos.** Senha digitada, token, número completo de cartão e dados de saúde não vão para log nem auditoria. Um log com senhas vira um alvo tão valioso quanto o banco.
      - **Log sem alerta não protege.** A OWASP 2025 renomeou o item para "Logging and Alerting": defina alertas, como muitas falhas na mesma conta ou do mesmo IP em poucos minutos, e alguém para recebê-los.
      - **Proteja a trilha.** Envie para um repositório central (SIEM), com retenção definida e sem que a aplicação consiga apagar o que já gravou.

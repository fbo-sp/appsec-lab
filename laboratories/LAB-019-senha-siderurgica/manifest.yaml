# LAB-019 (A4-IND): armazenamento inseguro de senha (CWE-916) no Portal do Colaborador da Siderúrgica Pindorama (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios (domínio .example). Família A4 senha (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/senha; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

learning:
  singleVulnerability: true
  estimatedMinutes: 40
  difficulty: beginner
  objectives:
    - Entender por que uma senha nunca é guardada como texto, e sim como um resumo (hash)
    - Reconhecer por que MD5 (rápido e sem sal) não serve para senha
    - Confirmar, no banco, que senhas iguais viram hashes iguais e que o resumo legado é reversível na prática
    - Corrigir adotando um hash forte (com sal e custo) e migrando as contas antigas sem quebrar o login
  story:
    role: Pessoa desenvolvedora do time de sistemas internos da Siderúrgica Pindorama
    application: Portal do Colaborador, onde o funcionário entra para holerite, férias e benefícios
    context: >-
      O login do Portal do Colaborador foi herdado de um sistema de RH legado, o "RH Mainframe", com os hashes de senha importados como estavam lá. Antes da certificação ISO/IEC 27001, uma auditoria apontou que as senhas estão em MD5 sem sal, um achado de alta severidade.
    mission: Confirmar como as senhas estão guardadas e corrigir o armazenamento sem derrubar o login dos colaboradores
  wrapUp:
    text: |
      Agora cada senha é guardada com **sal único** e **custo de cálculo alto**, e as contas antigas passam para o formato novo assim que o usuário entra. Em um sistema real, vale reforçar:

      - **Não invente o seu algoritmo.** Use o que a plataforma já traz. No Flask/Python, `werkzeug.security` (ou `passlib`) entrega `scrypt`, `bcrypt` e `pbkdf2`. Em outras pilhas, há equivalentes mantidos: Spring Security (`DelegatingPasswordEncoder`), ASP.NET (`PasswordHasher`), Django (`PBKDF2`/`argon2`). O erro comum é usar `md5`/`sha1` "porque é rápido" — rápido é exatamente o que o atacante quer.
      - **Sal e custo.** O **sal** (um valor aleatório por senha) faz com que senhas iguais tenham hashes diferentes, acabando com as tabelas pré-calculadas. O **custo** (fator de trabalho) deixa cada tentativa cara, o que atrapalha a força bruta. O `werkzeug` já guarda os dois dentro do próprio hash.
      - **Migração sem reset geral.** Você não sabe a senha em texto de ninguém, então não dá para só regerar os hashes. O padrão é o que você fez: aceitar o hash legado **uma última vez** no login e, na hora, regravar no formato forte. Em semanas, quase todas as contas migram sozinhas; o resto você força a trocar.
      - **Defesas que acompanham.** Limite tentativas de login, ofereça (ou exija) segundo fator e compare senhas novas com listas de senhas vazadas. Hash forte protege o banco; essas camadas protegem o login.
    references:
      - title: "OWASP Cheat Sheet: Password Storage"
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      - title: "OWASP Top 10:2025: A04 Cryptographic Failures"

# LAB-011 (A2-FIN): Cross-Site Request Forgery (CWE-352) no Portal do Segurado da Vínculo Seguros (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios (domínio .example). Família A2 csrf (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/csrf; não edite este arquivo à mão.
# O site do atacante (ADR-022) é uma página estática da imagem, publicada pelo gateway em outra origem.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

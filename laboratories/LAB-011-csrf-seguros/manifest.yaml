learning:
  singleVulnerability: true
  estimatedMinutes: 40
  difficulty: beginner
  objectives:
    - Entender por que o navegador envia o cookie de sessão em requisições que o usuário não pediu
    - Diferenciar site de origem e saber o que o atributo SameSite protege e o que não protege
    - Demonstrar CSRF com uma página fictícia de atacante e achar a evidência no log
    - Corrigir a falha com um token anti-CSRF por sessão, sem quebrar o uso legítimo
  story:
    role: Desenvolvedor(a) da squad do Portal do Segurado da Vínculo Seguros
    application: Portal do Segurado, tela "Conta para indenização"
    context: >-
      Segurados com sinistro aprovado relatam que a indenização foi paga numa chave PIX que eles não cadastraram. O histórico mostra trocas de chave feitas pela sessão do próprio segurado, logo depois de ele abrir um e-mail de campanha.
    mission: Reproduzir a troca de chave, achar a evidência e corrigir o formulário
  wrapUp:
    text: |
      Agora só um formulário montado pela própria aplicação consegue alterar a chave PIX: o token aleatório da sessão não está em nenhuma outra página. Em um sistema real, vale reforçar outras camadas:

      - **Use o que o framework já traz.** No Flask, a extensão `Flask-WTF` (`CSRFProtect`) faz exatamente o que você escreveu, para todos os formulários. Django, Rails, Spring Security e ASP.NET têm proteção equivalente ligada por padrão: o erro comum é desligá-la.
      - **SameSite ajuda, mas não basta.** `Lax` bloqueia formulários vindos de **outros sites**, não de outros sistemas do **mesmo site**, como você viu. `Strict` protege mais, mas quebra quem chega por um link de e-mail já logado.
      - **Fetch Metadata como segunda barreira.** Recusar `POST` com `Sec-Fetch-Site` diferente de `same-origin` barra a página do atacante sem token nenhum. Navegadores antigos não enviam o cabeçalho, por isso ele complementa o token, não o substitui.
      - **Operações críticas pedem confirmação.** Trocar a conta que recebe indenização deveria pedir uma confirmação fora do navegador, como um código no aplicativo ou por SMS, e avisar o segurado por e-mail. Isso também barra CSRF.
      - **APIs com token no cabeçalho.** Se a autenticação viaja em `Authorization: Bearer`, e não em cookie, o navegador não a envia sozinho e o CSRF clássico não funciona.

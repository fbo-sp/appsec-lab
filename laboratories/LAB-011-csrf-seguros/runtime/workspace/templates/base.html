<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Vínculo Seguros{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="topo">
    <span class="marca">◆ Vínculo Seguros</span>
    <span class="sub">Portal do Segurado</span>
    {% if usuario %}
    <nav><a href="{{ url_for('indenizacao.ver') }}">Conta para indenização</a></nav>
    <span class="usuario">{{ usuario.nome }} · <a href="{{ url_for('auth.sair') }}">Sair</a></span>
    {% endif %}
  </header>
  <main>
    {% for mensagem in get_flashed_messages() %}<p class="aviso">{{ mensagem }}</p>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
  <footer>Ambiente de treinamento CECyber · dados fictícios</footer>
</body>
</html>

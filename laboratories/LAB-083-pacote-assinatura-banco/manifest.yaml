steps:
  - id: conhecer
    order: 1
    title: Conhecer o pacote e a assinatura
    explanation: |
      Você é do time de prevenção a fraudes do Banco Solaris. As regras do motor antifraude não são escritas aqui: chegam do Bureau Atento Antifraude, toda semana, num pacote JSON assinado com HMAC e deixado num servidor de troca de arquivos. Esta semana, a auditoria interna perguntou: "se alguém com acesso a esse servidor trocar um número no arquivo, o motor percebe?". Ninguém soube responder com certeza.

      Uma **assinatura HMAC** é um código calculado sobre o conteúdo do pacote com uma chave secreta que só o fornecedor e você conhecem. Quem recebe recalcula o código com a mesma chave: se bater, o pacote veio de quem tem a chave e não mudou nem um caractere. Se ninguém recalcula, a assinatura é só um texto a mais no arquivo, e qualquer alteração passa: é a falha de **integridade de dados** (OWASP A08).

      ```ilustracao
      pacote-assinado
      ```

      Siga a importação pelas camadas:

      1. **Controller** (`controllers/painel_controller.py`): recebe o arquivo enviado em `POST /pacotes`.
      2. **Serviço** (`services/pacote_service.py`): lê o JSON e aplica os parâmetros. **É aqui que falta conferir.**
      3. **Repositório** (`repositories/parametro_repository.py`): grava os valores em vigor.

      As credenciais, neste laboratório, são:

      - Analista de prevenção a fraudes: `beatriz.nogueira`, senha `Beatriz#Solaris26` (Beatriz Nogueira Sales).
    task: |
      1. Na aba **Aplicação**, entre como `beatriz.nogueira` / `Beatriz#Solaris26` e veja os regras antifraude em vigor.
      2. Na aba **Código**, abra `pacotes_recebidos/regras-antifraude-2026.11.1.json`, o pacote que o Bureau Atento Antifraude enviou.

      Informe abaixo o nome do campo do pacote que leva a assinatura do fornecedor.
    explore: |
      **Veja exatamente o que é assinado.** Em `services/pacote_service.py`, a função `conteudo_canonico` monta os bytes que o fornecedor assina: o pacote **sem** o campo `assinatura`, em JSON com as chaves em ordem e sem espaços.

      **Por que vale olhar.** Os dois lados precisam assinar e conferir exatamente os mesmos bytes. Se um lado formata o JSON de outro jeito, a assinatura de um pacote legítimo não bate, e o time acaba desligando a verificação "para funcionar".
    concept: A assinatura prova origem e integridade, se alguém conferir
    validatorRef: pacote-assinatura/answer/campo-fin-v1
    hints:
      - level: 1
        text: O pacote tem quatro campos no primeiro nível.
      - level: 2
        text: É o campo com um texto longo em hexadecimal.
      - level: 3
        text: A resposta é `assinatura`.
    points: 10
  - id: explorar
    order: 2
    title: Alterar o pacote depois de assinado
    explanation: |
      O pacote passa por um servidor de troca de arquivos antes de chegar ao Solaris Antifraude. Quem tiver acesso a esse caminho consegue mudar um número no arquivo. Se o sistema confere a assinatura, a alteração é descoberta; se não confere, o número alterado vira regra. Você vai mudar o limite de Pix noturno sem análise de 1000 para 50000, **sem mexer na assinatura**, e enviar.
    task: |
      Na aba **Terminal**, copie o pacote, altere o valor e envie:

      ```bash
      cp pacotes_recebidos/regras-antifraude-2026.11.1.json /tmp/pacote.json
      sed -i 's/"limite_pix_noturno": 1000/"limite_pix_noturno": 50000/' /tmp/pacote.json
      grep limite_pix_noturno /tmp/pacote.json
      curl -s --noproxy '*' -c /tmp/ck -d "login=beatriz.nogueira&senha=Beatriz#Solaris26" http://127.0.0.1:8080/login -o /dev/null
      curl -s --noproxy '*' -b /tmp/ck -F "arquivo=@/tmp/pacote.json" http://127.0.0.1:8080/pacotes | grep -o "Pacote [^<]*"
      ```

      Depois, recarregue a aba **Aplicação** e veja a tabela. Informe abaixo o valor de `limite_pix_noturno` que está em vigor agora.
    explore: |
      **Sem assinatura nenhuma.** Apague o campo `assinatura` e envie de novo:

      ```bash
      python -c "import json; p=json.load(open('/tmp/pacote.json')); p.pop('assinatura'); json.dump(p, open('/tmp/sem.json','w'))"
      curl -s --noproxy '*' -b /tmp/ck -F "arquivo=@/tmp/sem.json" http://127.0.0.1:8080/pacotes | grep -o "Pacote [^<]*"
      ```

      **O que esperar.** Também é aplicado. Se um pacote adulterado é aceito, quem conseguir alterar o arquivo no caminho (no servidor de troca de arquivos, num e-mail, num repositório) muda as regras do banco: um limite de Pix noturno de R$ 50.000 sem análise é exatamente o que um golpista precisa.
    concept: Sem conferir, um pacote alterado no caminho vira regra
    validatorRef: pacote-assinatura/answer/valor-fin-v1
    hints:
      - level: 1
        text: Olhe a linha de `limite_pix_noturno` na tabela do painel, depois de recarregar.
      - level: 2
        text: É o valor que o `sed` colocou no arquivo.
      - level: 3
        text: A resposta é `50000`.
    points: 15
  - id: conceito
    order: 3
    title: Saber o que a assinatura garante
    explanation: |
      Uma assinatura conferida garante duas coisas. **Integridade**: o conteúdo não mudou desde que foi assinado; mudar um caractere muda o HMAC inteiro. E a outra: que o pacote foi assinado por quem tem a chave, o fornecedor. Conferir só que o campo `assinatura` existe não garante nenhuma das duas, porque o atacante deixa a assinatura antiga no lugar.
    task: |
      Além da integridade, o que a assinatura conferida garante sobre o pacote?

      Responda com uma palavra (de quem ele veio).
    concept: Integridade e origem
    validatorRef: pacote-assinatura/answer/garantia-fin-v1
    hints:
      - level: 1
        text: É sobre quem enviou o pacote.
      - level: 2
        text: Uma palavra que quer dizer "de onde veio" ou "de quem veio".
      - level: 3
        text: A resposta é `origem` (também vale `autenticidade`).
    points: 15
  - id: onde
    order: 4
    title: Encontrar onde a assinatura deveria ser conferida
    explanation: |
      Abra `services/pacote_service.py`. O serviço já importa `hmac` e `hashlib` e já tem a função `conteudo_canonico`, mas o método que aplica o pacote lê o JSON, confere os campos obrigatórios (sem a assinatura) e grava direto no repositório.
    task: |
      Informe abaixo o nome do método que aplica o pacote sem conferir a assinatura.
    concept: A conferência pertence ao serviço, antes de gravar
    validatorRef: pacote-assinatura/answer/metodo-fin-v1
    hints:
      - level: 1
        text: A classe `PacoteService` tem um único método público.
      - level: 2
        text: É o método que o controller chama ao receber o arquivo.
      - level: 3
        text: A resposta é `importar`.
    points: 15
  - id: corrigir
    order: 5
    title: Conferir a assinatura antes de aplicar
    explanation: |
      **Por que a falha existe.** `importar` aplica os parâmetros sem recalcular o HMAC.

      **A correção.** Recalcular o HMAC-SHA256 do conteúdo canônico com a chave do fornecedor e comparar com o campo `assinatura` usando `hmac.compare_digest`, que compara em tempo constante. Se não bater, ou se a assinatura não vier, o pacote é recusado e nada é gravado.
    task: |
      Abra `services/pacote_service.py` e troque o método `importar` inteiro por este:

      ```python
          def importar(self, texto: str) -> dict:
              """Lê o pacote recebido, confere a assinatura do fornecedor e só então aplica os parâmetros."""
              pacote = self._ler(texto)
              esperada = hmac.new(self._chave, conteudo_canonico(pacote), hashlib.sha256).hexdigest()
              if not hmac.compare_digest(esperada, str(pacote.get("assinatura", ""))):
                  raise PacoteInvalido("assinatura do fornecedor não confere.")
              self._repositorio.substituir(str(pacote["versao"]), str(pacote["fornecedor"]), pacote["parametros"])
              return pacote
      ```

      Salve com **Ctrl+S**. A aplicação reinicia (e os parâmetros voltam ao início). Então:

      1. na aba **Aplicação**, clique em **Sair** e entre de novo como `beatriz.nogueira` / `Beatriz#Solaris26` (da etapa 1);
      2. no **Terminal**, repita os dois `curl` da etapa 2 (login e envio): agora a resposta é "Pacote recusado";
      3. envie o pacote original, sem alteração, e veja que ele é aplicado:

         ```bash
         curl -s --noproxy '*' -b /tmp/ck -F "arquivo=@pacotes_recebidos/regras-antifraude-2026.11.1.json" http://127.0.0.1:8080/pacotes | grep -o "Pacote [^<]*"
         ```

      4. clique em **Validar**.
    explore: |
      **Veja as recusas no log.** No **Terminal**:

      ```bash
      grep "Pacote recusado" /tmp/app.log
      ```

      O `app.log` também registra os acessos (linhas `POST /pacotes`); o `grep` mostra só as recusas. Num sistema real, cada recusa de assinatura é um alerta: alguém mexeu no caminho, ou a chave do fornecedor mudou sem aviso.

      **Se algo não funcionar depois de salvar.** No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      O `def importar` fica com 4 espaços; o corpo, com 8; a linha dentro do `if`, com 12.
    concept: Recalcular o HMAC e comparar em tempo constante antes de aplicar
    validatorRef: pacote-assinatura/python-flask/assinatura-conferida-fin-v1
    hints:
      - level: 1
        text: 'A mudança é só em `services/pacote_service.py`, no método `importar`.'
      - level: 2
        text: Antes de chamar o repositório, recalcule o HMAC com `conteudo_canonico(pacote)` e compare com `hmac.compare_digest`.
      - level: 3
        text: Copie o método da tarefa sem mudar o recuo. O `def` fica com 4 espaços.
    points: 45

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender o que uma assinatura HMAC prova sobre um pacote recebido de terceiros
    - Mostrar que um pacote alterado depois de assinado, ou sem assinatura, é aplicado
    - Saber o que conferir antes de aplicar dados que chegam de fora
    - Corrigir recalculando o HMAC e comparando em tempo constante antes de aplicar
  story:
    role: Pessoa desenvolvedora do time de prevenção a fraudes do Banco Solaris
    application: Solaris Antifraude, o motor que decide quais Pix e compras passam direto, vão para análise ou são bloqueados
    context: >-
      As regras do motor antifraude chegam em pacotes do bureau parceiro, assinados com HMAC. Uma auditoria interna perguntou se o motor confere a assinatura antes de aplicar, e ninguém soube responder com certeza.
    mission: Mostrar que um pacote alterado depois de assinado é aplicado e corrigir a importação para conferir a assinatura do fornecedor antes de aplicar
  wrapUp:
    text: |
      Agora só um pacote assinado pelo fornecedor, e não alterado depois, chega aos parâmetros em vigor. Em um sistema real, vale reforçar:

      - **Confira antes de usar.** Pacote de configuração, atualização de software, regra ou tabela vinda de fora só é aplicado depois de conferir a assinatura. Conferir que o campo existe não confere nada.
      - **Compare em tempo constante.** `hmac.compare_digest` não para no primeiro caractere diferente, então o tempo da comparação não entrega pistas sobre a assinatura certa.
      - **Prefira assinatura assimétrica.** Com HMAC, as duas empresas guardam a mesma chave e qualquer uma pode assinar. Com uma chave privada do fornecedor (Ed25519, RSA, ou ferramentas como Sigstore e cosign), você só guarda a chave pública e ninguém do seu lado consegue forjar um pacote.
      - **Proteja contra o pacote antigo.** Uma assinatura válida de uma versão antiga continua válida. Recuse versões menores que a em vigor e registre cada importação, aceita ou recusada.

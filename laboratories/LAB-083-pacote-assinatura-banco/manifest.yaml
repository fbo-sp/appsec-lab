# LAB-083 (L4-FIN): pacote aceito sem assinatura (OWASP A06:2021 / A03:2025, CWE-1395) no Solaris Antifraude da Banco Solaris (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família L4 pacote-assinatura (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/pacote-assinatura; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

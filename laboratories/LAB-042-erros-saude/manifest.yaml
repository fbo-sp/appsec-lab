learning:
  singleVulnerability: true
  estimatedMinutes: 30
  difficulty: intermediate
  objectives:
    - Entender por que mensagens de erro detalhadas vazam informação útil ao atacante
    - Explorar a falha forçando um erro e lendo o traceback na resposta
    - Reconhecer que o detalhe do erro deve ir para o log, não para o cliente
    - Corrigir devolvendo uma mensagem genérica e registrando o detalhe no servidor
  story:
    role: Pessoa desenvolvedora do time de dados da operadora Prisma
    application: Painel de Relatórios, onde a equipe gera relatórios mensais por uma API interna
    context: >-
      O Painel de Relatórios gera relatórios por uma API. Numa auditoria, a equipe apontou que, quando o processamento falha, a API devolve ao cliente o traceback completo — vazando caminhos de arquivos e detalhes internos do sistema.
    mission: Confirmar que a API vaza o traceback em erros e corrigir devolvendo mensagem genérica e logando o detalhe
  wrapUp:
    text: |
      Agora a API responde a erros com uma mensagem genérica e guarda o detalhe só no log do servidor. Em um sistema real, vale reforçar:

      - **Mensagem de erro é informação.** Traceback, caminho de arquivo, versão de biblioteca, consulta SQL, nome de host: cada detalhe ajuda quem ataca a mapear o sistema e escolher o próximo passo. O cliente não precisa de nada disso.
      - **Detalhe vai para o log, resposta vai genérica.** Registre a exceção completa no servidor (com um id de correlação, se possível) e devolva ao cliente só "erro interno" e, quando útil, esse id para o suporte rastrear.
      - **Desligue o modo debug em produção.** O debugger interativo (ex.: o do Flask) expõe traceback e até um console remoto. Ele é ótimo para desenvolver e perigoso em produção.
      - **Trate exceções de propósito.** Capturar `Exception` e repassar o texto é quase tão ruim quanto não tratar. Decida o que o cliente vê e o que fica no log.
    references:
      - title: "OWASP Top 10:2025: A10 Mishandling of Exceptional Conditions"

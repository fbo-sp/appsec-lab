steps:
  - id: conhecer
    order: 1
    title: "Conhecer o app e achar quem decide o acesso"
    explanation: |
      Você está no time de apps da Clínica Lumen. O app do paciente da Clínica Lumen lê os exames pela API. Um teste de invasão mostrou que alguém abriu o pacote do app, copiou a chave de API que o app usa e passou a consultar os exames de qualquer paciente direto pela API, sem abrir o app e sem login.

      **Um laboratório mobile.** Na aba **Aplicação**, o app aparece numa moldura de celular. Ele é um app **simulado** (não há emulador), mas fala com a API do servidor do mesmo jeito que um app Android ou iOS. Toda falha de app mobile termina numa decisão de segurança: quem a toma, o aparelho ou o servidor?

      ```ilustracao
      mob-chave-embutida
      ```

      Siga um pedido do app pelas camadas:

      1. **Pacote do app** (`cliente/config.json`): a configuração que vai dentro do APK/IPA. O app lê dela a chave de API e a envia no cabeçalho `X-Api-Key`.
      2. **Controller** (`controllers/api_controller.py`): recebe `GET /api/itens?conta=N` e pergunta ao serviço de acesso se pode entregar.
      3. **Serviço** (`services/acesso_service.py`): decide se o pedido pode ler a lista da conta. **É aqui que está a falha.**

      As credenciais de teste deste laboratório são:

      - Usuário `marcos.tavares`, senha `Marcos#Lumen26` (Marcos Tavares Lima).
    task: |
      1. Na aba **Aplicação**, entre no app do celular com `marcos.tavares` e a senha `Marcos#Lumen26`. Veja a tela **Meus exames**.
      2. Na aba **Código**, abra `services/acesso_service.py`.

      Informe abaixo o nome do método que decide se o pedido pode ler a lista da conta.
    concept: "Chave de API no pacote: todo mundo que baixa o app tem a chave"
    validatorRef: mob-chave-embutida/answer/metodo-sau-v1
    hints:
      - level: 1
        text: "A classe `AcessoService` tem um único método público."
      - level: 2
        text: "É o método que o controller chama antes de entregar a lista."
      - level: 3
        text: "O valor é `conta_autorizada`."
    points: 10
  - id: explorar
    order: 2
    title: "Chamar a API só com a chave do pacote"
    explanation: |
      Quem baixa o app consegue abrir o pacote e ler `cliente/config.json`. No laboratório, esse arquivo está no seu workspace. Você vai fazer o que um atacante faria: pegar a chave e chamar a API **sem login**, pedindo a lista de **outra** conta (id `2`).
    task: |
      No **Terminal**:

      ```bash
      cat cliente/config.json
      curl -s -H "X-Api-Key: LUM-APP-KEY-3B71E0C9" "http://127.0.0.1:8080/api/itens?conta=2"
      ```

      O primeiro comando mostra a chave empacotada no app. O segundo pede a lista da conta `2` só com ela, sem token nenhum.

      A API devolveu a lista da conta `2` só com a chave, sem login? Responda **sim** ou **não**.
    explore: |
      **Como isso acontece com um app de verdade.** Um APK é um arquivo zip: `apktool d app.apk` ou `jadx` mostram recursos e código; `strings` acha textos dentro de bibliotecas nativas. Em iOS, o IPA também é um zip. Ferramentas como MobSF fazem essa varredura automaticamente e listam chaves, URLs e tokens encontrados.

      **Por que é grave.** A chave é a mesma para todos os usuários: um vazamento afeta a base inteira e trocar a chave obriga a publicar uma versão nova do app.
    concept: "A chave do pacote abre a conta de qualquer usuário"
    validatorRef: mob-chave-embutida/answer/comportamento-sau-v1
    hints:
      - level: 1
        text: "Veja se a resposta tem a palavra `itens` com dados."
      - level: 2
        text: "A conta `2` não é sua e você não fez login."
      - level: 3
        text: "A resposta é `sim`."
    points: 15
  - id: medida
    order: 3
    title: "Nomear o que o servidor deve exigir"
    explanation: |
      A chave do app identifica **o app**, não **a pessoa**. Para decidir se um pedido pode ler uma conta, o servidor precisa saber quem é o usuário. Isso vem do login: ao conferir usuário e senha, a API emite um valor aleatório e único para aquela sessão, que o app envia em `Authorization: Bearer ...`.
    task: |
      Complete: no lugar da chave fixa do app, o servidor deve exigir o ___ do usuário, emitido no login.

      Responda com uma palavra.
    concept: "O servidor identifica o usuário pelo token do login"
    validatorRef: mob-chave-embutida/answer/defesa-sau-v1
    hints:
      - level: 1
        text: "Veja o que `POST /api/login` devolve."
      - level: 2
        text: "É o valor que o app manda em `Authorization: Bearer`."
      - level: 3
        text: "A resposta é `token`."
    points: 15
  - id: onde
    order: 4
    title: "Separar esconder a chave de proteger a API"
    explanation: |
      Uma reação comum é tentar esconder melhor a chave: cifrar, ofuscar, mover para código nativo. Mas o app precisa montar a chave para usá-la, e o atacante tem o app inteiro nas mãos.
    task: |
      Ofuscar ou esconder melhor a chave dentro do app resolve a falha?

      Responda **sim** ou **não**.
    concept: "Segredo no app não é segredo"
    validatorRef: mob-chave-embutida/answer/onde-sau-v1
    hints:
      - level: 1
        text: "Quem tem o app consegue executar o mesmo código que monta a chave."
      - level: 2
        text: "A decisão de acesso precisa estar no servidor."
      - level: 3
        text: "A resposta é `não`."
    points: 15
  - id: corrigir
    order: 5
    title: "Exigir o token do usuário no serviço de acesso"
    explanation: |
      **Por que a falha existe.** `conta_autorizada` compara só a chave do app e devolve `True` para qualquer `conta_id`.

      **A correção.** Ignorar a chave como critério de acesso: descobrir a conta dona do token enviado e liberar só se ela for a conta pedida. O app continua funcionando, porque ele já envia o token recebido no login.
    task: |
      Abra `services/acesso_service.py` e troque as duas linhas do corpo de `conta_autorizada` (a partir do comentário) por estas:

      ```python
              # Exige o token do usuário (emitido no login) e confere que a conta pedida é a dele.
              dono = self._tokens.conta_do_token(token) if token else None
              return dono is not None and dono == conta_id
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. na aba **Aplicação**, entre de novo e veja que a sua lista continua aparecendo;
      2. no **Terminal**, repita o `curl` só com a chave e veja que agora a resposta é `nao autorizado`;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação e o app no celular para de responder. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o corpo do método fica com 8 espaços e o que está dentro de um `if`, com 12. Copie o bloco da tarefa sem mudar o recuo.
    concept: "Correção: o token do usuário decide, a chave do pacote não"
    validatorRef: mob-chave-embutida/python-flask/acesso-por-token-sau-v1
    hints:
      - level: 1
        text: "A mudança é só em `services/acesso_service.py`, no método `conta_autorizada`."
      - level: 2
        text: "Use `self._tokens.conta_do_token(token)` e compare com `conta_id`."
      - level: 3
        text: "Copie o bloco da tarefa sem mudar o recuo: 8 espaços."
    points: 45

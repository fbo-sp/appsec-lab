learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender que tudo o que vai dentro do pacote do app pode ser lido por qualquer pessoa
    - Explorar a falha chamando a API só com a chave tirada do pacote, sem login
    - Reconhecer que o servidor precisa identificar o usuário por um token emitido no login
    - Corrigir o serviço de acesso exigindo o token e conferindo a conta pedida
  story:
    role: >-
      Pessoa desenvolvedora do time de apps da Clínica Lumen
    application: >-
      App Lumen Saúde, o app em que o paciente consulta os exames
    context: >-
      O app do paciente da Clínica Lumen manda uma chave de API fixa, gravada no pacote, em todo pedido. O servidor confia nessa chave para liberar os exames de qualquer conta.
    mission: >-
      Mostrar que a chave do pacote abre a conta de outro paciente e corrigir a API para exigir o token do usuário
  wrapUp:
    text: |
      Agora a API só responde a quem tem o token emitido no login, e só para a conta dona do token. Em um app real, vale reforçar:

      - **O pacote do app é público.** APK e IPA são baixados por qualquer pessoa e abertos com ferramentas comuns (apktool, jadx, strings). Chave de API, senha de serviço ou token fixo dentro dele deixam de ser segredo no primeiro download.
      - **Ofuscar não resolve.** Esconder a chave em código nativo, partir em pedaços ou cifrar com outra chave do próprio app só atrasa: o app precisa montar o valor para usar, e quem tem o app também consegue.
      - **Quem autoriza é o servidor.** Identifique o usuário por um token emitido no login (de preferência curto, com renovação) e confira, a cada pedido, se o recurso pertence a ele.
      - **Chaves de terceiros vão para trás do seu backend.** Se o app precisa de um serviço pago (mapas, SMS), o servidor chama o serviço; o app chama o seu servidor com o token do usuário.

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender por que toda versão publicada de uma API precisa estar no inventário
    - Descobrir uma versão antiga da API que saiu da documentação mas continua no ar
    - Explorar a versão antiga para ler dados de outro cliente
    - Corrigir aposentando a versão antiga no servidor
  story:
    role: Pessoa desenvolvedora do time digital da Elétrica Serra Azul
    application: Serra Azul Empresas, onde clientes industriais consultam faturas e o consumo de energia pelo navegador e pelo app
    context: >-
      A API de faturas de energia dos clientes industriais ganhou uma v2, que confere se a fatura é da empresa logada. Um cliente reclamou que um concorrente citou, numa negociação, o consumo exato da fábrica dele. A suspeita recai sobre a v1, que saiu da documentação em 2025.
    mission: Descobrir a versão antiga que continua respondendo, mostrar que ela entrega faturas de outros clientes e aposentá-la no servidor
  wrapUp:
    text: |
      Agora a v1 responde "versão desativada" e só a v2, que confere o dono, entrega os faturas. Em um sistema real, vale reforçar:

      - **Inventário é controle de segurança.** Mantenha uma lista viva de todas as APIs, versões, ambientes e rotas publicadas, com dono e data de desativação. O que não está no inventário não recebe correção nem monitoramento.
      - **Sair da documentação não é desligar.** Apagar a versão da documentação só esconde a rota de quem é honesto. Quem ataca procura `v1`, `beta`, `old`, `internal` e acha.
      - **Aposente com prazo.** Ao lançar uma versão nova, defina quando a antiga deixa de responder (HTTP 410 Gone) e avise os clientes, como o app antigo.
      - **Correção em um lugar só.** Se as duas versões precisam conviver, faça as duas passarem pelo mesmo serviço com a regra de acesso, em vez de repetir a consulta em cada controller.

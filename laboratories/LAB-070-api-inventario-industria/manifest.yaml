steps:
  - id: conhecer
    order: 1
    title: Conhecer a API e a documentação publicada
    explanation: |
      Você é do time digital da Elétrica Serra Azul. Em 2025 a API de faturas dos clientes industriais ganhou uma v2, que confere se a fatura é da empresa logada, e a v1 saiu da documentação. Agora um cliente reclamou que um concorrente citou, numa negociação, o consumo exato da fábrica dele. A gerência abriu um chamado para saber por onde esse dado saiu.

      Uma API costuma ganhar versões: `/api/v1/...`, depois `/api/v2/...`. A versão nova corrige problemas da antiga, mas os clientes antigos (como o app Serra Azul Empresas 1.x que ainda não foi atualizado) continuam chamando a anterior. Por isso as versões convivem por um tempo. O risco aparece quando ninguém sabe mais quais versões estão no ar: a **gestão de inventário de API** (OWASP API9) é justamente manter essa lista viva.

      ```ilustracao
      inventario-api
      ```

      Siga o pedido pelas camadas:

      1. **Controller da v2** (`controllers/api_v2_controller.py`): recebe `/api/v2/faturas/<id>`.
      2. **Serviço** (`services/documento_service.py`): devolve o documento só se ele for da conta logada.
      3. **Repositório** (`repositories/documento_repository.py`): busca no banco pelo id.

      As credenciais, neste laboratório, são:

      - Cliente: `compras.metalfort`, senha `Metalfort#Serra26` (Metalfort Indústria de Peças Ltda.).
    task: |
      1. Na aba **Aplicação**, entre como `compras.metalfort` / `Metalfort#Serra26`. No painel, clique no link da coluna "API" do fatura nº `101`: o navegador mostra o JSON que o app recebe.
      2. Volte ao painel e abra a **documentação da API** (link no fim da página, ou o endereço `/api/docs`).

      Informe abaixo qual versão da API a documentação publica.
    concept: Versões de API convivem; o inventário diz quais estão no ar
    validatorRef: api-inventario/answer/versao-ind-v1
    hints:
      - level: 1
        text: A documentação diz "Versão publicada" logo no topo.
      - level: 2
        text: É a mesma versão que aparece nos links do painel.
      - level: 3
        text: A resposta é `v2`.
    points: 10
  - id: descobrir
    order: 2
    title: Encontrar a versão que ficou fora da documentação
    explanation: |
      A documentação só lista a v2. Mas o que vale é o que o servidor registra. Em Flask, cada grupo de rotas é um **blueprint**, e o `app.py` diz quais estão ligados. Quem ataca faz o mesmo raciocínio de fora: se existe `v2`, tenta `v1`.
    task: |
      Na aba **Código**, abra `app.py` e veja os `register_blueprint`. Um deles registra uma versão que **não** aparece na documentação.

      Informe abaixo o nome do arquivo do controller dessa versão (por exemplo, `algum_controller.py`).
    explore: |
      **Por que olhar o código e não só a documentação.** Documentação é uma promessa; o código registrado é o que de fato responde. Em empresas grandes, é comum achar versões antigas, rotas de teste e ambientes de homologação expostos que ninguém lembra de ter publicado.

      **Como achar de fora.** Ferramentas de varredura testam prefixos comuns (`v1`, `v3`, `beta`, `old`, `internal`, `mobile`). Pelo **Terminal**, você confirma que a rota existe:

      ```bash
      grep -n "api/v" controllers/*.py
      ```
    concept: O servidor registra mais versões do que a documentação mostra
    validatorRef: api-inventario/answer/arquivo-ind-v1
    hints:
      - level: 1
        text: Procure, em `app.py`, o blueprint com o comentário sobre o app antigo.
      - level: 2
        text: O blueprint é `api_v1_bp`; veja de qual arquivo ele é importado.
      - level: 3
        text: A resposta é `api_v1_controller.py`.
    points: 15
  - id: explorar
    order: 3
    title: Ler o documento de outro cliente pela v1
    explanation: |
      Abra `controllers/api_v1_controller.py` e compare com a v2. A v1 chama o repositório direto, pelo id, e **não passa pelo serviço que confere o dono**. A v2 corrigiu esse problema, mas a v1 continuou no ar.
    task: |
      Ainda logado como `compras.metalfort`, digite na barra de endereço da aba **Aplicação** a rota da v2 com o nº de um fatura que **não** é seu:

      ```
      /api/v2/faturas/201
      ```

      A v2 responde "não encontrado". Agora troque só a versão:

      ```
      /api/v1/faturas/201
      ```

      Informe abaixo o nome completo do titular que aparece na resposta da v1.
    explore: |
      **Por que isso é grave.** Consumo, demanda contratada e valor da fatura revelam o ritmo de produção de uma fábrica. Para um concorrente, é informação estratégica; para a distribuidora, é quebra de sigilo comercial do cliente.

      **O que mais a v1 entrega.** Os números são sequenciais: trocando o id, dá para percorrer todos os faturas da base. É a mesma falha de IDOR que a v2 já tinha corrigido, reaberta por uma versão esquecida.
    concept: Uma versão antiga no ar reabre uma falha que a nova já tinha corrigido
    validatorRef: api-inventario/answer/titular-ind-v1
    hints:
      - level: 1
        text: Use exatamente a rota da tarefa, trocando `v2` por `v1`.
      - level: 2
        text: O campo `titular` do JSON traz o nome.
      - level: 3
        text: A resposta é `Têxtil Vale Verde S.A.`.
    points: 15
  - id: conceito
    order: 4
    title: Nomear o controle que faltou
    explanation: |
      Ninguém escreveu um código novo vulnerável: a falha nasceu de **processo**. A v1 saiu da documentação, mas não havia uma lista das versões no ar, com dono e data de desligamento. Esse controle tem nome na OWASP: gestão de inventário (API9:2023; na edição 2019, "gestão de ativos").
    task: |
      Qual é a palavra para a lista viva de todas as APIs, versões e rotas que uma empresa tem publicadas?

      Responda com uma palavra.
    concept: Gestão de inventário de APIs (OWASP API9)
    validatorRef: api-inventario/answer/conceito-ind-v1
    hints:
      - level: 1
        text: É a mesma palavra usada para a lista de bens de uma empresa.
      - level: 2
        text: Está no nome do item API9 da OWASP 2023.
      - level: 3
        text: A resposta é `inventário`.
    points: 15
  - id: corrigir
    order: 5
    title: Aposentar a versão 1 no servidor
    explanation: |
      **Por que a falha existe.** A rota `/api/v1/faturas/<id>` continua registrada e devolve o documento de qualquer conta.

      **A correção.** Aposentar a v1: ela passa a responder **HTTP 410 Gone** ("versão desativada"), que diz aos clientes antigos que a rota acabou de propósito, não que deu erro. O app antigo é avisado para usar a v2. Apagar a rota da documentação não basta: é preciso mudar o que o servidor responde.
    task: |
      Abra `controllers/api_v1_controller.py` e troque a função `buscar_v1` inteira (com as duas linhas de `@` acima dela) por esta:

      ```python
      @api_v1_bp.get("/api/v1/faturas/<int:doc_id>")
      @login_obrigatorio
      def buscar_v1(doc_id: int):
          """Versão 1 (legada): desativada. Os apps devem usar a v2."""
          return jsonify({"erro": "versão desativada; use /api/v2"}), 410
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. abra `/api/v1/faturas/201` e veja a resposta "versão desativada";
      2. abra `/api/v2/faturas/101` e veja que o seu fatura **continua** vindo;
      3. clique em **Validar**.
    explore: |
      **Outra correção aceita.** Se o app antigo ainda precisa da v1 por algumas semanas, a v1 pode chamar o mesmo `DocumentoService.buscar_do_dono` da v2 e devolver 404 para documento de outra conta. A validação aceita as duas, desde que a v1 nunca devolva dado de outro cliente.

      **Se algo não funcionar depois de salvar.** No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      O `@api_v1_bp.get` e o `def` ficam sem recuo; o corpo da função, com 4 espaços.
    concept: Aposentar no servidor a versão que ficou fora do inventário
    validatorRef: api-inventario/python-flask/versao-antiga-ind-v1
    hints:
      - level: 1
        text: 'A mudança é só em `controllers/api_v1_controller.py`, na função `buscar_v1`.'
      - level: 2
        text: A função passa a devolver o JSON de erro com o código 410, sem consultar o banco.
      - level: 3
        text: Copie a função da tarefa sem mudar o recuo e mantenha as duas linhas de `@`.
    points: 45
policy:
  sequentialUnlock: true
  allowStepRetry: true
  persistProgressAcrossReset: true
  allowSolutionReveal: false
  finalPassingScore: 100

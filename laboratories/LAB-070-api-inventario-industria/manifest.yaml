# LAB-070 (L5-IND): versão antiga da API esquecida no ar (OWASP API9, CWE-1059) no Serra Azul Empresas da Elétrica Serra Azul (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família L5 api-inventario (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/api-inventario; não edite este arquivo à mão.
#

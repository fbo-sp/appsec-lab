{% extends "base.html" %}
{% block conteudo %}
<h1>Meus favorecidos</h1>
<form method="get" action="{{ url_for('favorecido.buscar') }}" class="busca">
  <input name="q" value="{{ termo }}" placeholder="Nome do favorecido" aria-label="Meus favorecidos">
  <button type="submit">Buscar</button>
</form>

{% if termo %}
{# O serviço já remove <script> do termo, então o destaque pode ir direto para a página. #}
<p class="resultado">Resultados para <mark>{{ termo|safe }}</mark></p>
{% endif %}

<table class="lista">
  <thead><tr><th>Nome do favorecido</th><th>Chave PIX</th><th>Apelido</th></tr></thead>
  <tbody>
  {% for item in itens %}
    <tr><td>{{ item.nome }}</td><td>{{ item.detalhe }}</td><td>{{ item.nota }}</td></tr>
  {% else %}
    <tr><td colspan="3" class="vazio">Nada encontrado.</td></tr>
  {% endfor %}
  </tbody>
</table>

<h2>Cadastrar favorecido</h2>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<form method="post" action="{{ url_for('favorecido.cadastrar') }}" class="cartao cadastro">
  <label>Nome do favorecido <input name="nome" required></label>
  <label>Chave PIX <input name="detalhe"></label>
  <label>Apelido <input name="nota" placeholder="Ex.: aluguel, faxina"></label>
  <button type="submit">Cadastrar</button>
</form>
{% endblock %}

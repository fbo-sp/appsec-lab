# LAB-005 (A1-FIN): Cross-Site Scripting (CWE-79) no Internet Banking da Banco Aurora Digital (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios (domínio .example). Família A1 XSS (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/xss; não edite este arquivo à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

learning:
  singleVulnerability: true
  estimatedMinutes: 40
  difficulty: beginner
  objectives:
    - Seguir o texto digitado pelo usuário desde o formulário até o HTML da resposta
    - Entender por que uma lista de bloqueio (remover <script>) não impede XSS
    - Demonstrar XSS refletido e armazenado lendo cookies sem HttpOnly, com dados fictícios
    - Corrigir a falha deixando o Jinja2 codificar a saída, sem quebrar a busca legítima
  story:
    role: Desenvolvedor(a) do time de canais digitais do Banco Aurora Digital
    application: Internet Banking, telas "Meus favorecidos" e "Painel antifraude"
    context: >-
      Um teste de invasão apontou XSS na busca de favorecidos de PIX. O time removeu a tag script do texto digitado e deu o problema por resolvido. A equipe de segurança pediu uma segunda opinião antes da liberação.
    mission: Provar se a proteção funciona, medir o impacto para clientes e gerentes e corrigir o código
  wrapUp:
    text: |
      Agora o texto digitado sempre chega à página como **texto**, nunca como HTML. Em um sistema real, vale reforçar outras camadas:

      - **Cookies sensíveis com HttpOnly.** O cookie de sessão do Flask já era HttpOnly e por isso não apareceu no ataque. O `dispositivo` e o `aprovacao_gerente` não eram: se o front-end não precisa lê-los, marque `httponly=True` em `set_cookie`.
      - **Content Security Policy (CSP).** O cabeçalho `Content-Security-Policy: script-src 'self'` impede scripts embutidos na página e atributos como `onerror`. É uma segunda barreira, não substitui a codificação da saída.
      - **Quando o HTML é necessário.** Se o usuário realmente precisa formatar texto, use uma biblioteca de sanitização com lista de permissão (por exemplo `nh3`), nunca uma lista de bloqueio feita à mão.
      - **Cada contexto tem sua codificação.** O autoescape do Jinja2 protege o corpo do HTML e atributos entre aspas. Dentro de `<script>`, em URLs ou em CSS as regras são outras: o OWASP tem um guia para cada contexto.
      - **O mesmo vale em outros frameworks.** React escapa por padrão, mas `dangerouslySetInnerHTML` faz o papel do `|safe`. Procure esses pontos em revisões de código.
    references:
      - title: "OWASP Cheat Sheet: Cross Site Scripting Prevention"
        url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - title: "OWASP Top 10:2025: A05 Injection"
        url: https://owasp.org/Top10/2025/A05_2025-Injection/
      - title: "CWE-79: Improper Neutralization of Input During Web Page Generation"
        url: https://cwe.mitre.org/data/definitions/79.html
      - title: "MDN: Content Security Policy"
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP

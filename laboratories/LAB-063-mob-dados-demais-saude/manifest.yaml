steps:
  - id: conhecer
    order: 1
    title: "Conhecer a tela Perfil e o serviço por trás dela"
    explanation: |
      Você está no time de apps da Clínica Lumen. A tela Perfil do app do paciente da Clínica Lumen mostra só o nome e um resumo. Numa revisão de privacidade, o time de segurança interceptou o tráfego do app e viu que a API entrega bem mais do que isso ao aparelho.

      **Um laboratório mobile.** Na aba **Aplicação**, o app aparece numa moldura de celular. Ele é um app **simulado** (não há emulador), mas fala com a API do servidor do mesmo jeito que um app Android ou iOS. Toda falha de app mobile termina numa decisão de segurança: quem a toma, o aparelho ou o servidor?

      ```ilustracao
      mob-dados-demais
      ```

      Siga a tela Perfil pelas camadas:

      1. **App** (`static/app.js`): a aba **Perfil** chama `GET /api/perfil` e mostra o nome e o resumo.
      2. **Controller** (`controllers/api_controller.py`): recebe `GET /api/perfil` e chama o serviço.
      3. **Serviço** (`services/perfil_service.py`): monta os dados do perfil. **É aqui que está a falha.**

      As credenciais de teste deste laboratório são:

      - Usuário `marcos.tavares`, senha `Marcos#Lumen26` (Marcos Tavares Lima).
    task: |
      1. Na aba **Aplicação**, entre no app do celular com `marcos.tavares` e a senha `Marcos#Lumen26`. Toque em **Perfil**, na barra de baixo, e veja o que a tela mostra.
      2. Na aba **Código**, abra `services/perfil_service.py`.

      Informe abaixo o nome do método que monta os dados do perfil.
    concept: "A tela mostra pouco; a API decide o que sai do servidor"
    validatorRef: mob-dados-demais/answer/metodo-sau-v1
    hints:
      - level: 1
        text: "A classe `PerfilService` tem um método público além de `__init__`."
      - level: 2
        text: "É o método chamado em `GET /api/perfil`."
      - level: 3
        text: "O valor é `perfil`."
    points: 10
  - id: explorar
    order: 2
    title: "Comparar a tela com a resposta da API"
    explanation: |
      Você viu o que a tela Perfil mostra. Agora veja o que a API entrega ao aparelho, como faria quem intercepta o tráfego do app.
    task: |
      No **Terminal**, entre pela API e guarde o token:

      ```bash
      TOKEN=$(curl -s -X POST http://127.0.0.1:8080/api/login \
        -H "Content-Type: application/json" \
        -d '{"login":"marcos.tavares","senha":"Marcos#Lumen26"}' \
        | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
      echo "$TOKEN"
      ```

      Agora peça o perfil:

      ```bash
      curl -s http://127.0.0.1:8080/api/perfil -H "Authorization: Bearer $TOKEN"
      ```

      A resposta traz dados pessoais que a tela não mostra? Responda **sim** ou **não**.
    explore: |
      **Como isso aparece num app de verdade.** Com um proxy (Burp, mitmproxy) e o certificado instalado no aparelho de teste, cada resposta da API fica legível. Respostas também acabam em caches HTTP, logs de depuração e ferramentas de monitoramento de erro. Neste ramo, o dado extra é CPF e diagnóstico (CID).
    concept: "A resposta da API vai além da tela"
    validatorRef: mob-dados-demais/answer/comportamento-sau-v1
    hints:
      - level: 1
        text: "Compare os campos da resposta com o que a aba Perfil mostrou."
      - level: 2
        text: "Procure `documento` e `dado_pessoal`."
      - level: 3
        text: "A resposta é `sim`."
    points: 15
  - id: medida
    order: 3
    title: "Nomear o princípio"
    explanation: |
      A API deveria entregar só os dados de que a tela precisa para funcionar. Esse princípio de privacidade aparece na LGPD e no MASVS-PRIVACY: coletar, guardar e transmitir o mínimo necessário.
    task: |
      Qual é o nome desse princípio? Responda com uma palavra.
    concept: "Minimização de dados"
    validatorRef: mob-dados-demais/answer/defesa-sau-v1
    hints:
      - level: 1
        text: "É o princípio de usar o mínimo necessário."
      - level: 2
        text: "Começa com \"mini\"."
      - level: 3
        text: "A resposta é `minimização`."
    points: 15
  - id: onde
    order: 4
    title: "Decidir se esconder na tela basta"
    explanation: |
      Uma correção tentadora é garantir que a tela nunca mostre os campos extras. Mas a tela não é o único lugar por onde a resposta passa.
    task: |
      Esconder os campos na tela do app resolve a falha?

      Responda **sim** ou **não**.
    concept: "Esconder na tela não protege o dado"
    validatorRef: mob-dados-demais/answer/onde-sau-v1
    hints:
      - level: 1
        text: "Você leu os campos com `curl`, sem tela nenhuma."
      - level: 2
        text: "O dado já tinha saído do servidor."
      - level: 3
        text: "A resposta é `não`."
    points: 15
  - id: corrigir
    order: 5
    title: "Devolver só os campos da tela"
    explanation: |
      **Por que a falha existe.** `perfil` devolve o dicionário inteiro de `perfil_completo`, com documento e dado pessoal.

      **A correção.** Montar a resposta com uma lista explícita de campos: só `nome` e `resumo`.
    task: |
      Abra `services/perfil_service.py` e troque as duas linhas do corpo de `perfil` (a partir do comentário) por estas:

      ```python
              # Devolve só o que a tela usa (minimização): nome e resumo.
              perfil = self._repositorio.perfil_completo(conta_id)
              return {"nome": perfil["nome"], "resumo": perfil["resumo"]}
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. na aba **Aplicação**, entre de novo e abra **Perfil**: a tela continua igual;
      2. no **Terminal**, refaça o `curl` e veja que só voltam `nome` e `resumo`;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação e o app no celular para de responder. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o corpo do método fica com 8 espaços e o que está dentro de um `if`, com 12. Copie o bloco da tarefa sem mudar o recuo.
    concept: "Correção: a API devolve só o que a tela usa"
    validatorRef: mob-dados-demais/python-flask/perfil-minimo-sau-v1
    hints:
      - level: 1
        text: "A mudança é só em `services/perfil_service.py`, no método `perfil`."
      - level: 2
        text: "Tirar só o `documento` não basta: o dado pessoal também sai."
      - level: 3
        text: "Copie o bloco da tarefa sem mudar o recuo: 8 espaços."
    points: 45

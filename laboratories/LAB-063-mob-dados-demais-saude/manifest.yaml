# interna da sessão. Dados 100% fictícios. Família MOB-08 mob-dados-demais (ADR-021, ADR-025): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/mob-dados-demais; não edite este arquivo à mão.

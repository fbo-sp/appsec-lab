learning:
  singleVulnerability: true
  estimatedMinutes: 30
  difficulty: beginner
  objectives:
    - Entender que o que a tela esconde continua visível na resposta da API
    - Comparar o que o app mostra com o que a API entrega ao aparelho
    - Reconhecer o princípio da minimização de dados
    - Corrigir o serviço para devolver só os campos que a tela usa
  story:
    role: >-
      Pessoa desenvolvedora do time de apps da Clínica Lumen
    application: >-
      App Lumen Saúde, o app em que o paciente consulta os exames e o próprio perfil
    context: >-
      A tela Perfil do app do paciente da Clínica Lumen mostra nome e resumo, mas a API devolve o registro inteiro da conta, com dados pessoais.
    mission: >-
      Comparar a tela com a resposta da API e corrigir a API para devolver só o que a tela usa
  wrapUp:
    text: |
      Agora a API devolve só o nome e o resumo, que é o que a tela usa. Em um app real, vale reforçar:

      - **A tela não é o filtro.** Tudo o que chega ao aparelho pode ser visto num proxy, num log ou num app modificado. Esconder um campo na interface não protege o dado.
      - **Minimização desde a API.** Monte respostas com uma lista explícita de campos (DTO, serializer), nunca com o registro inteiro do banco. Campo novo no banco não deve aparecer na API sem decisão.
      - **Privacidade é requisito.** Dado pessoal ou sensível (documento, renda, diagnóstico, endereço) só sai do servidor quando a tela precisa dele, e só para o dono.
      - **Logs e caches também contam.** Respostas grandes vão parar em cache HTTP, logs de depuração e ferramentas de monitoramento.

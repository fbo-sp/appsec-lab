steps:
  - id: conhecer
    order: 1
    title: "Conhecer o app e achar quem identifica o usuário"
    explanation: |
      Você está no time de apps da Clínica Lumen. A tela de login do app do paciente da Clínica Lumen publicado na loja ainda mostra a etiqueta "Modo homologação". Um pesquisador avisou que, com um cabeçalho que o app de testes usava, a API abre uma conta sem login.

      **Um laboratório mobile.** Na aba **Aplicação**, o app aparece numa moldura de celular. Ele é um app **simulado** (não há emulador), mas fala com a API do servidor do mesmo jeito que um app Android ou iOS. Toda falha de app mobile termina numa decisão de segurança: quem a toma, o aparelho ou o servidor?

      ```ilustracao
      mob-modo-teste
      ```

      Siga um pedido pelas camadas:

      1. **App** (`static/app.js`): envia o token do login em `Authorization: Bearer`.
      2. **Controller** (`controllers/api_controller.py`): toda rota pergunta ao serviço de identidade quem é o usuário.
      3. **Serviço** (`services/identidade_service.py`): identifica o usuário do pedido. **É aqui que está a falha.**

      As credenciais de teste deste laboratório são:

      - Usuário `marcos.tavares`, senha `Marcos#Lumen26` (Marcos Tavares Lima).
    task: |
      1. Na aba **Aplicação**, veja a etiqueta **Modo homologação** na tela de login e entre com `marcos.tavares` e a senha `Marcos#Lumen26`.
      2. Na aba **Código**, abra `services/identidade_service.py`.

      Informe abaixo o nome do método que identifica o usuário do pedido.
    concept: "Código de teste esquecido vira porta dos fundos"
    validatorRef: mob-modo-teste/answer/metodo-sau-v1
    hints:
      - level: 1
        text: "A classe `IdentidadeService` tem um método público além de `__init__`."
      - level: 2
        text: "É o método chamado por `conta_logada` no controller."
      - level: 3
        text: "O valor é `identificar`."
    points: 10
  - id: explorar
    order: 2
    title: "Entrar sem login com o atalho"
    explanation: |
      Leia o método `identificar`: antes de olhar o token, ele confere um cabeçalho. Faça o que o pesquisador fez: chame a API sem login, primeiro sem e depois com esse cabeçalho.
    task: |
      No **Terminal**:

      ```bash
      curl -s http://127.0.0.1:8080/api/conta
      curl -s http://127.0.0.1:8080/api/conta -H "X-Debug: 1"
      ```

      Sem login e com `X-Debug: 1`, a API devolveu os dados de uma conta? Responda **sim** ou **não**.
    explore: |
      **Como se acha isso num app de verdade.** Descompilando o app (jadx, apktool) e procurando por `debug`, `test`, `X-` ou URLs de homologação; ou observando o tráfego do app de testes. Etiquetas e menus escondidos na versão da loja são pistas comuns.
    concept: "O atalho de teste abre uma conta sem login"
    validatorRef: mob-modo-teste/answer/comportamento-sau-v1
    hints:
      - level: 1
        text: "Compare as duas respostas."
      - level: 2
        text: "A segunda traz um nome e um resumo."
      - level: 3
        text: "A resposta é `sim`."
    points: 15
  - id: medida
    order: 3
    title: "Identificar o cabeçalho do atalho"
    explanation: |
      O atalho depende de um cabeçalho HTTP que qualquer pessoa pode enviar.
    task: |
      Qual cabeçalho liga o atalho de homologação? Responda com o nome do cabeçalho.
    concept: "Cabeçalho é escrito por quem envia o pedido"
    validatorRef: mob-modo-teste/answer/defesa-sau-v1
    hints:
      - level: 1
        text: "Está no `if` do método `identificar`."
      - level: 2
        text: "Começa com `X-`."
      - level: 3
        text: "A resposta é `X-Debug`."
    points: 15
  - id: onde
    order: 4
    title: "Decidir se o atalho pode ficar"
    explanation: |
      Atalhos de teste aceleram a homologação. A questão é onde eles podem existir.
    task: |
      Esse atalho deveria existir no build de produção?

      Responda **sim** ou **não**.
    concept: "Atalho de teste não vai para produção"
    validatorRef: mob-modo-teste/answer/onde-sau-v1
    hints:
      - level: 1
        text: "Você entrou numa conta sem senha nenhuma."
      - level: 2
        text: "Qualquer pessoa pode mandar o cabeçalho."
      - level: 3
        text: "A resposta é `não`."
    points: 15
  - id: corrigir
    order: 5
    title: "Remover o atalho de homologação"
    explanation: |
      **Por que a falha existe.** `identificar` devolve a conta 1 sempre que `X-Debug` vale `1`, antes de olhar o token.

      **A correção.** Remover o atalho: só o token emitido no login identifica o usuário.
    task: |
      Abra `services/identidade_service.py` e troque as quatro linhas do corpo de `identificar` (a partir do comentário) por estas:

      ```python
              # Sem atalho de teste em produção: só o token emitido no login identifica o usuário.
              return self._tokens.conta_do_token(token) if token else None
      ```

      Salve com **Ctrl+S**. A aplicação reinicia. Então:

      1. na aba **Aplicação**, entre de novo e veja que o app continua funcionando;
      2. no **Terminal**, repita o `curl` com `X-Debug: 1` e veja `nao autorizado`;
      3. clique em **Validar**.
    explore: |
      **Se algo não funcionar depois de salvar.** Um recuo errado derruba a aplicação e o app no celular para de responder. No **Terminal**:

      ```bash
      grep -iE "error|traceback" /tmp/app.log | tail -n 15
      ```

      **O que procurar.** `IndentationError` aponta a linha com recuo diferente: o corpo do método fica com 8 espaços e o que está dentro de um `if`, com 12. Copie o bloco da tarefa sem mudar o recuo.
    concept: "Correção: sem atalho, só o token identifica"
    validatorRef: mob-modo-teste/python-flask/sem-atalho-sau-v1
    hints:
      - level: 1
        text: "A mudança é só em `services/identidade_service.py`, no método `identificar`."
      - level: 2
        text: "Apague o `if` do `X-Debug` inteiro."
      - level: 3
        text: "Copie o bloco da tarefa sem mudar o recuo: 8 espaços."
    points: 45
policy:
  sequentialUnlock: true
  allowStepRetry: true
  persistProgressAcrossReset: true

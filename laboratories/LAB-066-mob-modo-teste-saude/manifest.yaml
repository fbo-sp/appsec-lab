  objectives:
    - Entender como código de teste esquecido vira porta dos fundos em produção
    - Explorar o atalho de homologação para entrar numa conta sem login
    - Identificar o cabeçalho que liga o atalho
    - Corrigir a identificação do usuário removendo o atalho
  story:
    role: >-
      Pessoa desenvolvedora do time de apps da Clínica Lumen
    application: >-
      App Lumen Saúde, o app em que o paciente consulta os exames
    context: >-
      O app do paciente da Clínica Lumen de testes usava um cabeçalho para pular o login. O atalho ficou na API de produção.
    mission: >-
      Encontrar o atalho de homologação, entrar sem login e removê-lo da API
  wrapUp:
    text: |
      Agora só o token do login identifica o usuário, e o atalho de homologação não existe mais. Em um app real, vale reforçar:

      - **Build de produção sem atalhos.** Contas de teste, cabeçalhos mágicos, telas de depuração e endpoints internos ficam fora do build publicado. Use variantes de build (debug/release, flavors, schemes) e configuração por ambiente, não `if` esquecido.
      - **Revisão e testes pegam o atalho.** Busque no código por `debug`, `test`, `bypass`, `X-` customizados; um teste automatizado pode chamar a API de produção com esses cabeçalhos e exigir 401.
      - **Não confie no que o app manda.** Cabeçalhos são escritos por quem controla o app, inclusive o atacante.
      - **Sinal no app é pista.** Uma etiqueta "homologação" ou um menu escondido na versão da loja costuma indicar funcionalidade esquecida.

learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: beginner
  objectives:
    - Ler uma API JSON e descobrir quais campos o servidor guarda para cada usuário
    - Entender por que repassar o corpo inteiro da requisição para o banco permite alterar campos protegidos
    - Elevar o próprio benefício e o próprio perfil de acesso com uma única requisição, com dados fictícios
    - Corrigir a falha com uma lista de campos permitidos no serviço, sem quebrar a edição legítima
  story:
    role: Desenvolvedor(a) do time de sistemas corporativos da Termoverde Geração
    application: Portal de Fornecedores, tela "Meu perfil" e a API /api/perfil
    context: >-
      Fornecedores atualizam o próprio cadastro pelo Portal de Fornecedores, que usa a API de perfil. O time de compras estranhou um fornecedor pequeno faturando pedidos grandes sem aprovação e pediu uma análise da API.
    mission: Descobrir como a categoria mudou, demonstrar o impacto e corrigir o serviço
  wrapUp:
    text: |
      Agora a API só grava os campos que a regra de negócio permite ao próprio usuário. Em um sistema real, vale reforçar outras camadas:

      - **Um objeto de entrada por operação.** Em vez de um dicionário solto, declare o que cada rota aceita (por exemplo, um modelo `pydantic` ou um `dataclass` só com `email` e `telefone`) e recuse campos extras. Frameworks chamam isso de *DTO* ou *schema* de entrada.
      - **Lista de permissão, nunca de bloqueio.** Uma lista de campos proibidos esquece a próxima coluna criada no banco. A lista de permitidos falha do jeito seguro: um campo novo só fica editável quando alguém decide isso.
      - **Campos sensíveis com rota própria.** Mudar `perfil` ou `categoria` é uma operação de outra pessoa (um administrador, um fluxo de aprovação), com autorização e trilha de auditoria próprias.
      - **O mesmo erro em ORMs.** `Model(**request.json)`, `obj.update(request.json)`, `setattr` em laço, `fill()` sem `$fillable` no Laravel e *binding* automático no Spring e no ASP.NET são a mesma falha com outro nome.
      - **A resposta também conta.** A API devolve o perfil e o categoria do fornecedor do usuário. Devolver só o necessário (OWASP API3) dificulta descobrir os campos internos.
    references:
      - title: "OWASP Cheat Sheet: Mass Assignment"
        url: https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
      - title: "OWASP API Security Top 10 2023: API3 Broken Object Property Level Authorization"

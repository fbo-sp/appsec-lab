# LAB-010 (A5-IND): Mass Assignment (CWE-915) no Portal de Fornecedores da Termoverde Geração (Flask + SQLite).
# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios (domínio .example). Família A5 mass-assignment (ADR-021): gerado
# por scripts/gerar-familia.py a partir de laboratories/_familias/mass-assignment; não edite à mão.
#
# ATENÇÃO: o digest abaixo é uma FIXTURE (sha256 de um texto fixo), não uma imagem publicada.
# scripts/lab-local.sh e .ps1 trocam pela imagem construída localmente antes de registrar.

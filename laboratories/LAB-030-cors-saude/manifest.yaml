# CONTÉM VULNERABILIDADE INTENCIONAL. Uso exclusivo no runtime Docker LOCAL (ADR-008), em rede
# interna da sessão. Dados 100% fictícios. Família A7 cors (ADR-021): gerado por
# scripts/gerar-familia.py a partir de laboratories/_familias/cors; não edite este arquivo à mão.

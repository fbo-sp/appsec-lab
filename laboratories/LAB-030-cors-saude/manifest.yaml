learning:
  singleVulnerability: true
  estimatedMinutes: 35
  difficulty: intermediate
  objectives:
    - Entender o que o CORS controla e o que o cabeçalho Access-Control-Allow-Origin libera
    - Explorar a falha vendo a API refletir qualquer origem enviada na requisição
    - Reconhecer o risco de refletir a origem junto com Allow-Credentials
    - Corrigir liberando só origens confiáveis, de uma lista conhecida
  story:
    role: Pessoa desenvolvedora do time de produtos digitais da operadora Vitalis
    application: Portal do Beneficiário, onde o beneficiário vê o próprio perfil carregado pela API da operadora
    context: >-
      O Portal do Beneficiário carrega o perfil por uma API. Numa auditoria, a equipe apontou que a API de perfil reflete qualquer origem no CORS — um site malicioso que o beneficiário visite consegue ler, pelo navegador dele, os dados da conta logada.
    mission: Confirmar que a API reflete qualquer origem e corrigir liberando só origens confiáveis
  wrapUp:
    text: |
      Agora a API só libera, pelo CORS, origens confiáveis de uma lista conhecida. Em um sistema real, vale reforçar:

      - **CORS é uma permissão, não uma defesa de autenticação.** Ele diz ao navegador quais origens podem LER a resposta. Refletir a origem recebida equivale a liberar para todo mundo — inclusive um site malicioso que a vítima visite.
      - **Refletir a origem com `Allow-Credentials: true` é o pior caso.** Junto, eles dizem "qualquer site pode ler esta resposta usando o cookie de sessão do usuário". É assim que um site de terceiros lê dados da API autenticada da vítima.
      - **Use uma lista de origens confiáveis (allowlist).** Compare a origem recebida com uma lista fixa e só então ecoe o `Access-Control-Allow-Origin`. Para origens de fora, não mande cabeçalho de CORS nenhum.
      - **Nunca use `*` com credenciais.** O curinga não pode ser combinado com `Allow-Credentials`, e mesmo sem credenciais ele expõe a resposta a qualquer origem — só sirva assim recursos realmente públicos.

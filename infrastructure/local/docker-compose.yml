# Componentes CONFIÁVEIS de desenvolvimento local. Não execute laboratórios vulneráveis aqui:
# Docker Compose não é fronteira de isolamento para código hostil (ver docs/07, ADR-002).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: appsec_labs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - appsec-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec"]
      interval: 5s
      retries: 10
volumes:
  appsec-pg:

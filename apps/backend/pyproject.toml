[project]
name = "cecyber-backend"
version = "0.1.0"
description = "Plano de controle do CECyber AppSec Labs (monólito modular FastAPI + workers)"
requires-python = ">=3.12"
dependencies = [
    "cecyber-contracts",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0.32,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "PyYAML>=6.0",
    "aiohttp>=3.12,<4",
]

[project.optional-dependencies]
docker-runtime = [
    "docker>=7.1,<8",
]

[tool.uv.sources]
cecyber-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appsec
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: appsec_labs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appsec" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://appsec:ci-only-password@localhost:5432/appsec_labs_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/contracts/src apps/backend/app
      - run: uv run python -m cecyber_contracts validate laboratories/LAB-000-hello-benign/manifest.yaml
      - run: uv run python -m cecyber_contracts validate laboratories/LAB-001-sqli-clinica/manifest.yaml
      - run: uv run pytest
        env:
          # Suíte de contrato e controles do runtime Docker LOCAL (ADR-008) contra o Docker do runner.
          DOCKER_CONTRACT_TESTS: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Inclui os testes do Markdown restrito (ADR-012): sem HTML cru, links só https.
      - run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/smoke-compose.sh
      - run: scripts/smoke-compose.sh --no-build --docker-runtime
